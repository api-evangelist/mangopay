  /v2.01/{ClientId}/clients/wallets/{FundsType}/{Currency}/transactions:
    get:
      operationId: transactions_list_transactions_client_wallet
      summary: List Transactions for a Client Wallet
      description: 'List Transactions for a Client Wallet


        This call returns all the transactions targeting or emitted from a Client Wallet, for example:

        - Fees payouts made from the Fees Wallet (`FEES_CCY`)

        - Repudiations and settlements made from or to the Repudiation Wallet (`CREDIT_CCY`)

        - Conversions between Client Wallets'
      tags:
      - Transactions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: FundsType
        in: path
        description: '**Allowed values:** `FEES`, `CREDIT`


          The type of funds in the Client Wallet:

          - `FEES` – Fees Wallet, for fees collected by the platform, specific to the Client Wallet object.

          - `CREDIT` – Repudiation Wallet, for funds for the platform''s dispute management, specific to the Client Wallet object.


          **Note:** The Fees Wallet and Repudiation Wallet are created automatically by Mangopay for each currency.'
        required: true
        schema:
          type: string
      - name: Currency
        in: path
        description: '**Allowed values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


          The currency of the wallet.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListTransactionsResponse'
      security:
      - oauth2: []
