  /v2.01/{ClientId}/deposit-preauthorizations/{DepositId}/transactions:
    get:
      operationId: transactions_list_transactions_deposit_preauthorization
      summary: List Transactions for a Deposit Preauthorization
      description: '**Warning – Deprecated feature**


        This endpoint is deprecated. Use GET List Transactions for an Extended Preauthorization instead.


        The Deposit Preauthorization endpoints are scheduled for decommissioning at the end of 2027. Platforms with existing integrations need to move to the new endpoints at their earliest convenience before then.


        The Extended Preauthorization feature is a like-for-like renaming of the legacy Deposit Preauthorization – the behavior is otherwise unchanged.


        The previous use of the term "deposit" was for convenience only and does not constitute a traditional banking deposit under applicable banking regulations, including the EU Capital Requirements Directive (Directive 2013/36/EU) or the Deposit Guarantee Schemes Directive (Directive 2014/49/EU). Accordingly, these funds are not covered by any statutory deposit protection schemes, and Mangopay does not operate as a licensed banking institution.


        This call returns all preauthorized pay-ins, both captures and complements, made against a given deposit preauthorization, whether they were successful or not.'
      tags:
      - Transactions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: DepositId
        in: path
        description: The unique identifier of the deposit preauthorization.
        required: true
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
