        With approval from Mangopay, your platform may be able to use the `USER_NOT_PRESENT` value provided you also have a legal proxy in place with the user and the user''s consent to access wallet balances and transactions on their behalf (read more about proxy management).


        **Note – SCA triggered by this endpoint**


