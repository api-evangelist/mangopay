openapi: 3.2.0
info:
  title: Reference Conversions API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Conversions
paths:
  /v2.01/{ClientId}/conversions/quoted-conversion:
    post:
      operationId: conversions_create_quoted_conversion_user_wallets
      summary: Create a Quoted Conversion between user Wallets
      description: 'This call triggers a conversion at the rate defined in its quote. The debited funds (sell currency), credited funds (buy currency), and amounts are defined in the quote.


        Each quoted conversion requires a dedicated Quote object, linked in the `QuoteId`.'
      tags:
      - Conversions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAQuotedConversionBetweenUserWalletsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAQuotedConversionBetweenUserWalletsRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/conversions/instant-conversion:
    post:
      operationId: conversions_create_instant_conversion_user_wallets
      summary: Create an Instant Conversion between user Wallets
      description: This call triggers an immediate conversion at the market rate, of the debited funds to the credited wallet at the market rate. A quote is not required for an instant conversion.
      tags:
      - Conversions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAnInstantConversionBetweenUserWalletsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnInstantConversionBetweenUserWalletsRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/clients/conversions/quoted-conversion:
    post:
      operationId: conversions_create_quoted_conversion_client_wallets
      summary: Create a Quoted Conversion between Client Wallets
      description: 'This call triggers a conversion at the rate defined in its quote. The debited funds (sell currency), credited funds (buy currency), and amounts are defined in the quote. The Client Wallets to debit and credit are defined in the conversion.


        Each quoted conversion requires a dedicated Quote object, linked in the `QuoteId`.


        Quoted conversions between client wallets:

        - Can''t include `Fees` – the conversion attempt will return a 400 error if its `QuoteId` includes fees

        - Shouldn''t include `UserMargin` – the conversion attempt will not be blocked, but `UserMargin` is disregarded – in the `ConversionRateResponse` (the user''s `FinalRate` is the same as the platform''s `ClientRate`).'
      tags:
      - Conversions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotedConversionClientWalletsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAQuotedConversionBetweenClientWalletsRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/clients/conversions/instant-conversion:
    post:
      operationId: conversions_create_instant_conversion_client_wallets
      summary: Create an Instant Conversion between Client Wallets
      description: 'This call triggers an immediate conversion at the market rate, of the debited funds to the credited wallet at the market rate. A quote is not required for an instant conversion.


        For conversions between Client Wallets, the `Fees` cannot be specified.'
      tags:
      - Conversions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantConversionClientWalletsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnInstantConversionBetweenClientWalletsRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/conversions/{ConversionId}:
    get:
      operationId: conversions_view_conversion
      summary: View a Conversion
      description: '**Note – Conversion data retained for 13 months**


        An API call to retrieve a conversion whose `CreationDate` is older than 13 months may return 404 Not Found.


        For more information, see the Data availability periods article.


        View a Conversion


        All conversions returned by this endpoint contain the `QuoteId` parameter. For instant conversions, it is `null`.'
      tags:
      - Conversions
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: ConversionId
        in: path
        description: The unique identifier of the conversion.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionResponse'
      security:
      - oauth2: []
components:
  schemas:
    CreditedWalletType_QuotedClientConversion:
      type: string
      description: '**Allowed values:** `FEES`, `CREDIT`


        The type of the client wallet to be credited:

        - `FEES` – Fees Wallet, for fees collected by the platform.

        - `CREDIT` – Repudiation Wallet, for funds related to dispute management.


        The amount and currency of the credited funds are defined by the quote.'
      title: CreditedWalletType_QuotedClientConversion
    CreateAnInstantConversionBetweenClientWalletsRequestCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
      required:
      - Currency
      description: Information about the credited funds – the buy currency.
      title: CreateAnInstantConversionBetweenClientWalletsRequestCreditedFunds
    Amount:
      type: integer
      description: The amount of the currency in its minor unit. For example, EUR 12.60 would be represented as `1260` whereas JPY 12 would be represented as just `12`.
      title: Amount
    QuotedConversionClientWalletsResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount_DebitedFunds_ConversionResponse'
      description: Information about the debited funds.
      title: QuotedConversionClientWalletsResponseDebitedFunds
    Amount_DebitedFunds_ConversionResponse:
      type: integer
      description: 'An amount of money in the smallest sub-division of the currency (e.g., EUR 12.60 would be represented as `1260` whereas JPY 12 would be represented as just `12`).


        During a conversion, (`DebitedFunds.Amount` - `Fees`) * `MarketRate` = `CreditedFunds.Amount`.'
      title: Amount_DebitedFunds_ConversionResponse
    CreateAQuotedConversionBetweenClientWalletsRequest:
      type: object
      properties:
        QuoteId:
          type: string
          description: The unique identifier of the active quote which guaranteed the rate for the conversion.
        DebitedWalletType:
          $ref: '#/components/schemas/DebitedWalletType_QuotedClientConversion'
        CreditedWalletType:
          $ref: '#/components/schemas/CreditedWalletType_QuotedClientConversion'
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - QuoteId
      - DebitedWalletType
      - CreditedWalletType
      title: CreateAQuotedConversionBetweenClientWalletsRequest
    TransactionExecutionDate:
      type: integer
      description: Unix timestamp (UTC) of the date and time the status changed to `SUCCEEDED`, indicating that the transaction occurred. The statuses `CREATED` and `FAILED` return an `ExecutionDate` of `null`.
      title: TransactionExecutionDate
    RequestedFees_Conversion:
      type: object
      properties:
        Type:
          type: string
          description: '**Allowed values:** `PERCENTAGE`, `FIXED`


            **Default value:** `FIXED`


            The type of the `Value`.'
        Value:
          type: integer
          description: 'The value to be used for the `Type`:

            - `PERCENTAGE` – In quantities of 0.1% (e.g. `150` equals 1.5%), the percentage of `DebitedFunds.Amount` deducted as fees.

            - `FIXED` – The amount deducted from `DebitedFunds.Amount` as fees, as an amount of money in the smallest sub-division of the currency (e.g., EUR 12.60 would be represented as `1260` whereas JPY 12 would be represented as just `12`).'
        Currency:
          type: string
          description: '**Allowed values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the fees, which must match the debited currency.'
      description: Information about the `Fees` sent in the request.
      title: RequestedFees_Conversion
    CreateAQuotedConversionBetweenUserWalletsRequest:
      type: object
      properties:
        QuoteId:
          type: string
          description: The unique identifier of the active quote which guaranteed the rate for the conversion.
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - QuoteId
      - AuthorId
      - DebitedWalletId
      - CreditedWalletId
      title: CreateAQuotedConversionBetweenUserWalletsRequest
    CreateAnInstantConversionBetweenUserWalletsResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        DebitedFunds:
          $ref: '#/components/schemas/CreateAnInstantConversionBetweenUserWalletsResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/CreateAnInstantConversionBetweenUserWalletsResponseCreditedFunds'
          description: Information about the credited funds.
        Fees:
          $ref: '#/components/schemas/Fees_ConversionResponse'
        RequestedFees:
          $ref: '#/components/schemas/RequestedFees_Conversion'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        ConversionRateResponse:
          $ref: '#/components/schemas/ConversionRateResponse'
        MarginsResponse:
          $ref: '#/components/schemas/MarginsResponse'
        Tag:
          $ref: '#/components/schemas/Tag'
      title: CreateAnInstantConversionBetweenUserWalletsResponse
    InstantConversionClientWalletsResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount_DebitedFunds_ConversionResponse'
      description: Information about the debited funds.
      title: InstantConversionClientWalletsResponseDebitedFunds
    CreditedWalletType_ClientConversion:
      type: string
      description: '**Allowed values:** `FEES`, `CREDIT`


        The type of the client wallet to be credited:

        - `FEES` – Fees Wallet, for fees collected by the platform.

        - `CREDIT` – Repudiation Wallet, for funds related to dispute management.'
      title: CreditedWalletType_ClientConversion
    InstantConversionClientWalletsResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        DebitedFunds:
          $ref: '#/components/schemas/InstantConversionClientWalletsResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/InstantConversionClientWalletsResponseCreditedFunds'
          description: Information about the credited funds.
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        ConversionRateResponse:
          $ref: '#/components/schemas/ConversionRateResponse'
        Tag:
          $ref: '#/components/schemas/Tag'
      title: InstantConversionClientWalletsResponse
    TransactionStatus:
      type: string
      description: '**Returned values:** `CREATED`, `SUCCEEDED`, `FAILED`


        The status of the transaction.'
      title: TransactionStatus
    CreateAnInstantConversionBetweenUserWalletsRequest:
      type: object
      properties:
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        DebitedFunds:
          $ref: '#/components/schemas/CreateAnInstantConversionBetweenUserWalletsRequestDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/CreateAnInstantConversionBetweenUserWalletsRequestCreditedFunds'
          description: Information about the credited funds.
        Fees:
          $ref: '#/components/schemas/QuoteFeesRequest'
        UserMargin:
          $ref: '#/components/schemas/QuoteUserMarginRequest'
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - AuthorId
      - DebitedWalletId
      - CreditedWalletId
      - DebitedFunds
      - CreditedFunds
      title: CreateAnInstantConversionBetweenUserWalletsRequest
    CreateAnInstantConversionBetweenClientWalletsRequest:
      type: object
      properties:
        DebitedWalletType:
          $ref: '#/components/schemas/DebitedWalletType_ClientConversion'
        DebitedFunds:
          $ref: '#/components/schemas/CreateAnInstantConversionBetweenClientWalletsRequestDebitedFunds'
          description: Information about the debited funds.
        CreditedWalletType:
          $ref: '#/components/schemas/CreditedWalletType_ClientConversion'
        CreditedFunds:
          $ref: '#/components/schemas/CreateAnInstantConversionBetweenClientWalletsRequestCreditedFunds'
          description: Information about the credited funds – the buy currency.
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - DebitedWalletType
      - DebitedFunds
      - CreditedWalletType
      - CreditedFunds
      title: CreateAnInstantConversionBetweenClientWalletsRequest
    ResultMessage:
      type: string
      description: The explanation of the result code.
      title: ResultMessage
    Currency:
      type: string
      description: '**Allowed values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


        The currency of the amount.'
      title: Currency
    MarginsResponseMangopay:
      type: object
      properties:
        Type:
          type: string
          description: '**Response value:** `PERCENTAGE`


            The type of the `Value`, which for Mangopay is always `PERCENTAGE`.'
        Value:
          type: number
          format: double
          description: 'The value to be used for the `Type`.


            Mangopay''s markup is expressed as a percentage (to convert to decimal, divide by 100).'
        Amount:
          type: integer
          description: The amount of debited currency that Mangopay will charge your platform for the transaction during the billing cycle.
      description: The margin used by Mangopay to bill your platform (which is defined during contracting).
      title: MarginsResponseMangopay
    CreateAQuotedConversionBetweenUserWalletsResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount_CreditedFunds_ConversionResponse'
      description: Information about the credited funds.
      title: CreateAQuotedConversionBetweenUserWalletsResponseCreditedFunds
    CreateAnInstantConversionBetweenClientWalletsRequestDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: Information about the debited funds.
      title: CreateAnInstantConversionBetweenClientWalletsRequestDebitedFunds
    CreateAnInstantConversionBetweenUserWalletsResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount_CreditedFunds_ConversionResponse'
      description: Information about the credited funds.
      title: CreateAnInstantConversionBetweenUserWalletsResponseCreditedFunds
    CreateAQuotedConversionBetweenUserWalletsResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        QuoteId:
          type:
          - string
          - 'null'
          description: 'The unique identifier of the active quote which guaranteed the rate for the conversion.


            Returned `null` in the case of an instant conversion.'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        DebitedFunds:
          $ref: '#/components/schemas/CreateAQuotedConversionBetweenUserWalletsResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/CreateAQuotedConversionBetweenUserWalletsResponseCreditedFunds'
          description: Information about the credited funds.
        Fees:
          $ref: '#/components/schemas/Fees_ConversionResponse'
        RequestedFees:
          $ref: '#/components/schemas/RequestedFees_Conversion'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        ConversionRateResponse:
          $ref: '#/components/schemas/ConversionRateResponse'
        MarginsResponse:
          $ref: '#/components/schemas/MarginsResponse'
        Tag:
          $ref: '#/components/schemas/Tag'
      title: CreateAQuotedConversionBetweenUserWalletsResponse
    ConversionResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        QuoteId:
          type:
          - string
          - 'null'
          description: 'The unique identifier of the active quote which guaranteed the rate for the conversion.


            Returned `null` in the case of an instant conversion.'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        DebitedFunds:
          $ref: '#/components/schemas/ConversionResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/ConversionResponseCreditedFunds'
          description: Information about the credited funds.
        Fees:
          $ref: '#/components/schemas/Fees_ConversionResponse'
        RequestedFees:
          $ref: '#/components/schemas/RequestedFees_Conversion'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        ConversionRateResponse:
          $ref: '#/components/schemas/ConversionRateResponse'
        MarginsResponse:
          $ref: '#/components/schemas/MarginsResponse'
        Tag:
          $ref: '#/components/schemas/Tag'
      title: ConversionResponse
    ConversionResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount_CreditedFunds_ConversionResponse'
      description: Information about the credited funds.
      title: ConversionResponseCreditedFunds
    DebitedWalletType_ClientConversion:
      type: string
      description: '**Allowed values:** `FEES`, `CREDIT`


        The type of the client wallet to be debited:

        - `FEES` – Fees Wallet, for fees collected by the platform.

        - `CREDIT` – Repudiation Wallet, for funds related to dispute management.'
      title: DebitedWalletType_ClientConversion
    CreateAnInstantConversionBetweenUserWalletsRequestDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: Information about the debited funds.
      title: CreateAnInstantConversionBetweenUserWalletsRequestDebitedFunds
    CreateAQuotedConversionBetweenUserWalletsResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount_DebitedFunds_ConversionResponse'
      description: Information about the debited funds.
      title: CreateAQuotedConversionBetweenUserWalletsResponseDebitedFunds
    TransactionNature:
      type: string
      description: '**Returned values:** `REGULAR`, `REPUDIATION`, `REFUND`, `SETTLEMENT`


        The nature of the transaction, providing more information about the context in which the transaction occurred:

        - `REGULAR` – Relative to most of the transactions (pay-ins, payouts, and transfers) in a usual workflow.

        - `REPUDIATION` – Automatic withdrawal of funds from the platform''s repudiation wallet as part of the dispute process (when the user has requested a chargeback).

        - `REFUND` – Reimbursement of a transaction to the user (pay-in refund), to a wallet (transfer refund), or of a payout (payout refund, only initiated by Mangopay).

        - `SETTLEMENT` – Transfer made to the repudiation wallet by the platform to settle a lost dispute.'
      title: TransactionNature
    CreateAnInstantConversionBetweenUserWalletsRequestCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
      required:
      - Currency
      description: Information about the credited funds.
      title: CreateAnInstantConversionBetweenUserWalletsRequestCreditedFunds
    DebitedWalletType_QuotedClientConversion:
      type: string
      description: '**Allowed values:** `FEES`, `CREDIT`


        The type of the client wallet to be debited:

        - `FEES` – Fees Wallet, for fees collected by the platform.

        - `CREDIT` – Repudiation Wallet, for funds related to dispute management.


        The amount and currency of the debited funds are defined by the quote.'
      title: DebitedWalletType_QuotedClientConversion
    Tag:
      type: string
      description: 'Max. length: 255 characters


        Custom data that you can add to this object, such as unique identifiers in your system. To store multiple values, you can serialize them into a single string, for example a JSON object: `"{\"id_1\":AB123,\"id_2\":DE456}"`.'
      title: Tag
    CreationDate:
      type: integer
      description: Unix timestamp (UTC) of the date and time the object was created.
      title: CreationDate
    ConversionRateResponse:
      type: object
      properties:
        ClientRate:
          type: number
          format: double
          description: 'Max. 7 decimal places


            The indicative rate including Mangopay''s markup, used during the billing cycle: `ClientRate` = `MarketRate` * (1 - `MarginsResponse.Mangopay`). The `MarginsResponse.Mangopay.Amount` gives the amount of debited currency that will be billed by Mangopay to your platform for the transaction.


            The `ClientRate` fluctuates in line with the `MarketRate`.'
        MarketRate:
          type: number
          format: double
          description: 'Max. 7 decimal places


            The rate used to convert funds during the conversion: (`DebitedFunds.Amount` - `Fees`) * `MarketRate` = `CreditedFunds.Amount`.


            The market rate fluctuates in line with FX market dynamics and is common to all platforms for the currency pair.'
        FinalRate:
          type: number
          format: double
          description: 'Max. 7 decimal places


            The indicative rate including the `UserMargin`, if your platform defined it in the request or the quote: `FinalRate` = `ClientRate` * (1 - `MarginsResponse.User`). The `MarginsResponse.User.Amount` gives the amount of debited currency that your platform could bill to the user for the transaction.


            If no `UserMargin` was included, the `FinalRate` is the same as the `ClientRate`.'
      description: Information about the `MarketRate` used to convert funds and other indicative rates.
      title: ConversionRateResponse
    Error:
      type: object
      properties:
        Message:
          type: string
          description: Description of the error.
        Type:
          type: string
          description: 'The category of the error.

            '
        Id:
          type: string
          description: Unique identifier of the error instance, useful when contacting Mangopay for support.
        Date:
          type: number
          format: double
          description: Unix timestamp (UTC) of the date and time the error was triggered.
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: 'Object containing one or more field-level errors.

            '
      description: 'The error body typically returned by the Mangopay API for any non-2xx HTTP status code.

        '
      title: Error
    QuotedConversionClientWalletsResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        QuoteId:
          type:
          - string
          - 'null'
          description: 'The unique identifier of the active quote which guaranteed the rate for the conversion.


            Returned `null` in the case of an instant conversion.'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the transaction. In a conversion, both the debited and credited wallets are owned by the author.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet (in the sell currency).
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet (in the buy currency).
        DebitedFunds:
          $ref: '#/components/schemas/QuotedConversionClientWalletsResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/QuotedConversionClientWalletsResponseCreditedFunds'
          description: Information about the credited funds.
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        ConversionRateResponse:
          $ref: '#/components/schemas/ConversionRateResponse'
        Tag:
          $ref: '#/components/schemas/Tag'
      title: QuotedConversionClientWalletsResponse
    CreateAnInstantConversionBetweenUserWalletsResponseDebitedFunds:
      type: object
      properties:
        Currency:
