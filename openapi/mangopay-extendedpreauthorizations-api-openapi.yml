            - `CANCELED` – Value to pass to manually cancel the extended preauthorization before use; indicates that the extended preauthorization was canceled manually.

            - `CANCEL_REQUESTED` – The cancellation of the extended preauthorization has been requested but not yet processed.

            - `EXPIRED` – The hold period on the preauthorized funds has ended without it being used.

