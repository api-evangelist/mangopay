openapi: 3.2.0
info:
  title: Reference Extended Preauthorizations API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: extendedPreauthorizations
paths:
  /v2.01/{ClientId}/extended-preauthorizations/card/direct:
    post:
      operationId: extendedPreauthorizations_create_card_extended_preauthorization
      summary: Create a Card Extended Preauthorization
      description: 'This endpoint creates an Extended Preauthorization with `PaymentType` of `CARD` and returns the `RedirectURL` on which the user can preauthorize the debited funds.


        Once authorized (`Status` becomes `SUCCEEDED`), you can capture the funds using the POST Create an Extended Preauthorized PayIn endpoint.'
      tags:
      - extendedPreauthorizations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardExtendedPreauthorizationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateACardExtendedPreauthorizationRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/extended-preauthorizations/{ExtendedPreauthorizationId}:
    put:
      operationId: extendedPreauthorizations_cancel_extended_preauthorization
      summary: Cancel an Extended Preauthorization
      description: This endpoint allows you to cancel an extended preauthorization (with `PaymentType` of `CARD` or `PAYPAL`) if it is no longer needed, by setting the `PaymentStatus` to `CANCELED`. A canceled extended preauthorization can't be subsequently captured.
      tags:
      - extendedPreauthorizations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: ExtendedPreauthorizationId
        in: path
        description: The unique identifier of the extended preauthorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedPreauthorizationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAnExtendedPreauthorizationRequest'
      security:
      - oauth2: []
    get:
      operationId: extendedPreauthorizations_view_extended_preauthorization
      summary: View an Extended Preauthorization
      description: 'This call retrieves a single Extended Preauthorization, of which there are two types, indicated by `PaymentType`:

        - `CARD` – Created using POST Create a Card Extended Preauthorization

        - `PAYPAL` – Created using POST Create a PayPal Extended Preauthorization


        Both types can be captured using POST Create an Extended Preauthorized PayIn.'
      tags:
      - extendedPreauthorizations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: ExtendedPreauthorizationId
        in: path
        description: The unique identifier of the extended preauthorization.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedPreauthorizationResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/cards/{CardId}/extended-preauthorizations:
    get:
      operationId: extendedPreauthorizations_list_extended_preauthorizations_card
      summary: List Extended Preauthorizations for a Card
      tags:
      - extendedPreauthorizations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: CardId
        in: path
        required: true
        schema:
          type: string
      - name: ResultCode
        in: query
        description: The code indicating the result of the operation. You can filter on multiple values by separating them with a comma.
        required: false
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: PaymentStatus
        in: query
        description: '**Allowed values:** `WAITING`, `CANCELED`, `CANCEL_REQUESTED`, `EXPIRED`, `VALIDATED`, `FAILED`


          The payment status of the extended preauthorization object:

          - `WAITING` – The extended preauthorization can be used: the preauthorized funds can be captured (if `Status` is `SUCCEEDED`) or the preauthorization can be canceled manually.

          - `CANCELED` – Value to pass to manually cancel the extended preauthorization before use; indicates that the extended preauthorization was canceled manually.

          - `CANCEL_REQUESTED` – The cancellation of the extended preauthorization has been requested but not yet processed.

          - `EXPIRED` – The hold period on the preauthorized funds has ended without it being used.

          - `VALIDATED` – Indicates that the preauthorized funds were captured.

          - `FAILED` – The pay-in against the preauthorization has failed, but a retry may be possible.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExtendedPreauthorizationsResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/users/{UserId}/extended-preauthorizations:
    get:
      operationId: extendedPreauthorizations_list_extended_preauthorizations_user
      summary: List Extended Preauthorizations for a User
      tags:
      - extendedPreauthorizations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        required: true
        schema:
          type: string
      - name: ResultCode
        in: query
        description: The code indicating the result of the operation. You can filter on multiple values by separating them with a comma.
        required: false
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: PaymentStatus
        in: query
        description: "**Allowed values:** `WAITING`, `CANCELED`, `CANCEL_REQUESTED`, `EXPIRED`, `VALIDATED`, `FAILED`\n\nThe payment status of the extended preauthorization object:\n- `WAITING` – The extended preauthorization can be used: the preauthorized funds can be captured (if `Status` is `SUCCEEDED`) or the preauthorization can be canceled manually.\n- `CANCELED` – Value to pass to manually cancel the extended preauthorization before use; indicates that the extended preauthorization was canceled manually.\n- `CANCEL_REQUESTED` – The cancellation of the extended preauthorization has been requested but not yet processed.  \n- `EXPIRED` – The hold period on the preauthorized funds has ended without it being used.  \n- `VALIDATED` – Indicates that the preauthorized funds were captured.\n- `FAILED` – The pay-in against the preauthorization has failed, but a retry may be possible."
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListExtendedPreauthorizationsResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payins/extended-preauthorized/direct/full-capture:
    post:
      operationId: extendedPreauthorizations_create_extended_preauthorized_payin
      summary: Create an Extended Preauthorized PayIn
      description: 'This endpoint lets you capture funds against the `ExtendedPreauthorizationId` (or the deprecated `DepositId`) of a preauthorization made on a card or a PayPal account.


        The payment method is indicated by the `PaymentType` of the Extended Preauthorization object:

        - `CARD` – Single capture possible within 29.5 days

        - `PAYPAL` – Single capture recommended within 3 days, but possible up to 29 days (not 29.5)


        The shape of the pay-in object is the same – specific data points for card or PayPal authorizations are available via GET View an Extended Preauthorization.


        **Best practice - For PayPal, capture funds within 3 days**


        PayPal recommends that you capture preauthorized funds within 3 days. This is because the success of the capture is subject to risk and the availability of funds on the card (or other funding instrument) that the user has linked to their PayPal account.'
      tags:
      - extendedPreauthorizations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedPreauthorizedPayInResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnExtendedPreauthorizedPayInRequest'
      security:
      - oauth2: []
components:
  schemas:
    SecureModeReturnURL:
      type: string
      description: 'Max. length: 255 characters


        The URL to which users are automatically returned after 3DS2 if it is triggered (i.e., if the `SecureModeNeeded` parameter is set to `true`).'
      title: SecureModeReturnURL
    ExtendedPreauthorizedPayInResponse:
      type: object
      properties:
        AuthorId:
          type: string
          description: '**Default values:** The `AuthorId` of the Extended Preauthorization object.


            The unique identifier of the user at the source of the transaction. On the Extended Preauthorized PayIn, this parameter returns the same value as the `AuthorId` of the Extended Preauthorization object, regardless of the value sent.'
        CreditedUserId:
          type: string
          description: '**Default value:** The `AuthorId` of the Extended Preauthorization object.


            The unique identifier of the user whose wallet is credited. On the Extended Preauthorized PayIn, this parameter returns the same value as the `AuthorId` of the Extended Preauthorization object, regardless of the value sent.'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        ExtendedPreauthorizationId:
          type: string
          description: 'The unique identifier of the extended preauthorization. The same unique value is also returned in the deprecated `DepositId` property.


            The prefix of the unique identifier determines the endpoint used to create the preauthorization:

            - `ext_auth_wt_<uuid>` – [POST Create a Card Extended Preauthorization](/api-reference/extended-preauthorizations/create-card-extended-preauthorization) or [POST Create a PayPal Extended Preauthorization](/api-reference/extended-preauthorizations/create-paypal-extended-preauthorization)

            - `deposit_wt_<uuid>` – [POST Create a Card Deposit Preauthorization](/api-reference/deposit-preauthorizations/create-card-deposit-preauthorization) or [POST Create a PayPal Deposit Preauthorization](/api-reference/deposit-preauthorizations/create-paypal-deposit-preauthorization)'
        DepositId:
          type: string
          description: '**Deprecated** – use `ExtendedPreauthorizationId` instead.


            The unique identifier of the extended preauthorization.'
        Id:
          $ref: '#/components/schemas/Id'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        PaymentType:
          type: string
          description: '**Returned values:** `PREAUTHORIZED`


            The payment type of the pay-in.'
        ExecutionType:
          type: string
          description: '**Returned values:** `DIRECT`


            The execution type of the pay-in.'
        DebitedFunds:
          $ref: '#/components/schemas/ExtendedPreauthorizedPayInResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/ExtendedPreauthorizedPayInResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/ExtendedPreauthorizedPayInResponseFees'
          description: Information about the fees taken by the platform for this transaction (and hence transferred to the Fees Wallet).
        Tag:
          $ref: '#/components/schemas/Tag'
        AuthenticationResult:
          $ref: '#/components/schemas/AuthenticationResult'
        StatementDescriptor:
          $ref: '#/components/schemas/StatementDescriptor'
      description: "A 29-day extended preauthorized pay-in:\n- `PaymentType` – `PREAUTHORIZED`\n- `ExecutionType` – `DIRECT`\n- Object includes `ExtendedPreauthorizationId` (and the deprecated `DepositId` containing the same unique value). \n\nThe payment method is determined by the preauthorization's `PaymentType`: `CARD_DIRECT` or `PAPAY`."
      title: ExtendedPreauthorizedPayInResponse
    StatementDescriptor:
      type: string
      description: 'Max. length: 10 characters; only alphanumeric and spaces


        Custom description to appear on the user’s bank statement along with the platform name. Different banks may show more or less information. See the <a href="/bank-statements">Customizing bank statement references</a> article for details.'
      title: StatementDescriptor
    Address_SubPropsRequired:
      type: object
      properties:
        AddressLine1:
          type: string
          description: The first line of the address.
        AddressLine2:
          type: string
          description: The second line of the address.
        City:
          type: string
          description: The city of the address.
        Region:
          type: string
          description: Required if `Country` is US, CA, or MX. The region of the address.
        PostalCode:
          type: string
          description: 'The postal code of the address. The postal code can contain the following characters: alphanumeric, dashes, and spaces.'
        Country:
          type: string
          description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


            The country of the address.'
      required:
      - AddressLine1
      - City
      - PostalCode
      - Country
      description: The postal address.
      title: Address_SubPropsRequired
    AuthenticationResult:
      type: object
      properties:
        AuthenticationType:
          type:
          - string
          - 'null'
          description: '**Returned values:** `CHALLENGE`, `FRICTIONLESS`, `DIRECT_AUTHORIZATION`


            The type of authentication:


            - `CHALLENGE` – The issuer requested SCA to be enforced (for example, using 3DS).

            - `FRICTIONLESS` – The transaction was exempted from SCA because an exemption was granted by the issuer.

            - `DIRECT_AUTHORIZATION` – The transaction was sent to the issuer for authorization without any frictionless or challenge (for example, if SCA doesn''t apply). A `null` value typically indicates that authentication was not requested (for example, because the request failed before being sent) or a decision was not received.


            A `null` value typically indicates that authentication was not requested (for example, because the request failed before being sent) or a decision was not received.'
      description: Information about the authentication result, based on the request made by Mangopay and the decision of the issuer regarding the type of authentication to be enforced (if applicable).
      title: AuthenticationResult
    PayPalExtendedPreauthorizationResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the preauthorized funds.
      title: PayPalExtendedPreauthorizationResponseDebitedFunds
    Amount:
      type: integer
      description: The amount of the currency in its minor unit. For example, EUR 12.60 would be represented as `1260` whereas JPY 12 would be represented as just `12`.
      title: Amount
    CreateAnExtendedPreauthorizedPayInRequest:
      type: object
      properties:
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        ExtendedPreauthorizationId:
          type: string
          description: 'Required if `DepositId` is not provided.


            The unique identifier of the extended preauthorization.'
        DepositId:
          type: string
          description: '**Deprecated** – use `ExtendedPreauthorizationId` instead.


            Required if `ExtendedPreauthorizationId` is not provided.


            The unique identifier of the extended preauthorization.'
        DebitedFunds:
          $ref: '#/components/schemas/CreateAnExtendedPreauthorizedPayInRequestDebitedFunds'
          description: Information about the debited funds.
        Fees:
          $ref: '#/components/schemas/CreateAnExtendedPreauthorizedPayInRequestFees'
          description: Information about the fees.
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - AuthorId
      - CreditedWalletId
      - DebitedFunds
      - Fees
      title: CreateAnExtendedPreauthorizedPayInRequest
    FlowDescriptorRequestBeneficiariesItems:
      type: object
      properties:
        UserId:
          type: string
          description: The unique identifier of the Natural User or Legal User declared as a beneficiary of the pay-in.
      title: FlowDescriptorRequestBeneficiariesItems
    FlowDescriptorResponseBeneficiariesItems:
      type: object
      properties:
        UserId:
          type: string
          description: The unique identifier of the Natural User or Legal User declared as a beneficiary of the pay-in.
      title: FlowDescriptorResponseBeneficiariesItems
    TransactionExecutionDate:
      type: integer
      description: Unix timestamp (UTC) of the date and time the status changed to `SUCCEEDED`, indicating that the transaction occurred. The statuses `CREATED` and `FAILED` return an `ExecutionDate` of `null`.
      title: TransactionExecutionDate
    AuthorId:
      type: string
      description: The unique identifier of the user at the source of the transaction.
      title: AuthorId
    PayPalExtendedPreauthorizationResponsePayinsLinked:
      type: object
      properties:
        PayinCaptureId:
          type: string
          description: The unique identifier of the preauthorized pay-in (capture) made against the extended preauthorization to debit the preauthorized funds.
        PayinComplementId:
          type: string
          description: This deprecated parameter is always returned `null`.
      description: Information about the extended preauthorized pay-ins made against the extended preauthorization.
      title: PayPalExtendedPreauthorizationResponsePayinsLinked
    ProfilingAttemptReference:
      type: string
      description: 'The unique reference generated for the profiling session, used by the <a href="/guides/fraud-prevention">fraud prevention</a> solution to produce recommendations for the transaction using the profiling data.


        **Note:** Parameter not returned by the API. Profiling feature available on request – contact Mangopay <a href="https://hub.mangopay.com/" target="_blank">via the Dashboard</a> for more information.'
      title: ProfilingAttemptReference
    FlowDescriptorRequest:
      type: object
      properties:
        Beneficiaries:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/FlowDescriptorRequestBeneficiariesItems'
          description: 'Max. length: 5 items


            The list of up to 5 Natural or Legal Users declared as beneficiaries of the pay-in and its subsequent transfers, who must all be KYC/KYB verified when the pay-in request is made. The pay-in also fails if the `Beneficiaries` array contains nulled objects or invalid `UserId` values.'
      description: "Information about the Owner beneficiaries targeted by the pay-in and its subsequent transfers, who must all be KYC/KYB verified when the pay-in request is made ([read more](/guides/payin-beneficiaries)).\n\nIf the `FlowDescriptor.Beneficiaries` is sent in the API request, then:\n- The transaction's `CreditedWalletId` holder is disregarded in KYC/KYB checks.\n- **ALL** `UserId` values in the array must be one of:\n  - `OWNER` whose `KYCLevel` is `REGULAR`\n  - `PLATFORM`\n  \nThe pay-in `Status` becomes `FAILED` with `ResultCode` [002951](/errors/codes/002951) if at least one `FlowDescriptor.Beneficiaries.UserId` is:\n- `PAYER`\n- `OWNER` whose `KYCLevel` is `LIGHT`\n\nIf the `FlowDescriptor.Beneficiaries` is not sent in the API request, then the `CreditedWalletId` holder is subject to KYC/KYB checks. This property is optional for backwards compatibility but is recommended for all pay-in flows, even when the `CreditedWalletId` holder is a `PAYER` or the same value as one of the `FlowDescriptor.Beneficiaries`. \n"
      title: FlowDescriptorRequest
    PayPalExtendedPreauthorizationResponseLineItemsItems:
      type: object
      properties:
        Name:
          type: string
          description: The name of the item.
        Quantity:
          type: integer
          description: The quantity of the item.
        UnitAmount:
          type: integer
          description: The cost of the item, excluding tax.
        TaxAmount:
          type: integer
          description: The tax amount applied to the item.
        Description:
          type: string
          description: 'The platform''s unique reference for the seller. This value must be consistently used for the given seller. You can use, for example, the Mangopay `UserId` or the seller''s business name or first name and last name.


            **Caution:** Failure to use a unique seller identifier may result in PayPal restricting your service.'
        Category:
          type: string
          description: '**Allowed values:** PHYSICAL_GOODS, DIGITAL_GOODS, DONATION


            The category of the item:

            - `PHYSICAL_GOODS` – Tangible items that can be physically shipped and received with proof of delivery upon arrival.

            - `DIGITAL_GOODS` – Products or services that are distributed and consumed via digital platforms or devices.

            - `DONATION` – Voluntary contribution made without any goods or services received in return. Multiple line items can be categorized as `DONATION` within a single transaction, however it is not possible to combine `DONATION` other line item categories within the same transaction.'
        Sku:
          type: string
          description: The SKU or reference for the item on your platform.
        Discount:
          type: integer
          description: The discount applied to the item, in the smallest currency sub-division.
      title: PayPalExtendedPreauthorizationResponseLineItemsItems
    ExtendedPreauthorizedPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: ExtendedPreauthorizedPayInResponseCreditedFunds
    Shipping_DefaultsBillingUser_Response:
      type: object
      properties:
        FirstName:
          type: string
          description: The first name of the user.
        LastName:
          type: string
          description: The last name of the user.
        Address:
          $ref: '#/components/schemas/Address_SubPropsRequired'
      description: '**Default values:** `FirstName`, `LastName`, and `Address` information of the `Billing` object if sent, otherwise of the `AuthorId` (if address values present).


        Information about the shipping address. '
      title: Shipping_DefaultsBillingUser_Response
    AuthorizationStatus:
      type: string
      description: '**Returned values:** `CREATED`, `SUCCEEDED`, `FAILED`


        The status of the authorization.'
      title: AuthorizationStatus
    CreateACardExtendedPreauthorizationRequest:
      type: object
      properties:
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorRequest'
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        DebitedFunds:
          $ref: '#/components/schemas/CreateACardExtendedPreauthorizationRequestDebitedFunds'
          description: Information about the preauthorized funds.
        CardId:
          type: string
          description: The unique identifier of the Card object, obtained during the card registration process.
        PreferredCardNetwork:
          $ref: '#/components/schemas/PreferredCardNetwork'
        SecureModeReturnURL:
          $ref: '#/components/schemas/SecureModeReturnURL'
        StatementDescriptor:
          $ref: '#/components/schemas/StatementDescriptor_22'
        Culture:
          type: string
          description: '**Allowed values:** One of the supported languages in the [ISO 639-1 format](/api-reference/overview/data-formats): DE, EN, ES, FR, IT, NL, PL, PT.


            The language in which the payment page is to be displayed.'
        BrowserInfo:
          $ref: '#/components/schemas/BrowserInfo'
        IpAddress:
          $ref: '#/components/schemas/IpAddress'
        Billing:
          $ref: '#/components/schemas/Billing_DefaultsShippingUser_Request'
        Shipping:
          $ref: '#/components/schemas/Shipping_DefaultsBillingUser_Request'
        Tag:
          $ref: '#/components/schemas/Tag'
        ProfilingAttemptReference:
          $ref: '#/components/schemas/ProfilingAttemptReference'
      required:
      - AuthorId
      - DebitedFunds
      - CardId
      - SecureModeReturnURL
      - BrowserInfo
      - IpAddress
      title: CreateACardExtendedPreauthorizationRequest
    Billing_DefaultsShippingUser_Request:
      type: object
      properties:
        FirstName:
          type: string
          description: The first name of the user.
        LastName:
          type: string
          description: The last name of the user.
        Address:
          $ref: '#/components/schemas/Address_SubPropsRequired'
      description: '**Default values:** `FirstName`, `LastName`, and `Address` information of the `Shipping` object if sent, otherwise of the `AuthorId` (if address values present).


        Information about the billing address. '
      title: Billing_DefaultsShippingUser_Request
    PayPalExtendedPreauthorizationResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        ExpirationDate:
          type: integer
          description: Unix timestamp (UTC) of the date and time the hold period ends and the preauthorized funds are released. At the expiration date, the extended preauthorization's `PaymentStatus` changes to `EXPIRED` if no captures were made.
        AuthorizationDate:
          type: integer
          description: Unix timestamp (UTC) of the date and time successful authorization occurred. If authorization failed, the value is `null`.
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorResponse'
        DebitedFunds:
          $ref: '#/components/schemas/PayPalExtendedPreauthorizationResponseDebitedFunds'
          description: Information about the preauthorized funds.
        Status:
          $ref: '#/components/schemas/AuthorizationStatus'
        PaymentStatus:
          type: string
          description: '**Returned values:** `WAITING`, `CANCELED`, `CANCEL_REQUESTED`, `EXPIRED`, `VALIDATED`, `FAILED`


            The payment status of the extended preauthorization object:

