openapi: 3.2.0
info:
  title: Reference Payins API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Payins
paths:
  /v2.01/{ClientId}/payins/{PayInId}:
    get:
      operationId: payins_view_payin
      summary: View a PayIn
      description: '**Note – Pay-in data retained for 13 months**


        An API call to retrieve a pay-in whose `CreationDate` is older than 13 months may return 404 Not Found.


        For more information, see the Data availability periods article.


        Retrieve any pay-in by its `Id`. The object returned depends on the endpoint that was used to create it. The difference is indicated by the `PaymentType`, `ExecutionType`, and in some cases other properties.'
      tags:
      - Payins
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayInId
        in: path
        description: The unique identifier of the pay-in.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewAPayInResponse'
      security:
      - oauth2: []
components:
  schemas:
    RecurringApplePayPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds. The values must match those requested from Apple Pay, because they are encrypted in the `PaymentData`.
      title: RecurringApplePayPayInResponseDebitedFunds
    BankWirePayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: 'Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).


        For a direct bank wire pay-in, the `CreditedFunds` displays placeholder values (currency `XXX` and amount `0`) until the `Status` changes to `SUCCEEDED`.'
      title: BankWirePayInResponseCreditedFunds
    RecurringPayPalPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: RecurringPayPalPayInResponseCreditedFunds
    RecurringGooglePayPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: RecurringGooglePayPayInResponseCreditedFunds
    AuthenticationResult:
      type: object
      properties:
        AuthenticationType:
          type:
          - string
          - 'null'
          description: '**Returned values:** `CHALLENGE`, `FRICTIONLESS`, `DIRECT_AUTHORIZATION`


            The type of authentication:


            - `CHALLENGE` – The issuer requested SCA to be enforced (for example, using 3DS).

            - `FRICTIONLESS` – The transaction was exempted from SCA because an exemption was granted by the issuer.

            - `DIRECT_AUTHORIZATION` – The transaction was sent to the issuer for authorization without any frictionless or challenge (for example, if SCA doesn''t apply). A `null` value typically indicates that authentication was not requested (for example, because the request failed before being sent) or a decision was not received.


            A `null` value typically indicates that authentication was not requested (for example, because the request failed before being sent) or a decision was not received.'
      description: Information about the authentication result, based on the request made by Mangopay and the decision of the issuer regarding the type of authentication to be enforced (if applicable).
      title: AuthenticationResult
    MultibancoPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: MultibancoPayInResponseDebitedFunds
    SwishPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency_SEK'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: SwishPayInResponseCreditedFunds
    RecurringPayPalPayInResponseLineItemsItems:
      type: object
      properties:
        Name:
          type: string
          description: The name of the item.
        Quantity:
          type: integer
          description: The quantity of the item.
        UnitAmount:
          type: integer
          description: The cost of the item, excluding tax.
        TaxAmount:
          type: integer
          description: The tax amount applied to the item.
        Description:
          type: string
          description: 'The platform''s unique reference for the seller. This value must be consistently used for the given seller. You can use, for example, the Mangopay `UserId` or the seller''s business name or first name and last name.


            **Caution:** Failure to use a unique seller identifier may result in PayPal restricting your service.'
        Category:
          type: string
          description: '**Returned values:** `PHYSICAL_GOODS`, `DIGITAL_GOODS`, `DONATION`


            The category of the item:

            - `PHYSICAL_GOODS` – Tangible items that can be physically shipped and received with proof of delivery upon arrival.

            - `DIGITAL_GOODS` – Products or services that are distributed and consumed via digital platforms or devices.

            - `DONATION` – Voluntary contribution made without any goods or services received in return. Multiple line items can be categorized as `DONATION` within a single transaction, however it is not possible to combine `DONATION` other line item categories within the same transaction.'
      title: RecurringPayPalPayInResponseLineItemsItems
    MultibancoPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: MultibancoPayInResponseFees
    BancontactPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: BancontactPayInResponseDebitedFunds
    StatementDescriptor_DD:
      type: string
      description: "Max. length: SEPA: 100 characters, BACS: truncated after 10 characters; only alphanumeric and spaces\n\nCustom description to appear on the user's bank statement along with the platform name. \n\nDifferent banks may show more or less information. See the <a href=\"/bank-statements\">Customizing bank statement references</a> article for details. \n\n**Note:** On BACS Direct Debit pay-ins, the length is truncated at 10 alphanumeric characters or spaces, but the technical limit is 100."
      title: StatementDescriptor_DD
    BlikPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency_PLN'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: BlikPayInResponseCreditedFunds
    DeprecatedGiropayPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: DeprecatedGiropayPayInResponseDebitedFunds
    PayPalPayInResponseShipping:
      type: object
      properties:
        FirstName:
          type: string
          description: The first name of the user.
        LastName:
          type: string
          description: The last name of the user.
        Address:
          $ref: '#/components/schemas/Address'
      description: Information about the end user's shipping address, managed by `ShippingPreference`.
      title: PayPalPayInResponseShipping
    RecurringGooglePayPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: RecurringGooglePayPayInResponseDebitedFunds
    BlikPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency_PLN'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: BlikPayInResponseDebitedFunds
    SatispayPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: SatispayPayInResponseCreditedFunds
    BLIKPayInResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorResponse'
        DebitedFunds:
          $ref: '#/components/schemas/BlikPayInResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/BlikPayInResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/BlikPayInResponseFees'
          description: Information about the fees.
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        PaymentType:
          type: string
          description: '**Returned values:** `BLIK`


            The payment type of the pay-in.'
        ExecutionType:
          type: string
          description: '**Returned values:** `WEB`


            The execution type of the pay-in.'
        ReturnURL:
          $ref: '#/components/schemas/ReturnURL_255'
        RedirectURL:
          type: string
          description: 'The URL to which to redirect the user to complete the payment.


            **Caution:** This variable URL is specific to each payment. You must rely on the returned URL in full (host, path, and queries) and not hardcode any part of it.'
        StatementDescriptor:
          $ref: '#/components/schemas/StatementDescriptor'
        Code:
          type:
          - string
          - 'null'
          description: The 6-digit code sent in the request (otherwise returned `null`).
        BrowserInfo:
          oneOf:
          - $ref: '#/components/schemas/BlikPayInResponseBrowserInfo'
          - type: 'null'
          description: Information about the browser used by the end user (author) to perform the payment.
        IpAddress:
          type:
          - string
          - 'null'
          description: The IP address of the end user initiating the transaction, in IPV4 or IPV6 format.
      description: 'A BLIK pay-in:

        - `PaymentType` – `BLIK`

        - `ExecutionType` – `WEB`'
      title: BLIKPayInResponse
    PayconiqPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: PayconiqPayInResponseDebitedFunds
    RecurringApplePayPayInResponseShipping:
      type: object
      properties: {}
      description: Information about the end user's shipping address. On Apple Pay, `null` is returned as 3DS redirection does not apply.
      title: RecurringApplePayPayInResponseShipping
    PayPalPayInResponseTrackingsItems:
      type: object
      properties:
        TrackingNumber:
          type: string
          description: The shipment's tracking number provided by the carrier.
        Carrier:
          type: string
          description: The carrier for the shipment. Use the country-specific version of the carrier if it exists, otherwise use its global version.
        NotifyBuyer:
          type: boolean
          description: '**Default value:** false


            If `true`, sends an email notification to the `PaypalBuyerAccountEmail` containing the `TrackingNumber` and `Carrier`, which allows the end user to track their shipment with the carrier.'
      title: PayPalPayInResponseTrackingsItems
    RecurringApplePayPayInResponseBrowserInfo:
      type: object
      properties: {}
      description: Information about the browser used by the end user (author) to perform the payment. On Apple Pay, `null` is returned as 3DS redirection does not apply.
      title: RecurringApplePayPayInResponseBrowserInfo
    SatispayPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: SatispayPayInResponseFees
    IdealPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: IdealPayInResponseFees
    Currency_CHF:
      type: string
      description: '**Allowed values:** `CHF`


        The currency of the amount.'
      title: Currency_CHF
    RecurringPayPalPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: RecurringPayPalPayInResponseFees
    ApplePayPayInResponseBrowserInfo:
      type: object
      properties: {}
      description: Information about the browser used by the end user (author) to perform the payment. On Apple Pay, `null` is returned as 3DS redirection does not apply.
      title: ApplePayPayInResponseBrowserInfo
    Address:
      type: object
      properties:
        AddressLine1:
          type: string
          description: The first line of the address.
        AddressLine2:
          type: string
          description: The second line of the address.
        City:
          type: string
          description: The city of the address.
        Region:
          type: string
          description: Required if `Country` is US, CA, or MX. The region of the address.
        PostalCode:
          type: string
          description: 'The postal code of the address. The postal code can contain the following characters: alphanumeric, dashes, and spaces.'
        Country:
          type: string
          description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


            The country of the address.'
      description: The postal address.
      title: Address
    TransactionNature:
      type: string
      description: '**Returned values:** `REGULAR`, `REPUDIATION`, `REFUND`, `SETTLEMENT`


        The nature of the transaction, providing more information about the context in which the transaction occurred:

        - `REGULAR` – Relative to most of the transactions (pay-ins, payouts, and transfers) in a usual workflow.

        - `REPUDIATION` – Automatic withdrawal of funds from the platform''s repudiation wallet as part of the dispute process (when the user has requested a chargeback).

        - `REFUND` – Reimbursement of a transaction to the user (pay-in refund), to a wallet (transfer refund), or of a payout (payout refund, only initiated by Mangopay).

        - `SETTLEMENT` – Transfer made to the repudiation wallet by the platform to settle a lost dispute.'
      title: TransactionNature
    GooglePayPayInResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorResponse'
        DebitedFunds:
          $ref: '#/components/schemas/GooglePayPayInResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/GooglePayPayInResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/GooglePayPayInResponseFees'
          description: Information about the fees taken by the platform for this transaction (and hence transferred to the Fees Wallet).
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        PaymentType:
          type: string
          description: '**Returned values:** `GOOGLE_PAY`


            The payment type of the pay-in.'
        ExecutionType:
          type: string
          description: '**Returned values:** `DIRECT`


            The execution type of the pay-in.'
        StatementDescriptor:
          $ref: '#/components/schemas/StatementDescriptor_22'
        SecureModeNeeded:
          type: boolean
          description: Whether or not the `SecureMode` was used.
        Billing:
          $ref: '#/components/schemas/Billing_DefaultsShippingUser_Response'
        Shipping:
          $ref: '#/components/schemas/Shipping_DefaultsBillingUser_Response'
        BrowserInfo:
          $ref: '#/components/schemas/BrowserInfo'
        IpAddress:
          $ref: '#/components/schemas/IpAddress'
        CardInfo:
          $ref: '#/components/schemas/CardInfo'
        AuthenticationResult:
          $ref: '#/components/schemas/AuthenticationResult'
      description: 'A one-time Google Pay pay-in:

        - `PaymentType` – `GOOGLE_PAY`

        - `ExecutionType` – `DIRECT`

        - Object does not include `RecurringPayinRegistrationId`'
      title: GooglePayPayInResponse
    BankWirePayInResponseBankAccount:
      type: object
      properties:
        OwnerAddress:
          $ref: '#/components/schemas/Address'
        Type:
          type: string
          description: '**Returned values:** `IBAN`, `US`, `CA`, `GB`, `OTHER`


            The type of the bank account.'
        OwnerName:
          type: string
          description: The full name of the owner of the bank account.
        IBAN:
          type: string
          description: The IBAN (international bank account number) for the bank account.
        BIC:
          type: string
          description: The BIC (international identifier of the bank) for the bank account.
      description: Information about the bank account to which the bank wire must be made by the end user. **Caution:** Do not hardcode the returned values. Mangopay may change the underlying bank details without prior notice.
      title: BankWirePayInResponseBankAccount
    IdealPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: IdealPayInResponseDebitedFunds
    Id:
      type: string
      description: 'Max length: 128 characters (see [data formats](/api-reference/overview/data-formats) for details)


        The unique identifier of the object.'
      title: Id
    PayByBankPayInResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        DebitedFunds:
          $ref: '#/components/schemas/PayByBankPayInResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/PayByBankPayInResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/PayByBankPayInResponseFees'
          description: Information about the fees.
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        CreditedUserId:
          $ref: '#/components/schemas/CreditedUserId'
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorResponse'
        PaymentType:
          type: string
          description: '**Returned values:** `PAY_BY_BANK`


            The payment type of the pay-in.'
        ExecutionType:
          type: string
          description: '**Returned values:** `WEB`


            The execution type of the pay-in.'
        ReturnURL:
          $ref: '#/components/schemas/ReturnURL_255'
        RedirectURL:
          type: string
          description: 'The URL to which to redirect the user to complete the payment.


            **Caution:** This variable URL is specific to each payment. You must rely on the returned URL in full (host, path, and queries) and not hardcode any part of it.'
        StatementDescriptor:
          $ref: '#/components/schemas/StatementDescriptor'
        Country:
          type: string
          description: '**Allowed values:** `AT`, `DE`, `DK`, `EE`, `ES`, `FI`, `FR`, `GB`, `IE`, `IT`, `LV`, `LT`, `NL`, `NO`, `PL`, `PT`.


            The country of residence of the user.'
        BIC:
          type: string
          description: 'The BIC of the user''s bank account, which is only returned if it was sent.


            If both the `IBAN` and `BIC` are provided, one of the two authentication steps required by certain banks may be avoided.'
        IBAN:
          type: string
          description: 'The IBAN of the user''s bank account, which is only returned if it was sent.


            If both the `IBAN` and `BIC` are provided, one of the two authentication steps required by certain banks may be avoided.'
        PaymentFlow:
          type: string
          description: '**Allowed values:** `WEB`, `APP`


            **Default value:** `WEB`


            The platform environment of the post-payment flow. The `PaymentFlow` value combines with the `ReturnURL` to manage the redirection behavior after payment:

            - Set the value to `APP` to send the user to your platform''s mobile app

            - Set the value to `WEB` to send the user to a web browser


            In both cases you need to provide the relevant `ReturnURL`, whether to your app or website.'
        BankName:
          type: string
          description: '**Allowed values:** One of the [supported bank names](/guides/payment-methods/banking/pay-by-bank#banks-and-schemes).


            The name of the bank, which is only returned if it was sent.


            If the `BankName` is provided, the user doesn''t have to select their bank when they are redirected.'
        Culture:
          type: string
          description: '**Allowed values:** `DA`, `CS`, `DE`, `EN`, `ET`, `ES`, `FI`, `FR`, `IT`, `LT`, `LV`, `NL`, `NO`, `PL`, `PT`, `SV`


            **Default value:** `EN`


            The language in which the Tink open banking page is to be displayed.'
        Scheme:
          type: string
          description: '**Allowed values:** One of the [supported schemes](/guides/payment-methods/banking/pay-by-bank#banks-and-schemes) for the `Country`.


            **Default value:** The [listed instant scheme](/guides/payment-methods/banking/pay-by-bank#banks-and-schemes) for the `Country`. If `Country` is `DK`, there is no default and the `Scheme` must be specified.


            The scheme to use to process the payment. Note that some banks may charge additional fees to the user for instant payment schemes.'
        ProcessingStatus:
          type: string
          description: '**Possible values:** `PENDING_SUCCEEDED`


            Parameter that is only returned once the bank wire has been successfully authenticated and initiated by the user but has not yet been received by Mangopay. When the funds are received, the `Status` changes from `CREATED` to `SUCCEEDED` and the `ProcessingStatus` is no longer returned.


            For non-instant schemes, processing can take up to 72 hours but is typically completed within 2 days.'
      description: 'A Pay by Bank pay-in:

        - `PaymentType` – `PAY_BY_BANK`

        - `ExecutionType` – `WEB`'
      title: PayByBankPayInResponse
    ExternalInstructionPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: ExternalInstructionPayInResponseDebitedFunds
    CardInfo:
      type: object
      properties:
        BIN:
          type: string
          description: The bank identification number (BIN) of the card.
        IssuingBank:
          type: string
          description: The name of the bank that issued the card.
        IssuerCountryCode:
          type: string
          description: The country code of the card issuer.
        Type:
          type: string
          description: The type of card (for example, `CREDIT` or `DEBIT`).
        SubType:
          type:
          - string
          - 'null'
          description: The sub-type of the card, if available.
        Brand:
          type: string
          description: The card brand (for example, `VISA` or `MASTERCARD`).
      description: Information about the card used for the transaction. If the information or data is not available, `null` is returned.
      title: CardInfo
    WebCardPayInResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
