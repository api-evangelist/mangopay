        IBAN:
          type: string
          description: "Max. length: 34 characters\n\nThe IBAN (international bank account number) of the bank account.\nIt follows the CCDDBBAN format in which:\n\n- CC represents the country code (ISO 3166-1 alpha 2)\n- DD represents two check digits used by banking systems to avoid simple errors\n- BBAN stands for the Basic Bank Account Number which is up to 30 alphanumeric characters that are country-specific.\n  Note: You will need a valid IBAN (i.e., existing in real life) when testing on a Sandbox account even if no actual payout will be processed."
        BIC:
          type: string
          description: 'The BIC (international identifier of the bank) for IBAN or OTHER-type bank accounts.


            The BIC can have one of the two following formats:


            - BIC8 – 8-character BIC (AAAABBCC)

            - BIC11 – 11-character BIC (AAAABBCCDDD)


            In which:


            - AAAA represents the bank code: 4 characters defining the bank

            - BB represents the country code: 2 characters forming the country ISO code (ISO 3166 format)

            - CC represents the location code: 2 localization characters (alphabetical or numeric) to distinguish banks from the same country

            - DDD represents the branch code: 3 characters used to define the branch of the bank (sometimes replaced with XXX)'
        AccountNumber:
          type: string
          description: The unique number of the bank account.
        Country:
          type: string
          description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


            The country in which the bank account is registered.'
      description: 'Information about the debited bank account.


