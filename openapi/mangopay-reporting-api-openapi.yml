openapi: 3.2.0
info:
  title: Reference Reporting API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Reporting
paths:
  /v2.01/{ClientId}/reporting/reports:
    post:
      operationId: reporting_create_report
      summary: Create a Report
      description: 'Generate a reporting service report


        This endpoint generates a report from Mangopay''s Reporting Service, which is replacing the legacy report types (read the guide).


        There are 2 reports (indicated by `ReportType`) that may be useful to all platforms: `USER_WALLET_TRANSACTIONS` and `COLLECTED_FEES`.


        There are 4 `ReportType` that are designed to support platforms using Echo, Mangopay solution for integrations working with third-party PSPs: `ECHO_INTENT`, `ECHO_INTENT_ACTION`, `ECHO_SETTLEMENT`, `ECHO_SPLIT`.


        Each `ReportType` has different available `Columns` and `Filters`.


        **Note – Report expires after 31 days**


        A Reporting Service report expires after 31 days, at which point it can no longer be downloaded. On expiry, the report''s `Status` becomes `EXPIRED` and the `DownloadURL` becomes `null`.


        You can generate a new report with the same filters and dates.'
      tags:
      - Reporting
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAReportRequest'
      security:
      - oauth2: []
    get:
      operationId: reporting_list_reports
      summary: List all Reports
      description: List key data of Reporting Service reports
      tags:
      - Reporting
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: Status
        in: query
        description: '**Possible values:** `PENDING`, `GENERATING`, `GENERATED`, `EXPIRED`, `FAILED`


          The status of the report:

          - `PENDING` – The report generation request was accepted but is not yet being processed.

          - `GENERATING` – The report is being generated.

          - `GENERATED` – The report is ready for download at the `DownloadURL`

          - `EXPIRED` – The report has expired and is no longer available for download.

          - `FAILED` – Report generation was not successful.'
        required: false
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the report was created (based on the report's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the report was created (based on the report's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Min. value: `1`; max. value: `100`


          **Default value:** `10`


          Indicates the number of items returned for each page of the pagination.'
        required: false
        schema:
          type: integer
      - name: page
        in: query
        description: 'Start value: `1`


          **Default value:** `1`


          Indicates the index of the page for the pagination.'
        required: false
        schema:
          type: integer
      - name: Sort
        in: query
        description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


          **Default value:** `CreationDate:ASC`


          Indicates the direction in which to sort the list.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllReportsResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/reporting/reports/{ReportingId}:
    get:
      operationId: reporting_view_report
      summary: View a Report
      description: Retrieve a report from the Reporting Service
      tags:
      - Reporting
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: ReportingId
        in: path
        description: The unique identifier of the Reporting Service report.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponse'
      security:
      - oauth2: []
components:
  schemas:
    ListAllReportsResponseArrayReportsItems:
      type: object
      properties:
        Object (reports):
          $ref: '#/components/schemas/ListAllReportsResponseArrayReportsItemsObjectReports'
          description: Key data about the Reporting Service report object created by the platform.
      title: ListAllReportsResponseArrayReportsItems
    CreateAReportResponseColumnsItems:
      type: object
      properties:
        Name:
          type: string
          description: The name of the column.
        IsDefault:
          type: boolean
          description: Whether the column is a default for the report or not.
      title: CreateAReportResponseColumnsItems
    CreateAReportResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        ReportDate:
          type:
          - integer
          - 'null'
          description: Unix timestamp (UTC) of the date and time the report was generated.
        Status:
          type: string
          description: '**Returned values:** `PENDING`, `READY_FOR_DOWNLOAD`, `FAILED`, `EXPIRED`


            The status of the report:

            - `PENDING` – The report is being generated.

            - `READY_FOR_DOWNLOAD` – The report has been created, and can be downloaded.

            - `FAILED` – The report cannot be generated.

            - `EXPIRED` – The report was created, but is no longer available for download (it can be re-run to be downloaded again with fresh data).'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        DownloadFormat:
          type: string
          description: '**Returned values:** `CSV`


            The format in which the report is going to be downloaded.'
        DownloadURL:
          type:
          - string
          - 'null'
          description: The URL at which the report file can be downloaded when the `Status` is `GENERATED`.
        ReportType:
          $ref: '#/components/schemas/ReportType_Reporting_Response'
        Sort:
          type: string
          description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


            **Default value**: `CreationDate:DESC`


            The sort direction based on transaction creation date.'
        DateRangeBy:
          type:
          - string
          - 'null'
          description: '**Possible values:** `CreationDate`, `ExecutionDate`


            **Default value:** `CreationDate`


            The date to which `BeforeDate` and `AfterDate` apply. The `DateRangeBy` property can only be sent on `USER_WALLET_TRANSACTIONS` and `COLLECTED_FEES` reports. It is returned `null` for other types.


            The `ExecutionDate` value is likely to be more useful, because this is the date and time that the transaction `Status` became `SUCCEEDED`. Note also that these reports only contain successful transactions.'
        AfterDate:
          type: integer
          description: '**Possible values:** Any date and time (before the `BeforeDate`) between the present and 24 months ago.


            The date and time after which the report''s transaction was created, based on the transaction''s `CreationDate`.


            **Note:** The period between the `AfterDate` and the `BeforeDate` cannot exceed 12 months.'
        BeforeDate:
          type: integer
          description: '**Possible values:** Any date and time (after the `AfterDate`) between the present and 24 months ago.


            The date and time before which the report''s transaction was created, based on the transaction''s `CreationDate`.


            **Note:** The period between the `AfterDate` and the `BeforeDate` cannot exceed 12 months.'
        Filters:
          $ref: '#/components/schemas/CreateAReportResponseFilters'
          description: The filters sent in the request. Different filters are available for each `ReportType`.
        Columns:
          type: array
          items:
            $ref: '#/components/schemas/CreateAReportResponseColumnsItems'
          description: '**Possible values:** The columns listed in the [Reports](/reports) guide, which differ according to the report type.


            **Default values:** The default columns listed in the [Reports](/reports) guide, which differ according to the report type.


            The data columns to be included in the report.'
      title: CreateAReportResponse
    ReportType_ECHO_SETTLEMENT_Request:
      type: string
      description: '**Allowed values:** `ECHO_SETTLEMENT`


        The type of the report. Each `ReportType` has different available `Columns` and `Filters`.


        Useful for all platforms:

        - `USER_WALLET_TRANSACTIONS` – All successful transactions crediting or debiting user wallets: pay-ins, transfers, conversions, and payouts, as well as refunds of all types and repudiations (from chargebacks).

        - `COLLECTED_FEES`– Detail of transactions crediting or debiting the fees wallet: successful transactions of all types (pay-ins, transfers, refunds, payouts, etc.) that have a positive or negative fees amount.


        Useful for platforms using [Echo](/guides/echo), Mangopay''s solution for integrations working with third-party PSPs:

        - `ECHO_INTENT` – Summary of all intents declared during the selected period, detailing the total funds expected to enter the platform''s technical wallets.

        - `ECHO_INTENT_ACTION` – Summary of all operations related to intents processed during the selected period, detailing the expected money movements to be escrowed — including payments, refunds, refund reversals, and chargebacks.

        - `ECHO_SETTLEMENT` – Summary of all settlement files uploaded during the selected period to initiate the reconciliation process, confirming the funds expected on the techncial wallet.

        - `ECHO_SPLIT` – Summary of all splits related to intents during the selected period, detailing the transfer of funds to the declared destination.'
      title: ReportType_ECHO_SETTLEMENT_Request
    ReportType_COLLECTED_FEES_Request:
      type: string
      description: '**Allowed values:** `COLLECTED_FEES`


        The type of the report. Each `ReportType` has different available `Columns` and `Filters`.


        Useful for all platforms:

        - `USER_WALLET_TRANSACTIONS` – All successful transactions crediting or debiting user wallets: pay-ins, transfers, conversions, and payouts, as well as refunds of all types and repudiations (from chargebacks).

        - `COLLECTED_FEES`– Detail of transactions crediting or debiting the fees wallet: successful transactions of all types (pay-ins, transfers, refunds, payouts, etc.) that have a positive or negative fees amount.


        Useful for platforms using [Echo](/guides/echo), Mangopay''s solution for integrations working with third-party PSPs:

        - `ECHO_INTENT` – Summary of all intents declared during the selected period, detailing the total funds expected to enter the platform''s technical wallets.

        - `ECHO_INTENT_ACTION` – Summary of all operations related to intents processed during the selected period, detailing the expected money movements to be escrowed — including payments, refunds, refund reversals, and chargebacks.

        - `ECHO_SETTLEMENT` – Summary of all settlement files uploaded during the selected period to initiate the reconciliation process, confirming the funds expected on the techncial wallet.

        - `ECHO_SPLIT` – Summary of all splits related to intents during the selected period, detailing the transfer of funds to the declared destination.'
      title: ReportType_COLLECTED_FEES_Request
    ReportFilters_COLLECTED_FEES:
      type: object
      properties:
        Currency:
          type: string
          description: The currency of the `DebitedFunds`, `CreditedFunds`, or `Fees` of the transactions.
      description: 'Filters available on the `COLLECTED_FEES` report. The `Currency` filter

        is available; if not specified, the report contains data on all

        currencies.'
      title: ReportFilters_COLLECTED_FEES
    ReportFilters_USER_WALLET_TRANSACTIONS:
      type: object
      properties:
        Currency:
          type: string
          description: The currency of the `DebitedFunds`, `CreditedFunds`, or `Fees` of the transactions.
        UserId:
          type: string
          description: The unique identifier of the user referenced as the `AuthorId` of the transaction.
        WalletId:
          type: string
          description: The unique identifier of the wallet referenced as the `DebitedWalletId` or `CreditedWalletId` of the transaction.
      description: 'Filters available on the `USER_WALLET_TRANSACTIONS` report. `Currency`,

        `UserId`, and `WalletId` can be used alone or in combination, in which

        case the report data satisfies both filters. `Currency` and `WalletId`

        cannot be used together. If no filters are specified, the report

        contains all successful transactions crediting or debiting all user

        wallets.'
      title: ReportFilters_USER_WALLET_TRANSACTIONS
    CreateAReportRequest_ECHO_INTENT:
      type: object
      properties:
        Tag:
          $ref: '#/components/schemas/Tag'
        DownloadFormat:
          type: string
          description: '**Possible values:** `CSV`


            The format of the report file.'
        Sort:
          type: string
          description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


            **Default value**: `CreationDate:DESC`


            The sort direction based on transaction creation date.'
        AfterDate:
          type: integer
          description: '**Possible values:** Any past date and time up 24 months ago that is earlier than the `BeforeDate` by less than 12 months.


            The date and time after which the report''s transaction was created, based on the transaction''s `CreationDate`.'
        BeforeDate:
          type: integer
          description: '**Possible values:** Any past date and time up 24 months ago that is later than the `AfterDate` by less than 12 months.


            The date and time before which the report''s transaction was created, based on the transaction''s `CreationDate`.'
        Columns:
          type: array
          items:
            type: string
          description: '**Possible values:** The columns listed in the [Reports](/reports) guide, which differ according to the report type.


            **Default values:** The default columns listed in the [Reports](/reports) guide, which differ according to the report type.


            The data columns to be included in the report.'
        ReportType:
          $ref: '#/components/schemas/ReportType_ECHO_INTENT_Request'
        Filters:
          $ref: '#/components/schemas/ReportFilters_ECHO_INTENT'
      required:
      - DownloadFormat
      - AfterDate
      - BeforeDate
      - ReportType
      description: 'Request body for creating an `ECHO_INTENT` report, with its available `Filters`.


        Summary of all intents declared during the selected period, detailing the total funds expected to enter the platform''s technical wallets.'
      title: CreateAReportRequest_ECHO_INTENT
    ReportType_ECHO_INTENT_ACTION_Request:
      type: string
      description: '**Allowed values:** `ECHO_INTENT_ACTION`


        The type of the report. Each `ReportType` has different available `Columns` and `Filters`.


        Useful for all platforms:

        - `USER_WALLET_TRANSACTIONS` – All successful transactions crediting or debiting user wallets: pay-ins, transfers, conversions, and payouts, as well as refunds of all types and repudiations (from chargebacks).

        - `COLLECTED_FEES`– Detail of transactions crediting or debiting the fees wallet: successful transactions of all types (pay-ins, transfers, refunds, payouts, etc.) that have a positive or negative fees amount.


        Useful for platforms using [Echo](/guides/echo), Mangopay''s solution for integrations working with third-party PSPs:

        - `ECHO_INTENT` – Summary of all intents declared during the selected period, detailing the total funds expected to enter the platform''s technical wallets.

        - `ECHO_INTENT_ACTION` – Summary of all operations related to intents processed during the selected period, detailing the expected money movements to be escrowed — including payments, refunds, refund reversals, and chargebacks.

        - `ECHO_SETTLEMENT` – Summary of all settlement files uploaded during the selected period to initiate the reconciliation process, confirming the funds expected on the techncial wallet.

        - `ECHO_SPLIT` – Summary of all splits related to intents during the selected period, detailing the transfer of funds to the declared destination.'
