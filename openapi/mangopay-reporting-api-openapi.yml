        ReportType:
          $ref: '#/components/schemas/ReportType_ECHO_INTENT_ACTION_Request'
        Filters:
          $ref: '#/components/schemas/ReportFilters_ECHO_INTENT_ACTION'
      required:
      - DownloadFormat
      - AfterDate
      - BeforeDate
      - ReportType
      description: "Request body for creating an `ECHO_INTENT_ACTION` report, with its available `Filters`. \n\nSummary of all operations related to intents processed during the selected period, detailing the expected money movements to be escrowed — including payments, refunds, refund reversals, and chargebacks."
      title: CreateAReportRequest_ECHO_INTENT_ACTION
    ReportFilters_ECHO_INTENT_ACTION:
      type: object
      properties:
        Type:
          type: string
          description: '**Possible values:** `PAYIN`, `REFUND`, `DISPUTE`.


            The type of Intent (as indicated in the settlement file).'
        Status:
          type: string
          description: '**Possible values:** `AUTHORIZED`, `PARTIALLY_CAPTURED`, `CAPTURED`, `CANCELED`, `REFUNDED`, `REFUND_REVERSED`, `DISPUTED`, `DEFENDED`, `DISPUTED_WON`, `DISPUTED_LOST`.


            The `Status` of the Intent.'
        PaymentMethod:
          type: string
          description: The payment method of the Intent – one of the [supported values](/api-reference/echo/supported-payment-methods) of the `ExternalProviderPaymentMethod`.
      description: 'Filters available on the `ECHO_INTENT_ACTION` report. Can be used in any

        combination. (`ECHO_INTENT` and `ECHO_INTENT_ACTION` share the same

        filter shape.)'
      title: ReportFilters_ECHO_INTENT_ACTION
    CreateAReportRequest_COLLECTED_FEES:
      type: object
      properties:
        Tag:
          $ref: '#/components/schemas/Tag'
        DownloadFormat:
          type: string
          description: '**Possible values:** `CSV`


