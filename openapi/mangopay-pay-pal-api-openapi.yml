openapi: 3.2.0
info:
  title: Reference PayPal API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Pay Pal
paths:
  /v2.01/{ClientId}/payins/payment-methods/paypal/data-collection:
    post:
      operationId: paypal_submit_data_paypal_payin
      summary: Submit data for a PayPal PayIn
      description: 'Provide transaction data to PayPal prior to initiating a pay-in (read guide).


        **Note – Data to submit depends on industry**


        The request body parameters described below are required for all marketplace businesses.


        Additional data points are required for platforms operating in the following industries:

        - Events and ticketing

        - Online travel agents:

        - Car rentals

        - Hotels

        - Transportation

        - Travel packages

        - Retail and groceries

        - Cruise lines

        - Buy online, pick up in store (BOPIS)

        - Crypto


        Before integrating this endpoint, platforms operating in the verticals above need to contact Mangopay via the Dashboard.


        The `DataCollectionId` returned in the response must be sent on the associated pay-in call for both one-time and recurring payments:

        - POST Create a PayPal PayIn

        - POST Create a Recurring PayPal PayIn with the CIT payload

        - POST Create a Recurring PayPal PayIn with the MIT payload


        Each PayPal pay-in or preauth requires a new `DataCollectionId`. The property is not returned on the pay-in endpoints.'
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitDataForAPayPalPayInResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitDataForAPayPalPayInRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payins/payment-methods/paypal/data-collection/{DataCollectionId}:
    get:
      operationId: paypal_view_data_paypal_payin
      summary: View data submitted for a PayPal PayIn
      description: Retrieve pre-transaction data submitted previously.
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: DataCollectionId
        in: path
        description: The unique identifier of the Data Collection object, returned after sending the requested data to the [POST Submit data for a PayPal PayIn](/api-reference/paypal/submit-data-paypal-payin) endpoint.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewDataSubmittedForAPayPalPayInResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payins/payment-methods/paypal:
    post:
      operationId: paypal_create_paypal_payin
      summary: Create a PayPal PayIn
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPalPayInResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPayPalPayInRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payins/paypal/web:
    post:
      operationId: paypal_create_paypal_payin_web
      summary: Create a PayPal PayIn
      description: '**Caution – Deprecated legacy integration**


        This endpoint is the legacy integration of PayPal with Mangopay. If you are integrating PayPal for the first time, use the new POST Create a PayPal PayIn endpoint.


        Existing legacy integrations continue to be supported, but any integration enhancements are only developed on the new endpoint.


        Platforms are strongly encouraged to move to the new integration to benefit from additional features, including:

        - Recurring payment flows

        - Support for tracking information to sync evidence of shipped goods

        - Additional API payload data such as shipping preference, platform references, and PayPal user information'
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecatedPayPalPayInResponse'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeprecatedCreateAPayPalPayInRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payins/payment-methods/paypal/recurring:
    post:
      operationId: paypal_create_recurring_paypal_payin
      summary: Create a Recurring PayPal PayIn (CIT or MIT)
      description: 'Request a recurring PayPal pay-in based on a `RecurringPayinRegistrationId` with `PaymentType` `PAYPAL`, obtained from POST Create a Recurring PayIn Registration.


        There are two possible paylods:

        - **CIT** – Customer-initiated transaction when the user is on session, requiring them to authenticate via PayPal on the `RedirectURL` returned.

        - **MIT** – Subsequent merchant-initiated transactions in the absence of the user, based on the initial successful authentication.


        Read the guide to PayPal recurring payments **→**'
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayPalPayInResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/paypal_create_recurring_paypal_payin_Request'
      security:
      - oauth2: []
  /v2.01/{ClientId}/deposit-preauthorizations/payment-methods/paypal:
    post:
      operationId: paypal_create_paypal_deposit_preauthorization
      summary: Create a PayPal Deposit Preauthorization
      description: '**Warning – Deprecated feature**


        This endpoint is deprecated. Use POST Create a PayPal Extended Preauthorization instead.


        The Deposit Preauthorization endpoints are scheduled for decommissioning at the end of 2027. Platforms with existing integrations need to move to the new endpoints at their earliest convenience before then.


        The Extended Preauthorization feature is a like-for-like renaming of the legacy Deposit Preauthorization – the behavior is otherwise unchanged.


        The previous use of the term "deposit" was for convenience only and does not constitute a traditional banking deposit under applicable banking regulations, including the EU Capital Requirements Directive (Directive 2013/36/EU) or the Deposit Guarantee Schemes Directive (Directive 2014/49/EU). Accordingly, these funds are not covered by any statutory deposit protection schemes, and Mangopay does not operate as a licensed banking institution.


        This endpoint creates a Deposit Preauthorization with `PaymentType` of `PAYPAL` and returns the PayPal `RedirectURL` on which the user can preauthorize the debited funds.


        Once authorized (`Status` becomes `SUCCEEDED`), you can capture the funds using the POST Create a Deposit Preauthorized PayIn endpoint.


        **Best practice - Capture funds within 3 days**


        PayPal recommends that you capture preauthorized funds within 3 days (using POST Create a Deposit Preauthorized PayIn). This is because the success of the capture is subject to risk and the availability of funds on the card (or other funding instrument) that the user has linked to their PayPal account.'
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeprecatedPayPalDepositPreauthorizationResponse'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeprecatedCreateAPayPalDepositPreauthorizationRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/extended-preauthorizations/payment-methods/paypal:
    post:
      operationId: paypal_create_paypal_extended_preauthorization
      summary: Create a PayPal Extended Preauthorization
      description: 'This endpoint creates an Extended Preauthorization with `PaymentType` of `PAYPAL` and returns the PayPal `RedirectURL` on which the user can preauthorize the debited funds.


        Once authorized (`Status` becomes `SUCCEEDED`), you can capture the funds using the POST Create an Extended Preauthorized PayIn endpoint.


        **Best practice - Capture funds within 3 days**


        PayPal recommends that you capture preauthorized funds within 3 days (using POST Create an Extended Preauthorized PayIn). This is because the success of the capture is subject to risk and the availability of funds on the card (or other funding instrument) that the user has linked to their PayPal account.'
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayPalExtendedPreauthorizationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPayPalPreauthorizationRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payins/{PayInId}/trackings:
    put:
      operationId: paypal_add_tracking_paypal_payin
      summary: Add tracking information to a PayPal PayIn
      description: '**Caution – Tracking information cannot be edited**


        You can''t modify the `TrackingNumber`, `Carrier`, or `NotifyBuyer` once added.

        You can only send a unique tracking number once.


        Add tracking information to a PayPal PayIn


        You can use this call to add the tracking number and carrier for `LineItems` shipments, on both one-time and recurring PayPal pay-ins.


        There is no link between the line items and the tracking numbers.


        If adding multiple tracking numbers for the same transaction, it is recommended to set `NotifyBuyer` to `true` on only one of them.'
      tags:
      - Pay Pal
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayInId
        in: path
        description: The unique identifier of the pay-in.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddTrackingInformationToAPayPalPayInResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTrackingInformationToAPayPalPayInRequest'
      security:
      - oauth2: []
components:
  schemas:
    RecurringPayPalPayInResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: RecurringPayPalPayInResponseCreditedFunds
    AddTrackingInformationToAPayPalPayInResponseShipping:
      type: object
      properties:
        FirstName:
          type: string
          description: The first name of the user.
        LastName:
          type: string
          description: The last name of the user.
        Address:
          $ref: '#/components/schemas/Address'
      description: 'Required if `ShippingPreference` is `SET_PROVIDED_ADDRESS`.


        Information about the end user''s shipping address, managed by `ShippingPreference`.'
      title: AddTrackingInformationToAPayPalPayInResponseShipping
    AddTrackingInformationToAPayPalPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: AddTrackingInformationToAPayPalPayInResponseFees
    RecurringPayPalPayInResponseLineItemsItems:
      type: object
      properties:
        Name:
          type: string
          description: The name of the item.
        Quantity:
          type: integer
          description: The quantity of the item.
        UnitAmount:
          type: integer
          description: The cost of the item, excluding tax.
        TaxAmount:
          type: integer
          description: The tax amount applied to the item.
        Description:
          type: string
          description: 'The platform''s unique reference for the seller. This value must be consistently used for the given seller. You can use, for example, the Mangopay `UserId` or the seller''s business name or first name and last name.


            **Caution:** Failure to use a unique seller identifier may result in PayPal restricting your service.'
        Category:
          type: string
          description: '**Returned values:** `PHYSICAL_GOODS`, `DIGITAL_GOODS`, `DONATION`


            The category of the item:

            - `PHYSICAL_GOODS` – Tangible items that can be physically shipped and received with proof of delivery upon arrival.

            - `DIGITAL_GOODS` – Products or services that are distributed and consumed via digital platforms or devices.

            - `DONATION` – Voluntary contribution made without any goods or services received in return. Multiple line items can be categorized as `DONATION` within a single transaction, however it is not possible to combine `DONATION` other line item categories within the same transaction.'
      title: RecurringPayPalPayInResponseLineItemsItems
    DeprecatedPayPalDepositPreauthorizationResponseLineItemsItems:
      type: object
      properties:
        Name:
          type: string
          description: The name of the item.
        Quantity:
          type: integer
          description: The quantity of the item.
        UnitAmount:
          type: integer
          description: The cost of the item, excluding tax.
        TaxAmount:
          type: integer
          description: The tax amount applied to the item.
        Description:
          type: string
          description: 'The platform’s unique reference for the seller. This value must be consistently used for the given seller. You can use, for example, the Mangopay `UserId` or the seller’s business name or first name and last name.


            **Caution:** Failure to use a unique seller identifier may result in PayPal restricting your service.'
        Category:
          type: string
          description: '**Allowed values:** PHYSICAL_GOODS, DIGITAL_GOODS, DONATION


            The category of the item:

            - `PHYSICAL_GOODS` – Tangible items that can be physically shipped and received with proof of delivery upon arrival.

            - `DIGITAL_GOODS` – Products or services that are distributed and consumed via digital platforms or devices.

            - `DONATION` – Voluntary contribution made without any goods or services received in return. Multiple line items can be categorized as `DONATION` within a single transaction, however it is not possible to combine `DONATION` other line item categories within the same transaction.'
        Sku:
          type: string
          description: The SKU or reference for the item on your platform.
        Discount:
          type: integer
          description: The discount applied to the item, in the smallest currency sub-division.
      title: DeprecatedPayPalDepositPreauthorizationResponseLineItemsItems
    DeprecatedCreateAPayPalPayInRequestFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: Information about the fees.
      title: DeprecatedCreateAPayPalPayInRequestFees
    PayPalPayInResponseShipping:
      type: object
      properties:
        FirstName:
          type: string
          description: The first name of the user.
        LastName:
          type: string
          description: The last name of the user.
        Address:
          $ref: '#/components/schemas/Address'
      description: Information about the end user's shipping address, managed by `ShippingPreference`.
      title: PayPalPayInResponseShipping
    PayPalExtendedPreauthorizationResponsePayinsLinked:
      type: object
      properties:
        PayinCaptureId:
          type: string
          description: The unique identifier of the preauthorized pay-in (capture) made against the extended preauthorization to debit the preauthorized funds.
        PayinComplementId:
          type: string
          description: This deprecated parameter is always returned `null`.
      description: Information about the extended preauthorized pay-ins made against the extended preauthorization.
      title: PayPalExtendedPreauthorizationResponsePayinsLinked
    DeprecatedPayPalPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: DeprecatedPayPalPayInResponseFees
    DeprecatedPayPalDepositPreauthorizationResponsePayinsLinked:
      type: object
      properties:
        PayinCaptureId:
          type: string
          description: The unique identifier of the preauthorized pay-in (capture) made against the deposit preauthorization to debit the preauthorized funds.
        PayinComplementId:
          type: string
          description: This deprecated parameter is always returned `null`.
      description: Information about the deposit preauthorized pay-ins made against the deposit preauthorization.
      title: DeprecatedPayPalDepositPreauthorizationResponsePayinsLinked
    SubmitDataForAPayPalPayInResponse:
      type: object
      properties:
        DataCollectionId:
          type: string
          description: 'The unique identifier of the Data Collection object.


            A new `DataCollectionId` is needed for each call to:

            - [POST Create a PayPal PayIn](/api-reference/paypal/create-paypal-payin)

            - [POST Create a Recurring PayPal PayIn](/api-reference/paypal/create-recurring-paypal-payin), with both the CIT and MIT payloads

            - [POST Create a PayPal Extended Preauthorization](/api-reference/extended-preauthorizations/create-paypal-extended-preauthorization)'
      title: SubmitDataForAPayPalPayInResponse
    PayPalPayInResponseTrackingsItems:
      type: object
      properties:
        TrackingNumber:
          type: string
          description: The shipment's tracking number provided by the carrier.
        Carrier:
          type: string
          description: The carrier for the shipment. Use the country-specific version of the carrier if it exists, otherwise use its global version.
        NotifyBuyer:
          type: boolean
          description: '**Default value:** false


            If `true`, sends an email notification to the `PaypalBuyerAccountEmail` containing the `TrackingNumber` and `Carrier`, which allows the end user to track their shipment with the carrier.'
      title: PayPalPayInResponseTrackingsItems
    PayPalExtendedPreauthorizationResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        ExpirationDate:
          type: integer
          description: Unix timestamp (UTC) of the date and time the hold period ends and the preauthorized funds are released. At the expiration date, the extended preauthorization's `PaymentStatus` changes to `EXPIRED` if no captures were made.
        AuthorizationDate:
          type: integer
          description: Unix timestamp (UTC) of the date and time successful authorization occurred. If authorization failed, the value is `null`.
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorResponse'
        DebitedFunds:
          $ref: '#/components/schemas/PayPalExtendedPreauthorizationResponseDebitedFunds'
          description: Information about the preauthorized funds.
        Status:
          $ref: '#/components/schemas/AuthorizationStatus'
        PaymentStatus:
          type: string
          description: '**Returned values:** `WAITING`, `CANCELED`, `CANCEL_REQUESTED`, `EXPIRED`, `VALIDATED`, `FAILED`


            The payment status of the extended preauthorization object:

            - `WAITING` – The extended preauthorization can be used: the preauthorized funds can be captured (if `Status` is `SUCCEEDED`) or the preauthorization can be canceled manually.

            - `CANCELED` – Value to pass to manually cancel the extended preauthorization before use; indicates that the extended preauthorization was canceled manually.

            - `CANCEL_REQUESTED` – The cancellation of the extended preauthorization has been requested but not yet processed.

            - `EXPIRED` – The hold period on the preauthorized funds has ended without it being used.

            - `VALIDATED` – Indicates that the preauthorized funds were captured.

            - `FAILED` – The pay-in against the preauthorization has failed, but a retry may be possible.'
        PayinsLinked:
          $ref: '#/components/schemas/PayPalExtendedPreauthorizationResponsePayinsLinked'
          description: Information about the extended preauthorized pay-ins made against the extended preauthorization.
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        PaymentType:
          type: string
          description: '**Returned values:** `PAYPAL`


            The payment type of the preauthorization.'
        ExecutionType:
          type: string
          description: '**Returned values:** `WEB`


            The execution type of the preauthorization.'
        StatementDescriptor:
          $ref: '#/components/schemas/StatementDescriptor'
        Shipping:
          $ref: '#/components/schemas/Shipping_DefaultsBillingUser_Response'
        Tag:
          $ref: '#/components/schemas/Tag'
        ShippingPreference:
          type: string
          description: '**Returned values:** `SET_PROVIDED_ADDRESS`, `GET_FROM_FILE`, `NO_SHIPPING`


            Information about the shipping address behavior on the PayPal payment page:

            - `SET_PROVIDED_ADDRESS` - The `Shipping` parameter becomes required and its values are displayed to the end user, who is not able to modify them.

            - `GET_FROM_FILE` – The `Shipping` parameter is ignored and the end user can choose from registered addresses.

            - `NO_SHIPPING` – No shipping address section is displayed.'
        PaypalBuyerAccountEmail:
          type: string
          description: The email address registered on the PayPal account used to make the payment.
        Reference:
          type: string
          description: 'Max. length: 127 characters (truncated after)


            The platform''s order reference for the transaction.'
        CancelURL:
          type: string
          description: The URL to which the user is returned after canceling the payment. If not provided, the Cancel button returns the user to the `RedirectURL`.
        PaypalOrderID:
          type: string
          description: PayPal's unique identifier for the order.
        BuyerCountry:
          type: string
          description: The country of the buyer.
        BuyerFirstname:
          type: string
          description: The first name of the buyer.
        BuyerPhone:
          type: string
          description: The mobile phone number of the buyer.
        BuyerLastname:
          type: string
          description: The last name of the buyer.
        PaypalPayerID:
          type: string
          description: The PayPal identifier of the buyer.
        Trackings:
          type: array
          items:
            $ref: '#/components/schemas/PayPalExtendedPreauthorizationResponseTrackingsItems'
          description: Shipping information of the `LineItems` added to the pay-in object.
        LineItems:
          type: array
          items:
            $ref: '#/components/schemas/PayPalExtendedPreauthorizationResponseLineItemsItems'
          description: Information about the items purchased in the transaction. The total of all line items' `UnitAmount` and `TaxAmount` must equal the `DebitedFunds` amount (negative amounts not allowed).
        Culture:
          type: string
          description: '**Returned values:** One of the supported languages in the [ISO 639-1 format](/api-reference/overview/data-formats): AT, BR, CA, CH, CN, DE, DK, ES, FR, GB, ID, IL, IT, JK, JP, NL, NO, PL, PT, RU, SE, TH, TR, TW, US.


            The language in which the PayPal payment page is to be displayed.'
        Billing:
          description: Returned `null` because the billing address is not applicable to PayPal preauth.
        RedirectURL:
          type: string
          description: 'The URL to which to redirect the user to complete the payment.


            **Caution:** This variable URL is specific to each payment. You must rely on the returned URL in full (host, path, and queries) and not hardcode any part of it.'
        ReturnURL:
          $ref: '#/components/schemas/ReturnURL_255'
      description: Response if Extended Preauthorization's `PaymentType` is `PAYPAL`.
      title: PayPalExtendedPreauthorizationResponse
    RecurringPayPalPayInResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: RecurringPayPalPayInResponseFees
    Address:
      type: object
      properties:
        AddressLine1:
          type: string
          description: The first line of the address.
        AddressLine2:
          type: string
          description: The second line of the address.
        City:
          type: string
          description: The city of the address.
        Region:
          type: string
          description: Required if `Country` is US, CA, or MX. The region of the address.
        PostalCode:
          type: string
          description: 'The postal code of the address. The postal code can contain the following characters: alphanumeric, dashes, and spaces.'
        Country:
          type: string
          description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


            The country of the address.'
      description: The postal address.
      title: Address
    TransactionNature:
      type: string
      description: '**Returned values:** `REGULAR`, `REPUDIATION`, `REFUND`, `SETTLEMENT`


        The nature of the transaction, providing more information about the context in which the transaction occurred:

        - `REGULAR` – Relative to most of the transactions (pay-ins, payouts, and transfers) in a usual workflow.

        - `REPUDIATION` – Automatic withdrawal of funds from the platform''s repudiation wallet as part of the dispute process (when the user has requested a chargeback).

        - `REFUND` – Reimbursement of a transaction to the user (pay-in refund), to a wallet (transfer refund), or of a payout (payout refund, only initiated by Mangopay).

        - `SETTLEMENT` – Transfer made to the repudiation wallet by the platform to settle a lost dispute.'
      title: TransactionNature
    CreateAPayPalPreauthorizationRequestLineItemsItems:
      type: object
      properties:
        Name:
          type: string
          description: The name of the item.
        Quantity:
          type: integer
          description: The quantity of the item.
        UnitAmount:
          type: integer
          description: The cost of the item, excluding tax.
        TaxAmount:
          type: integer
          description: The tax amount applied to the item.
        Description:
          type: string
