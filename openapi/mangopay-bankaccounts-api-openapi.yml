    CreateAnIBANBankAccountRequest:
      type: object
      properties:
        OwnerAddress:
          $ref: '#/components/schemas/Address_PlatformHeadquarters'
        IBAN:
          type: string
          description: 'Max. length: 34 characters


            The IBAN (international bank account number) of the bank account. It follows the CCDDBBAN format in which: - CC represents the country code (ISO 3166-1 alpha 2) - DD represents two check digits used by banking systems to avoid simple errors - BBAN stands for the Basic Bank Account Number which is up to 30 alphanumeric characters that are country-specific. Note: You will need a valid IBAN (i.e., existing in real life) when testing on a Sandbox account even if no actual payout will be processed.'
        BIC:
          type: string
          description: 'The BIC (international identifier of the bank) for IBAN or OTHER-type bank accounts.


            The BIC can have one of the two following formats:

            - BIC8 – 8-character BIC (AAAABBCC)

            - BIC11 – 11-character BIC (AAAABBCCDDD)


            In which:

            - AAAA represents the bank code: 4 characters defining the bank

            - BB represents the country code: 2 characters forming the country ISO code (ISO 3166 format)

            - CC represents the location code: 2 localization characters (alphabetical or numeric) to distinguish banks from the same country

            - DDD represents the branch code: 3 characters used to define the branch of the bank (sometimes replaced with XXX)


            **Note:** On IBAN-type bank accounts, the full 11-character version (not using XXX) may be required for the BIC to be accepted as valid. Alternatively, this optional field can be omitted.'
        OwnerName:
          type: string
          description: 'Max. length: 255 characters


            The full name of the owner of the bank account. (Format: FirstName LastName)'
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - OwnerAddress
      - IBAN
      - OwnerName
      title: CreateAnIBANBankAccountRequest
