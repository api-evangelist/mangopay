openapi: 3.2.0
info:
  title: Reference Bank Accounts API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: bankAccounts
paths:
  /v2.01/{ClientId}/users/{UserId}/bankaccounts/iban:
    post:
      operationId: bankAccounts_create_iban_bank_account
      summary: Create an IBAN Bank Account
      description: '**Caution - Payouts refused to Bank Accounts created after April 30, 2026**


        Bank Account objects created after April 30, 2026, will not be usable for payouts. External accounts must be registered using the Recipient endpoints and authenticated using SCA.


        Payouts to Bank Accounts created after May 1, 2026, will fail with the `ResultCode` 121018. To resolve this, register the external account using POST Create a Recipient and retry the payout.


        **Note – Replaced by Recipients feature**


        The Bank Account object and endpoints have been replaced by the Recipients feature, which all platforms should integrate instead.


        Legacy active Bank Accounts (`Active` is `true`) have been migrated to the new feature and their data is retrievable via the GET View a Recipient endpoint using the same `BankAccountId`. Read more about legacy bank account migration.


        **Note – Only for countries that use IBAN**


        Only use the IBAN type for accounts registered in countries that use IBAN and aren''t GB, US, or CA (for which you should use the dedicated type).


        Create an IBAN Bank Account'
      tags:
      - bankAccounts
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the User (natural or legal) who owns the bank account.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IBANBankAccountResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIBANBankAccountRequest'
      security:
      - oauth2: []
