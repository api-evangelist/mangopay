  /v2.01/{ClientId}/users/{UserId}/bankaccounts/other:
    post:
      operationId: bankAccounts_create_other_bank_account
      summary: Create an OTHER Bank Account
      description: '**Caution - Payouts refused to Bank Accounts created after April 30, 2026**


        Bank Account objects created after April 30, 2026, will not be usable for payouts. External accounts must be registered using the Recipient endpoints and authenticated using SCA.


        Payouts to Bank Accounts created after May 1, 2026, will fail with the `ResultCode` 121018. To resolve this, register the external account using POST Create a Recipient and retry the payout.


        **Note – Replaced by Recipients feature**


        The Bank Account object and endpoints have been replaced by the Recipients feature, which all platforms should integrate instead.


        Legacy active Bank Accounts (`Active` is `true`) have been migrated to the new feature and their data is retrievable via the GET View a Recipient endpoint using the same `BankAccountId`. Read more about legacy bank account migration.


        **Note – Only for countries that don''t use IBAN**


        Only use the OTHER type if the account is registered in a country that doesn''t use IBAN and isn''t GB, US, or CA (for which you should use the dedicated type).


        **Note – Additional information may be required**


        OTHER-type bank accounts may require additional information depending on the country. Additional precisions per country (if applicable), are given below.


        For accounts registered in:

        * Australia – Provide the BIC in the `BIC` field. In the `IBAN` field, combine the 6-digit Bank State Branch (BSB) number and the account number.


        Create an OTHER Bank Account'
      tags:
      - bankAccounts
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
