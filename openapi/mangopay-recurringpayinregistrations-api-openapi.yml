openapi: 3.2.0
info:
  title: Reference Recurring Payin Registrations API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: recurringPayinRegistrations
paths:
  /v2.01/{ClientId}/recurringpayinregistrations:
    post:
      operationId: recurringPayinRegistrations_create_recurring_payin_registration
      summary: Create a Recurring PayIn Registration
      description: 'Register a series of recurring payment requests for the following payment methods (indicated by `PaymentType`):


        | PaymentType | Requires | Captured using |

        | --- | --- | --- |

        | `CARD_DIRECT` (default) | Tokenized `CardId` obtained from the card registration process. | Create a Recurring Card PayIn (CIT or MIT) |

        | `APPLEPAY` | Tokenized `PaymentData` object retrieved from the Apple Pay API. | Create a Recurring Apple Pay PayIn |

        | `GOOGLE_PAY` | Tokenized `PaymentData` string retrieved from the Google Pay API. | Create a Recurring Google Pay PayIn |

        | `PAYPAL` | No prerequisites. | Create a Recurring PayPal PayIn (CIT or MIT) |


        **Note – Only one registration per user on PayPal**


        On PayPal, only one recurring pay-in registration can be used per `UserId`. You can end a user''s existing registration object to create a new one with the same user.


        This restriction does not apply to other payment methods.'
      tags:
      - recurringPayinRegistrations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayInRegistrationResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateARecurringPayInRegistrationRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/recurringpayinregistrations/{RecurringPayinRegistrationId}:
    put:
      operationId: recurringPayinRegistrations_update_recurring_payin_registration
      summary: Update a Recurring PayIn Registration
      description: 'This call can be used to modify parameters in the following scenarios:

        - **Reauthentication** – Update the `CardId` (card) or `PaymentData` (Apple Pay and Google Pay) if re-authentication is necessary (indicated by the `Status` becoming `AUTHENTICATION_NEEDED`). This must be followed by a CIT pay-in request.

        - **User data change** – Update `Billing` or `Shipping` if required

        - **Recurrence ending** – Set the `Status` to `ENDED` if the recurring payments have finished or will no longer be used


        The existing registration''s `PaymentType` must match the request variant.'
      tags:
      - recurringPayinRegistrations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: RecurringPayinRegistrationId
        in: path
        description: The unique identifier of the recurring pay-in registration.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayInRegistrationResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateARecurringPayInRegistrationRequest'
      security:
      - oauth2: []
    get:
      operationId: recurringPayinRegistrations_view_recurring_payin_registration
      summary: View a Recurring PayIn Registration
      tags:
      - recurringPayinRegistrations
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: RecurringPayinRegistrationId
        in: path
        description: The unique identifier of the recurring pay-in registration.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecurringPayInRegistrationResponse'
      security:
      - oauth2: []
components:
  schemas:
    RecurringPayInRegistrationCardResponseCurrentStateCumulatedFeesAmount:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the cumulated fees amount.
      title: RecurringPayInRegistrationCardResponseCurrentStateCumulatedFeesAmount
    RecurringPayInRegistrationGooglePayResponseNextTransactionFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: The fees of the subsequent recurring pay-ins.
      title: RecurringPayInRegistrationGooglePayResponseNextTransactionFees
    RecurringPayInRegistrationCardResponseCurrentStateCumulatedDebitedAmount:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the cumulated debited funds amount.
      title: RecurringPayInRegistrationCardResponseCurrentStateCumulatedDebitedAmount
    RecurringPayInRegistrationApplePayResponseFirstTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: The amount of the first recurring pay-in.
      title: RecurringPayInRegistrationApplePayResponseFirstTransactionDebitedFunds
    RecurringPayInRegistrationPayPalResponseFirstTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: 'The amount of the first recurring pay-in.


        This value can be different from the `NextTransactionDebitedFunds`'
      title: RecurringPayInRegistrationPayPalResponseFirstTransactionDebitedFunds
    RecurringPayInRegistrationPayPalResponseCurrentState:
      type: object
      properties:
        PayinsLinked:
          type: integer
          description: The number of recurring pay-ins already made for the registration object.
        CumulatedDebitedAmount:
          $ref: '#/components/schemas/RecurringPayInRegistrationPayPalResponseCurrentStateCumulatedDebitedAmount'
          description: Information about the cumulated debited funds amount.
        CumulatedFeesAmount:
          $ref: '#/components/schemas/RecurringPayInRegistrationPayPalResponseCurrentStateCumulatedFeesAmount'
          description: Information about the cumulated fees amount.
        LastPayinId:
          type: string
          description: The unique identifier of the last recurring pay-in made for the registration.
      description: Information about the recurring pay-ins related to the registration object. **Note:** If the `LastPayinId` references a transaction older than 13 months, it may have been <a href="/api-reference/overview/data-availability-periods">archived</a>.
      title: RecurringPayInRegistrationPayPalResponseCurrentState
    RecurringPayInRegistrationGooglePayResponseFirstTransactionFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: The fees of the first recurring pay-in.
      title: RecurringPayInRegistrationGooglePayResponseFirstTransactionFees
    Address:
      type: object
      properties:
        AddressLine1:
          type: string
          description: The first line of the address.
        AddressLine2:
          type: string
          description: The second line of the address.
        City:
          type: string
          description: The city of the address.
        Region:
          type: string
          description: Required if `Country` is US, CA, or MX. The region of the address.
        PostalCode:
          type: string
          description: 'The postal code of the address. The postal code can contain the following characters: alphanumeric, dashes, and spaces.'
        Country:
          type: string
          description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


            The country of the address.'
      description: The postal address.
      title: Address
    UpdateARecurringPayInRegistrationRequest_GooglePay:
      type: object
      properties:
        Status:
          type: string
          description: '**Allowed values:** `ENDED`


            The status of the recurring registration:

            - `CREATED` – The recurring registration was created, but no recurring pay-in has yet been made.

            - `AUTHENTICATION_NEEDED` – The latest recurring pay-in linked to the registration object was refused. The registration object can still be used, but you need to execute a new customer-initiated transaction (CIT) for the end user to reauthenticate.

            - `IN_PROGRESS` – The recurring registration object is in use and the subsequent corresponding recurring pay-ins can be made.

            - `ENDED` – The recurrence ended: the registration can no longer be modified nor reused.'
        Shipping:
          $ref: '#/components/schemas/Shipping_DefaultsBillingUser_Request'
        Billing:
          $ref: '#/components/schemas/Billing_DefaultsShippingUser_Request'
        PaymentData:
          type: string
          description: The data returned by Google Pay containing information about the payment.
        PaymentType:
          type: string
          description: '**Allowed values:** `GOOGLE_PAY`


            The existing registration''s `PaymentType` must match the request variant.


            The type of recurring pay-in registration (which must correspond to the pay-ins requested against it):

            - `CARD_DIRECT` – Card payments using a tokenized `CardId`.

            - `APPLEPAY` – Apple Pay payments using the tokenized `PaymentData` object retrieved from the Apple Pay API.

            - `GOOGLE_PAY` – Google Pay payments using the tokenized `PaymentData` string retrieved from the Google Pay API.

            - `PAYPAL` – PayPal payments, redirecting the user to authenticate via PayPal.'
      description: 'Request body for updating a Google Pay recurring pay-in registration (`PaymentType` `GOOGLE_PAY`).


        The existing registration''s `PaymentType` must match the request variant. Updating the `PaymentData` requires re-authentication via a new CIT.'
      title: UpdateARecurringPayInRegistrationRequest_GooglePay
    RecurringPayInRegistrationCardResponseNextTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: 'The amount of the subsequent recurring pay-ins.


        If this field is empty and either `FixedNextAmount` or `FractionedPayment` are `true`, the subsequent amount will be the same as `FirstTransactionDebitedFunds` amount.'
      title: RecurringPayInRegistrationCardResponseNextTransactionDebitedFunds
    RecurringPayInRegistrationCardResponseCurrentState:
      type: object
      properties:
        PayinsLinked:
          type: integer
          description: The number of recurring pay-ins already made for the registration object.
        CumulatedDebitedAmount:
          $ref: '#/components/schemas/RecurringPayInRegistrationCardResponseCurrentStateCumulatedDebitedAmount'
          description: Information about the cumulated debited funds amount.
        CumulatedFeesAmount:
          $ref: '#/components/schemas/RecurringPayInRegistrationCardResponseCurrentStateCumulatedFeesAmount'
          description: Information about the cumulated fees amount.
        LastPayinId:
          type: string
          description: The unique identifier of the last recurring pay-in made for the registration.
      description: Information about the recurring pay-ins related to the registration object. **Note:** If the `LastPayinId` references a transaction older than 13 months, it may have been <a href="/api-reference/overview/data-availability-periods">archived</a>.
      title: RecurringPayInRegistrationCardResponseCurrentState
    CreateARecurringPayInRegistrationPayPalRequestFirstTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: The amount of the first recurring pay-in. This value can be different from the `NextTransactionDebitedFunds``.
      title: CreateARecurringPayInRegistrationPayPalRequestFirstTransactionDebitedFunds
    RecurringPayInRegistrationGooglePayResponseCurrentStateCumulatedDebitedAmount:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: The sum of the DebitedFunds amounts of the recurring pay-ins made for the registration.
      title: RecurringPayInRegistrationGooglePayResponseCurrentStateCumulatedDebitedAmount
    Id:
      type: string
      description: 'Max length: 128 characters (see [data formats](/api-reference/overview/data-formats) for details)


        The unique identifier of the object.'
      title: Id
    RecurringPayInRegistrationApplePayResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Status:
          type: string
          description: '**Returned values:** `CREATED`, `AUTHENTICATION_NEEDED`, `IN_PROGRESS`, `ENDED`


            The status of the recurring registration:

            - `CREATED` – The recurring registration was created, but no recurring pay-in has yet been made.

            - `AUTHENTICATION_NEEDED` – The latest recurring pay-in linked to the registration object was refused. The registration object can still be used, but you need to execute a new customer-initiated transaction (CIT) for the end user to reauthenticate.

            - `IN_PROGRESS` – The recurring registration object is in use and the subsequent corresponding recurring pay-ins can be made.

            - `ENDED` – The recurrence ended: the registration can no longer be modified nor reused.'
        CurrentState:
          $ref: '#/components/schemas/RecurringPayInRegistrationApplePayResponseCurrentState'
          description: 'Information about the recurring pay-ins related to the registration object.


            **Note:** If the LastPayinId references a transaction older than 13 months, it may have been archived.'
        RecurringType:
          type: string
        TotalAmount:
          $ref: '#/components/schemas/RecurringPayInRegistrationApplePayResponseTotalAmount'
        CycleNumber:
          type: integer
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        CreditedUserId:
          $ref: '#/components/schemas/CreditedUserId'
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorResponse'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        Billing:
          $ref: '#/components/schemas/Billing_DefaultsShippingUser_Response'
        Shipping:
          $ref: '#/components/schemas/Shipping_DefaultsBillingUser_Response'
        EndDate:
          type: integer
          description: 'The date and time at which the recurring pay-ins will end. This value has no impact on the recurring registration Status.


            **Caution:** If the EndDate is left unspecified, please bear in mind that one could be defined by default and be displayed to your end users (not taken into account in the payment recurrence).'
        Frequency:
          type: string
          description: '**Returned values:** `Daily`, `Weekly`, `TwiceAMonth`, `Monthly`, `Bimonthly`, `Quarterly`, `Semiannual`, `Annual`, `Biannual`


            The frequency at which the recurring pay-ins will occur:

            - `Daily` – 1 transaction per day.

            - `Weekly` – 1 transaction every 7 days.

            - `TwiceAMonth` – 2 transactions per month.

            - `Monthly` – 1 transaction per month.

            - `Bimonthly` – 1 transaction every 2 months.

            - `Quarterly` – 1 transaction every 3 months.

            - `Semiannual` – 1 transaction every 6 months.

            - `Annual` – 1 transaction per year.

            - `Biannual` – 1 transaction every 2 years.'
        FixedNextAmount:
          type: boolean
          description: Whether or not the recurring pay-ins' debited amounts remain the same for all the pay-ins linked to the recurring registration object.
        FractionedPayment:
          type: boolean
          description: Whether or not the recurring pay-ins are being made to split a payment in several installments.
        FreeCycles:
          type: integer
          description: 'The number of initial consecutive pay-ins where there will be no debited funds nor fees. This value cannot exceed the CycleNumber value (for recurring objects with an EndDate, FixedNextAmount, and Frequency).


            **Note:** When creating a recurring pay-in (CIT or MIT) for a pay-in subject to a free cycle, the DebitedFunds and Fees parameters cannot be sent.'
        FirstTransactionDebitedFunds:
          $ref: '#/components/schemas/RecurringPayInRegistrationApplePayResponseFirstTransactionDebitedFunds'
          description: The amount of the first recurring pay-in.
        FirstTransactionFees:
          $ref: '#/components/schemas/RecurringPayInRegistrationApplePayResponseFirstTransactionFees'
          description: The fees of the first recurring pay-in.
        NextTransactionDebitedFunds:
          $ref: '#/components/schemas/RecurringPayInRegistrationApplePayResponseNextTransactionDebitedFunds'
          description: The amount of the subsequent recurring pay-ins.
        NextTransactionFees:
          $ref: '#/components/schemas/RecurringPayInRegistrationApplePayResponseNextTransactionFees'
          description: The fees of the subsequent recurring pay-ins.
        Migration:
          type: boolean
        ProfilingAttemptReference:
          $ref: '#/components/schemas/ProfilingAttemptReference'
        PaymentType:
          type: string
          description: '**Returned values:** `APPLEPAY`


            The type of recurring pay-in registration (which must correspond to the pay-ins requested against it):

            - `CARD_DIRECT` – Card payments using a tokenized `CardId`.

            - `APPLEPAY` – Apple Pay payments using the tokenized `PaymentData` object retrieved from the Apple Pay API.

            - `GOOGLE_PAY` – Google Pay payments using the tokenized `PaymentData` string retrieved from the Google Pay API.

            - `PAYPAL` – PayPal payments, redirecting the user to authenticate via PayPal.'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        CardInfo:
          $ref: '#/components/schemas/CardInfo'
      description: Response object for Apple Pay recurring pay-in registrations.
      title: RecurringPayInRegistrationApplePayResponse
    RecurringPayInRegistrationApplePayResponseNextTransactionFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: The fees of the subsequent recurring pay-ins.
      title: RecurringPayInRegistrationApplePayResponseNextTransactionFees
    CreateARecurringPayInRegistrationCardRequestFirstTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: The amount of the first recurring pay-in. This value can be different from the `NextTransactionDebitedFunds``.
      title: CreateARecurringPayInRegistrationCardRequestFirstTransactionDebitedFunds
    CardInfo:
      type: object
      properties:
        BIN:
          type: string
          description: The bank identification number (BIN) of the card.
        IssuingBank:
          type: string
          description: The name of the bank that issued the card.
        IssuerCountryCode:
          type: string
          description: The country code of the card issuer.
        Type:
          type: string
          description: The type of card (for example, `CREDIT` or `DEBIT`).
        SubType:
          type:
          - string
          - 'null'
          description: The sub-type of the card, if available.
        Brand:
          type: string
          description: The card brand (for example, `VISA` or `MASTERCARD`).
      description: Information about the card used for the transaction. If the information or data is not available, `null` is returned.
      title: CardInfo
    RecurringPayInRegistrationApplePayResponseFirstTransactionFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: The fees of the first recurring pay-in.
      title: RecurringPayInRegistrationApplePayResponseFirstTransactionFees
    CreateARecurringPayInRegistrationCardRequest:
      type: object
      properties:
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        FlowDescriptor:
          $ref: '#/components/schemas/FlowDescriptorRequest'
        FirstTransactionDebitedFunds:
          $ref: '#/components/schemas/CreateARecurringPayInRegistrationCardRequestFirstTransactionDebitedFunds'
          description: The amount of the first recurring pay-in. This value can be different from the `NextTransactionDebitedFunds``.
        FirstTransactionFees:
          $ref: '#/components/schemas/CreateARecurringPayInRegistrationCardRequestFirstTransactionFees'
          description: The fees of the first recurring pay-in. This amount can be different from the `NextTransactionDebitedFunds`.
        Billing:
          $ref: '#/components/schemas/Billing_DefaultsShippingUser_Request'
        Shipping:
          $ref: '#/components/schemas/Shipping_DefaultsBillingUser_Request'
        NextTransactionDebitedFunds:
          $ref: '#/components/schemas/CreateARecurringPayInRegistrationCardRequestNextTransactionDebitedFunds'
          description: The amount of the subsequent recurring pay-ins. If this field is empty and either `FixedNextAmount` or `FractionedPayment` are true, the subsequent amount will be the same as `FirstTransactionDebitedFunds` amount.
        NextTransactionFees:
          $ref: '#/components/schemas/CreateARecurringPayInRegistrationCardRequestNextTransactionFees'
          description: The fees of the subsequent recurring pay-ins.
        ProfilingAttemptReference:
          $ref: '#/components/schemas/ProfilingAttemptReference'
        CardId:
          type: string
          description: The unique identifier of the Card object, obtained during the card registration process.
        EndDate:
          type: integer
          description: 'The date and time at which the recurring pay-ins will end. This value has no impact on the recurring registration `Status`.


            **Caution:** If the `EndDate` is left unspecified, please bear in mind that one could be defined by default and be displayed to your end users (not taken into account in the payment recurrence).'
        FixedNextAmount:
          type: boolean
          description: Whether or not the recurring pay-ins' debited amounts remain the same for all the pay-ins linked to the recurring registration object.
        Frequency:
          type: string
          description: '**Allowed values:** `Daily`, `Weekly`, `TwiceAMonth`, `Monthly`, `Bimonthly`, `Quarterly`, `Semiannual`, `Annual`, `Biannual`


            The frequency at which the recurring pay-ins will occur:

            - `Daily` – 1 transaction per day.

            - `Weekly` – 1 transaction every 7 days.

            - `TwiceAMonth` – 2 transactions per month.

            - `Monthly` – 1 transaction per month.

            - `Bimonthly` – 1 transaction every 2 months.

            - `Quarterly` – 1 transaction every 3 months.

            - `Semiannual` – 1 transaction every 6 months.

            - `Annual` – 1 transaction per year.

            - `Biannual` – 1 transaction every 2 years.'
        FractionedPayment:
          type: boolean
          description: Whether or not the recurring pay-ins are being made to split a payment in several installments.
        FreeCycles:
          type: integer
          description: 'The number of initial consecutive pay-ins where there will be no debited funds nor fees. This value cannot exceed the `CycleNumber` value (for recurring objects with an `EndDate`, `FixedNextAmount`, and `Frequency`).


            **Note:** When creating a recurring pay-in (CIT or MIT) for a pay-in subject to a free cycle, the `DebitedFunds` and `Fees` parameters cannot be sent.'
        Migration:
          type: boolean
          description: 'Whether or not to attempt the first recurring pay-in as a merchant-initiated transaction (MIT).


            **Caution:** Migration is no longer supported. You can only use objects with `Migration` set to `false`. When Mangopay decommissions this parameter (date communicated by email), the `false` value will be forced on all objects, including existing ones. Before decommissioning, you need to re-create the object; after decommissioning, you can re-authenticate the same object.


            The need to re-authenticate may be indicated by the `Status` changing to `AUTHENTICATION_NEEDED` or by errors on the pay-in request, for example: non-existent card account (<a href="/errors/codes/008008">008008</a>), soft decline (<a href="/errors/codes/101305">101305</a>), expired card (<a href="/errors/codes/101105">101105</a>), or stolen card (<a href="/errors/codes/008003">008003</a>).'
        PaymentType:
          type: string
          description: '**Allowed values:** `CARD_DIRECT`


            **Default value:** `CARD_DIRECT`


            Optional on create. If omitted, defaults to `CARD_DIRECT`.


            The type of recurring pay-in registration (which must correspond to the pay-ins requested against it):

            - `CARD_DIRECT` – Card payments using a tokenized `CardId`.'
      required:
      - AuthorId
      - CreditedWalletId
      - FirstTransactionDebitedFunds
      - FirstTransactionFees
      - CardId
      description: Request body for card recurring pay-in registrations, using a tokenized `CardId`.
      title: CreateARecurringPayInRegistrationCardRequest
    RecurringPayInRegistrationCardResponseFirstTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: 'The amount of the first recurring pay-in.


        This value can be different from the `NextTransactionDebitedFunds`'
      title: RecurringPayInRegistrationCardResponseFirstTransactionDebitedFunds
    CreateARecurringPayInRegistrationGooglePayRequestFirstTransactionDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: The amount of the first recurring pay-in. This value can be different from the `NextTransactionDebitedFunds``.
      title: CreateARecurringPayInRegistrationGooglePayRequestFirstTransactionDebitedFunds
    RecurringPayInRegistrationGooglePayResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Status:
          type: string
          description: '**Returned values:** `CREATED`, `AUTHENTICATION_NEEDED`, `IN_PROGRESS`, `ENDED`


            The status of the recurring registration:

            - `CREATED` – The recurring registration was created, but no recurring pay-in has yet been made.

            - `AUTHENTICATION_NEEDED` – The latest recurring pay-in linked to the registration object was refused. The registration object can still be used, but you need to execute a new customer-initiated transaction (CIT) for the end user to reauthenticate.

            - `IN_PROGRESS` – The recurring registration object is in use and the subsequent corresponding recurring pay-ins can be made.

            - `ENDED` – The recurrence ended: the registration can no longer be modified nor reused.'
        CurrentState:
          $ref: '#/components/schemas/RecurringPayInRegistrationGooglePayResponseCurrentState'
          description: 'Information about the recurring pay-ins related to the registration object.


            **Note:** If the LastPayinId references a transaction older than 13 months, it may have been archived.'
        RecurringType:
          type: string
        TotalAmount:
          $ref: '#/components/schemas/RecurringPayInRegistrationGooglePayResponseTotalAmount'
        CycleNumber:
