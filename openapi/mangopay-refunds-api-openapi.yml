openapi: 3.2.0
info:
  title: Reference Refunds API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Refunds
paths:
  /v2.01/{ClientId}/payins/{PayInId}/refunds:
    post:
      operationId: refunds_create_refund_payin
      summary: Create a Refund for a PayIn
      description: 'The pay-in refund is a request to reimburse a pay-in and is supported for most payment methods. You can make partial refunds by providing a debited funds `Amount` value lower than the initial transaction amount.


        **Note – Conditions for pay-in refund**


        * The amount value is 1 or above, regardless of the currency.

        * The initial transaction status is `SUCCEEDED`.

        * The initial transaction hasn''t been disputed.

        * The initial transaction was made within the time window specified for the payment method.


        Read more about pay-in refunds **→**'
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayInId
        in: path
        description: The unique identifier of the pay-in.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayInRefundResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateARefundForAPayInRequest'
      security:
      - oauth2: []
    get:
      operationId: refunds_list_refunds_payin
      summary: List Refunds for a PayIn
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayInId
        in: path
        description: The unique identifier of the pay-in.
        required: true
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: ResultCode
        in: query
        description: The code indicating the result of the operation. You can filter on multiple values by separating them with a comma.
        required: false
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the transaction was created (based on the transaction's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the transaction was created (based on the transaction's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRefundsForAPayInResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/transfers/{TransferId}/refunds:
    post:
      operationId: refunds_create_refund_transfer
      summary: Create a Refund for a Transfer
      description: 'You can do a partial refund by providing a debited funds `Amount` value lower than the initial transaction amount. The debited funds amount must be 1 or more, if it is included.


        Read more about transfer refunds **→**'
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: TransferId
        in: path
        description: The unique identifier of the transfer.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRefundResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateARefundForATransferRequest'
      security:
      - oauth2: []
    get:
      operationId: refunds_list_refunds_transfer
      summary: List Refunds for a Transfer
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: TransferId
        in: path
        description: The unique identifier of the transfer.
        required: true
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: ResultCode
        in: query
        description: The code indicating the result of the operation. You can filter on multiple values by separating them with a comma.
        required: false
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the transaction was created (based on the transaction's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the transaction was created (based on the transaction's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRefundsForATransferResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/refunds/{RefundId}:
    get:
      operationId: refunds_view_refund
      summary: View a Refund
      description: '**Note – Refund data retained for 13 months**


        The API retains all transaction objects for 13 months from `CreationDate`. This applies to refunds and the initial transaction linked to a refund.


        A call to retrieve the initial transaction of a refund, based on the refund''s `InitialTransactionId`, may return a 404 Not Found if it occurred more than 13 months ago.


        For more information, see the Data availability periods article.'
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: RefundId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewARefundResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payouts/{PayoutId}/refunds:
    get:
      operationId: refunds_list_refunds_payout
      summary: List Refunds for a Payout
      description: 'List Refunds for a Payout


        This call returns the refund for a payout, which is known as a **payout return** or return of funds.


        A payout return is only generated by Mangopay. For more information, see the payout returns guide.'
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayoutId
        in: path
        description: The unique identifier of the payout.
        required: true
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: ResultCode
        in: query
        description: The code indicating the result of the operation. You can filter on multiple values by separating them with a comma.
        required: false
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the transaction was created (based on the transaction's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the transaction was created (based on the transaction's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRefundsForAPayoutResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/repudiations/{RepudiationId}/refunds:
    get:
      operationId: refunds_list_refunds_repudiation
      summary: List Refunds for a Repudiation
      description: 'List Refunds for a Repudiation


        Repudiations are refunded when a dispute is won.'
      tags:
      - Refunds
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: RepudiationId
        in: path
        description: The unique identifier of the repudiation.
        required: true
        schema:
          type: string
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `SUCCEEDED`, `FAILED`


          The status of the transaction. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: ResultCode
        in: query
        description: The code indicating the result of the operation. You can filter on multiple values by separating them with a comma.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRefundsForARepudiationResponse'
      security:
      - oauth2: []
components:
  schemas:
    PayoutRefundResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the initial transaction.
        CreditedUserId:
          $ref: '#/components/schemas/CreditedUserId'
        DebitedFunds:
          $ref: '#/components/schemas/PayoutRefundResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/PayoutRefundResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/PayoutRefundResponseFees'
          description: Information about the fees.
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          type: string
          description: '**Returned values:** `PAYIN`


            The type of the transaction. Payout returns are recorded as pay-ins crediting the wallet from which the payout was sent.'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        InitialTransactionId:
          type: string
          description: The unique identifier of the initial payout being refunded.
        InitialTransactionType:
          type: string
          description: '**Returned values:** `PAYOUT`


            The type of the initial transaction being refunded.'
        InitialTransactionNature:
          type: string
          description: '**Returned values:** `REGULAR`


            The nature of the initial transaction being refunded.'
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet. Not returned for payout returns.
        CreditedWalletId:
          type: string
          description: The unique identifier of the wallet re-credited with the returned funds.
        RefundReason:
          $ref: '#/components/schemas/PayoutRefundResponseRefundReason'
          description: Information about the reasons for the payout return.
        StatementDescriptor:
          type: string
          description: 'Max. length: 10 characters; only alphanumeric and spaces


            Custom description to appear on the user''s bank statement along with the platform name. Different banks may show more or less information. See the <a href="/bank-statements">Customizing bank statement references</a> article for details.


            **Note:** On refunds, the `StatementDescriptor` is only available for SEPA and BACS [direct debit pay-ins](/api-reference/direct-debit-payins/create-direct-debit-payin) (no other payment methods nor transfers).'
      description: A payout return — a refund of a payout, initiated automatically by Mangopay when funds cannot be delivered to the recipient bank account.
      title: PayoutRefundResponse
    RepudiationRefundResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: RepudiationRefundResponseFees
    RepudiationRefundResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: RepudiationRefundResponseDebitedFunds
    ListRefundsForARepudiationResponse:
      type: object
      properties:
        Array (Refunds):
          type: array
          items:
            $ref: '#/components/schemas/ListRefundsForARepudiationResponseArrayRefundsItems'
          description: The list of refunds created by the platform.
      title: ListRefundsForARepudiationResponse
    TransferRefundResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: TransferRefundResponseCreditedFunds
    PayInRefundResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the initial transaction.
        CreditedUserId:
          $ref: '#/components/schemas/CreditedUserId'
        DebitedFunds:
          $ref: '#/components/schemas/PayInRefundResponseDebitedFunds'
          description: '**Default value:** The amount and currency values of the `DebitedFunds` of the initial transaction.


            Required if the `Fees` property is sent.


            Information about the debited funds. The refund `DebitedFunds.Amount`:


            - Takes by default the amount and currency of the initial transaction.

            - Must be set manually to perform a partial refund.

            - Cannot exceed the initial transaction `CreditedFunds.Amount` when set manually. This also applies to the sum of debited funds when making multiple partial refunds.'
        CreditedFunds:
          $ref: '#/components/schemas/PayInRefundResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/PayInRefundResponseFees'
          description: '**Default value:** The currency and amount (preceded by a minus sign) of the `Fees` of the initial transaction.


            Required if the `DebitedFunds` property is sent.


            Information about the fees. The refund `Fees.Amount`:

            - Must be preceded by a minus sign (-) to refund the fees, otherwise a positive value takes more fees.

            - Takes by default (when not set) the `Fees.Amount` of the initial transaction (preceded by a minus sign).

            - Cannot exceed the initial transaction `Fees.Amount`. This alsoapplies to the sum of amounts when making multiple partial refunds.'
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        InitialTransactionId:
          type: string
          description: The unique identifier of the initial transaction being refunded.
        InitialTransactionType:
          type: string
          description: '**Returned values:** `PAYIN`, `TRANSFER`, `PAYOUT`


            The type of the initial transaction being refunded.'
        InitialTransactionNature:
          type: string
          description: '**Returned values:** `REGULAR`, `REPUDIATION`, `REFUND`, `SETTLEMENT`


            The nature of the initial transaction being refunded, providing more information about the context in which the transaction occurred:

            - REGULAR – Relative to most of the transactions (pay-ins, payouts, and transfers) in a usual workflow.

            - REPUDIATION – Automatic withdrawal of funds from the platform''s repudiation wallet as part of the dispute process (when the user requested a chargeback).

            - REFUND – Reimbursement of a transaction to the user (pay-in refund), to a wallet (transfer refund), or of a payout (payout refund, only initiated by Mangopay).

            - SETTLEMENT – Transfer made to the repudiation wallet by the platform to settle the credit from a repudiation following a lost dispute.'
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet.
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet.
        RefundReason:
          $ref: '#/components/schemas/PayInRefundResponseRefundReason'
          description: Information about the reasons for the refund.
        StatementDescriptor:
          type: string
          description: 'Max. length: 10 characters; only alphanumeric and spaces


            Custom description to appear on the user''s bank statement along with the platform name. On refunds, the `StatementDescriptor` is only available when refunding SEPA and BACS [direct debit pay-ins](/api-reference/direct-debit-payins/create-direct-debit-payin) (no other payment methods nor transfers).


            Different banks may show more or less information. See the <a href="/bank-statements">Customizing bank statement references</a> article for details. '
      title: PayInRefundResponse
    PayInRefundResponseRefundReason:
      type: object
      properties:
        RefundReasonMessage:
          type: string
          description: Message explaining the reason for the refusal.
        RefundReasonType:
          type: string
          description: '**Returned values:** `INITIALIZED_BY_CLIENT`, `BANKACCOUNT_INCORRECT`, `OWNER_DO_NOT_MATCH_BANKACCOUNT`, `BANKACCOUNT_HAS_BEEN_CLOSED`, `WITHDRAWAL_IMPOSSIBLE_ON_SAVINGS_ACCOUNTS`, `OTHER`


            The type of reason for the refund.'
      description: Information about the reasons for the refund.
      title: PayInRefundResponseRefundReason
    Amount:
      type: integer
      description: The amount of the currency in its minor unit. For example, EUR 12.60 would be represented as `1260` whereas JPY 12 would be represented as just `12`.
      title: Amount
    ListRefundsForATransferResponse:
      type: object
      properties:
        Array (Refunds):
          type: array
          items:
            $ref: '#/components/schemas/ListRefundsForATransferResponseArrayRefundsItems'
          description: The list of refunds created by the platform.
      title: ListRefundsForATransferResponse
    CreateARefundForAPayInRequestDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: '**Default value:** The amount and currency values of the `DebitedFunds` of the initial transaction.


        Required if the `Fees` property is sent.


        Information about the debited funds. The refund `DebitedFunds.Amount`:


        - Takes by default the amount and currency of the initial transaction.

        - Must be set manually to perform a partial refund.

        - Cannot exceed the initial transaction `CreditedFunds.Amount` when set manually. This also applies to the sum of debited funds when making multiple partial refunds.'
      title: CreateARefundForAPayInRequestDebitedFunds
    PayoutRefundResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: PayoutRefundResponseDebitedFunds
    PayoutRefundResponseRefundReason:
      type: object
      properties:
        RefundReasonMessage:
          type: string
          description: Message explaining the reason for the refusal (for example, a bank return code).
        RefundReasonType:
          type: string
          description: '**Returned values:** `INITIALIZED_BY_CLIENT`, `BANKACCOUNT_INCORRECT`, `OWNER_DO_NOT_MATCH_BANKACCOUNT`, `BANKACCOUNT_HAS_BEEN_CLOSED`, `WITHDRAWAL_IMPOSSIBLE_ON_SAVINGS_ACCOUNTS`, `OTHER`


            The type of reason for the payout return.'
      description: Information about the reasons for the payout return.
      title: PayoutRefundResponseRefundReason
    PayInRefundResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: '**Default value:** The currency and amount (preceded by a minus sign) of the `Fees` of the initial transaction.


        Required if the `DebitedFunds` property is sent.


        Information about the fees. The refund `Fees.Amount`:

        - Must be preceded by a minus sign (-) to refund the fees, otherwise a positive value takes more fees.

        - Takes by default (when not set) the `Fees.Amount` of the initial transaction (preceded by a minus sign).

        - Cannot exceed the initial transaction `Fees.Amount`. This alsoapplies to the sum of amounts when making multiple partial refunds.'
      title: PayInRefundResponseFees
    TransactionExecutionDate:
      type: integer
      description: Unix timestamp (UTC) of the date and time the status changed to `SUCCEEDED`, indicating that the transaction occurred. The statuses `CREATED` and `FAILED` return an `ExecutionDate` of `null`.
      title: TransactionExecutionDate
    RepudiationRefundResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          type: string
          description: The unique identifier of the user at the source of the initial transaction.
        CreditedUserId:
          $ref: '#/components/schemas/CreditedUserId'
        DebitedFunds:
          $ref: '#/components/schemas/RepudiationRefundResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/RepudiationRefundResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/RepudiationRefundResponseFees'
          description: Information about the fees.
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          type: string
          description: '**Returned values:** `PAYIN`


            The type of the transaction. Repudiation returns are recorded as pay-ins crediting the Repudiation Wallet.'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        InitialTransactionId:
          type: string
          description: The unique identifier of the initial repudiation being refunded.
        InitialTransactionType:
          type: string
          description: '**Returned values:** `PAYOUT`


            The type of the initial transaction being refunded.'
        InitialTransactionNature:
          type: string
          description: '**Returned values:** `REPUDIATION`


            The nature of the initial transaction being refunded.'
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet. Not returned for repudiation returns.
        CreditedWalletId:
          type: string
          description: The unique identifier of the Repudiation Wallet re-credited with the returned funds (for example, `CREDIT_EUR`).
        RefundReason:
          $ref: '#/components/schemas/RepudiationRefundResponseRefundReason'
          description: Information about the reasons for the repudiation return.
        StatementDescriptor:
          type: string
          description: 'Max. length: 10 characters; only alphanumeric and spaces


            Custom description to appear on the user''s bank statement along with the platform name. Different banks may show more or less information. See the <a href="/bank-statements">Customizing bank statement references</a> article for details.


            **Note:** On refunds, the `StatementDescriptor` is only available for SEPA and BACS [direct debit pay-ins](/api-reference/direct-debit-payins/create-direct-debit-payin) (no other payment methods nor transfers).'
      description: A repudiation return — a refund created automatically by Mangopay when a dispute is won in favor of the platform, re-crediting the Repudiation Wallet.
      title: RepudiationRefundResponse
    TransferRefundResponseDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the debited funds.
      title: TransferRefundResponseDebitedFunds
    CreateARefundForATransferRequestDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: Information about the debited funds.
      title: CreateARefundForATransferRequestDebitedFunds
    ListRefundsForAPayoutResponseArrayRefundsItems:
      type: object
