        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: '**Default value:** The currency and amount (preceded by a minus sign) of the `Fees` of the initial transaction.


        Required if the `DebitedFunds` property is sent.


        Information about the fees. The refund `Fees.Amount`:

        - Must be preceded by a minus sign (-) to refund the fees, otherwise a positive value takes more fees.

        - Takes by default (when not set) the `Fees.Amount` of the initial transaction (preceded by a minus sign).

        - Cannot exceed the initial transaction `Fees.Amount`. This alsoapplies to the sum of amounts when making multiple partial refunds.'
      title: CreateARefundForAPayInRequestFees
