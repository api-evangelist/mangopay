openapi: 3.2.0
info:
  title: Reference Payouts API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Payouts
paths:
  /v2.01/{ClientId}/payouts/bankwire:
    post:
      operationId: payouts_create_payout
      summary: Create a Payout
      description: 'Initiate a payout request from a user''s wallet to a Recipient


        **Note – Local Recipients can only receive local currencies**


        Attempting a payout to a newly created local Recipient (with the `PayoutMethodType` of `LocalBankTransfer`) in a non-local currency may return an HTTP 400 error because the Recipient''s Country doesn''t correspond to the currency sent (for example, a USD payout sent to local SEPA Recipient).


        To receive non-local currencies, create a new Recipient with `PayoutMethodType` of `InternationalBankTransfer` and retry the payout. Mangopay automatically optimizes the payout route, so if a local currency is sent to an international Recipient, the domestic rail is used.


        Read more about how Mangopay routes funds **→**


        **Note – `PayoutModeRequested` property only relevant for EUR**


        The `PayoutModeRequested` property is only relevant for EUR payouts, where the value determines which of the SEPA schemes (SCT, SCT Inst, or T2) is used.


        For other currencies, Mangopay automatically uses the relevant local scheme (e.g. FPS for GBP) if the Recipient''s destination country corresponds, or otherwise uses SWIFT. Read more **→**


        If your platform offers User-Owned Accounts (Virtual Account or Banking Alias) to your end users, Verification of Payee (VOP) may impact their payouts. There is no impact for platforms not offering User-Owned Accounts. Read more **→**'
      tags:
      - Payouts
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatePayoutResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPayoutRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payouts/bankwire/{PayoutId}:
    get:
      operationId: payouts_view_payout_check_mode_applied
      summary: View a Payout and check mode applied
      description: 'Retrieve the full details of a payout request. First-time integrators should used this endpoint.


        In addition to the data returned by the legacy GET View a Payout endpoint, this endpoint also returns information about:

        - `ModeApplied` – Relevant for platforms using SEPA Inst or RTGS for SEPA T2

        - `ModeRequested` and `FallbackReason` – Additionally relevant for platforms using SEPA Inst

        - `ChargeBearer` – Relevant for platforms using OUR fee allocation on SWIFT non-domestic payouts


        **Note – Payout data retained for 13 months**


        An API call to retrieve a payout whose `CreationDate` is older than 13 months may return 404 Not Found.


        For more information, see the Data availability periods article.'
      tags:
      - Payouts
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayoutId
        in: path
        description: The unique identifier of the payout.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutWithModeAppliedResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payouts/{PayoutId}:
    get:
      operationId: payouts_view_payout
      summary: View a Payout
      description: 'This endpoint returns basic information about a payout request, without some feature-specific details. Platforms integrating for the first time should use the GET View a Payout and check mode applied endpoint.


        **Note – Payout data retained for 13 months**


        An API call to retrieve a payout whose `CreationDate` is older than 13 months may return 404 Not Found.


        For more information, see the Data availability periods article.'
      tags:
      - Payouts
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayoutId
        in: path
        description: The unique identifier of the payout.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutWithoutModeAppliedResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/payouts/reachability:
    post:
      operationId: payouts_check_instant_payout_eligibility
      summary: Check Instant Payout eligibility
      description: 'Check whether the destination bank is reachable for SCT Inst payouts.


        **Note – Endpoint only available for SCT Inst payouts in EUR**


        You can only use this endpoint to check payouts where:

        - The currency is `EUR`

        - The `PayoutModeRequested` is `INSTANT_PAYMENT`


        All other currencies return the 130001 `UnreachableReason.Code`.'
      tags:
      - Payouts
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstantPayoutEligibilityResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckInstantPayoutEligibilityRequest'
      security:
      - oauth2: []
components:
  schemas:
    PayoutWithModeAppliedResponseFallbackReason:
      type: object
      properties:
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
      description: Information regarding the reason for the refusal of the instant payout request.
      title: PayoutWithModeAppliedResponseFallbackReason
    CheckInstantPayoutEligibilityRequest:
      type: object
      properties:
        PayoutModeRequested:
          type: string
          description: '**Allowed values:** `INSTANT_PAYMENT`


            The mode of payout, which must be `INSTANT_PAYMENT` on this reachability endpoint, even if your subsequent payout request uses `INSTANT_PAYMENT_ONLY`.'
        AuthorId:
          type: string
          description: 'The unique identifier of the user at the source of the transaction.


            **Best practice:** When the payout author is different from the bank account owner, the Payout `AuthorId` value must be different from the Recipient `UserId` value as well. Otherwise, Mangopay''s Compliance team will reject the payout.'
        DebitedFunds:
          $ref: '#/components/schemas/CheckInstantPayoutEligibilityRequestDebitedFunds'
          description: Information about the debited funds.
        Fees:
          $ref: '#/components/schemas/CheckInstantPayoutEligibilityRequestFees'
          description: Information about the fees.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet.
        BankAccountId:
          type: string
          description: The unique identifier of the Bank Account. This property should **not** be used by platforms integrating for the first time – send the `RecipientId` instead.
        BankWireRef:
          type: string
          description: 'Max. length: 255 characters (< 12 recommended)


            Custom description to appear on the user''s bank statement along with the platform name. The recommended length is 12 characters – strings longer than this may be truncated depending on the bank. For the full structure of the string, see the <a href="/bank-statements">Customizing bank statement references</a> article.'
      required:
      - PayoutModeRequested
      - AuthorId
      - DebitedFunds
      - Fees
      - DebitedWalletId
      title: CheckInstantPayoutEligibilityRequest
    PayoutWithModeAppliedResponseCreditedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
      title: PayoutWithModeAppliedResponseCreditedFunds
    Amount:
      type: integer
      description: The amount of the currency in its minor unit. For example, EUR 12.60 would be represented as `1260` whereas JPY 12 would be represented as just `12`.
      title: Amount
    CreatePayoutResponseFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      description: Information about the fees.
      title: CreatePayoutResponseFees
    PayoutWithModeAppliedResponsePaymentRef:
      type: object
      properties:
        ReasonType:
          type: string
          description: "**Allowed values:** `PAYIN_REFUND` \n\nThe reason for the reference being provided:\n- `PAYIN_REFUND` – The payout serves to reimburse a pay-in."
        ReferenceId:
          type: string
          description: '**Allowed values:** The valid `Id` of a successful pay-in.


            The unique identifier associated with the reference, whose value corresponds to the `ReasonType`:

            - `PAYIN_REFUND` – The `ReferenceId` value provided is the same as the `Id` of the initial pay-in being refunded.'
      description: "Information about the payment reference provided for the payout. \n\nThis object must be used to provide the reference of a [bank wire pay-in](/api-reference/bank-wire-payins/bank-wire-payin-object) or a [pay-in to virtual IBAN](/api-reference/virtual-accounts/external-instruction-bank-wire-payin-object), if the payout is being used to refund it."
      title: PayoutWithModeAppliedResponsePaymentRef
    RecipientVerificationOfPayeePayout:
      type: object
      properties:
        RecipientVerificationId:
          $ref: '#/components/schemas/RecipientVerificationId'
        RecipientVerificationCheck:
          $ref: '#/components/schemas/RecipientVerificationCheck'
        RecipientVerificationMessage:
          $ref: '#/components/schemas/RecipientVerificationMessage'
      description: 'Information about the [Verification of Payee (VOP)](/guides/vop) check

        performed on the Recipient as part of a Payout request. Because VOP only

        applies to SEPA local schemes, this object is returned `null` if the

        Recipient''s `Currency` is not `EUR` or its `PayoutMethodType` is not

        `LocalBankTransfer`.


        Unlike [Recipient](/api-reference/recipients/recipient-object) endpoints,

        `RecipientVerificationPayeeSuggestedName` is not returned on Payout

        responses, even if the result is `CLOSE_MATCH`.'
      title: RecipientVerificationOfPayeePayout
    CreateAPayoutRequest:
      type: object
      properties:
        AuthorId:
          type: string
          description: 'The unique identifier of the user at the source of the transaction.


            **Best practice:** When the payout author is different from the bank account owner, the Payout `AuthorId` value must be different from the Recipient `UserId` value as well. Otherwise, Mangopay''s Compliance team will reject the payout.'
        DebitedFunds:
          $ref: '#/components/schemas/CreateAPayoutRequestDebitedFunds'
          description: Information about the debited funds.
        Fees:
          $ref: '#/components/schemas/CreateAPayoutRequestFees'
          description: Information about the fees.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet.
        RecipientId:
          type: string
          description: The unique identifier of the [Recipient](/api-reference/recipients/recipient-object) object to which the payout is being requested. This property should be used by platforms integrating for the first time (and not the `BankAccountId`).
        BankAccountId:
          type: string
          description: The unique identifier of the Bank Account. This property should **not** be used by platforms integrating for the first time – send the `RecipientId` instead.
        Tag:
          $ref: '#/components/schemas/Tag'
        BankWireRef:
          type: string
          description: "Max. length: 255 characters (< 12 recommended)\n\nCustom description to appear on the user's bank statement along with the platform name. The recommended length is 12 characters – strings longer than this may be truncated depending on the bank. \n\nFor the full structure of the string, see the <a href=\"/bank-statements\">Customizing bank statement references</a> article."
        PayoutModeRequested:
          type: string
          description: '**Possible values:** `STANDARD`, `INSTANT_PAYMENT`, `INSTANT_PAYMENT_ONLY`, `RTGS_PAYMENT`


            **Default value:** `STANDARD`


            The mode defining how the payout request is sent:

            - `STANDARD` – **Non-EUR:** Sent via the relevant local rail if the Recipient''s destination country corresponds, or otherwise sent via SWIFT. Mangopay automatically routes funds via the [available rails](/guides/payouts#all-rails-by-currency), which also determines [delivery times](/guides/payouts#delivery-times). Requests received after the applicable cutoff are processed the next working day. **EUR:** Sent via the SEPA Credit Transfer scheme or SWIFT (if non-domestic).

            - `INSTANT_PAYMENT` – **EUR only:** Sent via the SEPA Instant Credit Transfer scheme (funds processed within 10 seconds) with a fallback to `STANDARD` mode if any of the prerequisites are not met or if another issue occurs. If the payout is above the threshold agreed with Mangopay, the payout fails and there is no fallback.

            - `INSTANT_PAYMENT_ONLY` – **EUR only:** sent via the SEPA Instant Credit Transfer scheme (funds processed within 10 seconds) without a fallback. If an issue occurs, the wallet automatically refunded.

            - `RTGS_PAYMENT` – **EUR only:** sent via the Eurozone''s [real-time gross settlement (RGTS)](/guides/payouts#real-time-gross-settlement-rtgs) scheme T2 (funds processed same working day) without a fallback. If the request is received after the applicable cutoff (16:15 CET), it is processed the next working day (from 07:00 CET).'
        PaymentRef:
          oneOf:
          - $ref: '#/components/schemas/CreateAPayoutRequestPaymentRef'
          - type: 'null'
          description: "Information about the payment reference provided for the payout. \n\nThis object must be used to provide the reference of a [bank wire pay-in](/api-reference/bank-wire-payins/bank-wire-payin-object) or a [pay-in to virtual IBAN](/api-reference/virtual-accounts/external-instruction-bank-wire-payin-object), if the payout is being used to refund it."
        ChargeBearer:
          type: string
          description: 'Possible values: `SHA`, `OUR`


            Default value: `SHA`


            The allocation of [processing fees](/guides/payouts#fees-for-international-payouts) for an international SWIFT payout:

            - `SHA` - Fees are shared between the remitter and beneficiary. The beneficiary''s share is deducted from the payout, meaning that the amount arriving on the recipient''s bank account may be less than the Payout''s `CreditedFunds.Amount`.

            - `OUR` - All fees are paid by the remitter. The recipient receives the full `CreditedFunds.Amount` of the Payout, and Mangopay recovers the fees from the platform during the billing cycle. A 400 HTTP error is returned if Mangopay''s network of partners does not support `OUR` fees for the given currency and recipient country, or if this feature is not activated.


            For non-SWIFT requests, the `ChargeBearer` is ignored and `SHA` or `null` is displayed by default in the response.'
      required:
      - AuthorId
      - DebitedFunds
      - Fees
      - DebitedWalletId
      title: CreateAPayoutRequest
    CreatePayoutResponsePaymentRef:
      type: object
      properties:
        ReasonType:
          type: string
          description: "**Allowed values:** `PAYIN_REFUND` \n\nThe reason for the reference being provided:\n- `PAYIN_REFUND` – The payout serves to reimburse a pay-in."
        ReferenceId:
          type: string
          description: '**Allowed values:** The valid `Id` of a successful pay-in.


            The unique identifier associated with the reference, whose value corresponds to the `ReasonType`:

            - `PAYIN_REFUND` – The `ReferenceId` value provided is the same as the `Id` of the initial pay-in being refunded.'
      description: "Information about the payment reference provided for the payout. \n\nThis object must be used to provide the reference of a [bank wire pay-in](/api-reference/bank-wire-payins/bank-wire-payin-object) or a [pay-in to virtual IBAN](/api-reference/virtual-accounts/external-instruction-bank-wire-payin-object), if the payout is being used to refund it."
      title: CreatePayoutResponsePaymentRef
    TransactionExecutionDate:
      type: integer
      description: Unix timestamp (UTC) of the date and time the status changed to `SUCCEEDED`, indicating that the transaction occurred. The statuses `CREATED` and `FAILED` return an `ExecutionDate` of `null`.
      title: TransactionExecutionDate
    CreateAPayoutRequestDebitedFunds:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: Information about the debited funds.
      title: CreateAPayoutRequestDebitedFunds
    CreateAPayoutRequestPaymentRef:
      type: object
      properties:
        ReasonType:
          type: string
          description: "**Allowed values:** `PAYIN_REFUND` \n\nThe reason for the reference being provided:\n- `PAYIN_REFUND` – The payout serves to reimburse a pay-in."
        ReferenceId:
          type: string
          description: '**Allowed values:** The valid `Id` of a successful pay-in.


            The unique identifier associated with the reference, whose value corresponds to the `ReasonType`:

            - `PAYIN_REFUND` – The `ReferenceId` value provided is the same as the `Id` of the initial pay-in being refunded.'
      required:
      - ReasonType
      - ReferenceId
      description: "Information about the payment reference provided for the payout. \n\nThis object must be used to provide the reference of a [bank wire pay-in](/api-reference/bank-wire-payins/bank-wire-payin-object) or a [pay-in to virtual IBAN](/api-reference/virtual-accounts/external-instruction-bank-wire-payin-object), if the payout is being used to refund it."
      title: CreateAPayoutRequestPaymentRef
    PayoutWithoutModeAppliedResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          type: string
          description: 'The unique identifier of the user at the source of the transaction.


            **Best practice:** When the payout author is different from the bank account owner, the Payout `AuthorId` value must be different from the Recipient `UserId` value as well. Otherwise, Mangopay''s Compliance team will reject the payout.'
        CreditedUserId:
          description: For a payout, the `CreditedUserId` is always `null` as the funds are being paid out of the Mangoapy environment.
        DebitedFunds:
          $ref: '#/components/schemas/PayoutWithoutModeAppliedResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/PayoutWithoutModeAppliedResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/PayoutWithoutModeAppliedResponseFees'
          description: Information about the fees.
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreditedWalletId:
          description: For a payout, the `CreditedWalletId` is always `null` as the funds are being paid out of the Mangoapy environment.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet.
        PaymentType:
          type: string
          description: '**Returned values:** `BANK_WIRE`


            The payment type of the payout.'
        BankAccountId:
          type: string
          description: The unique identifier of the bank account.
        BankWireRef:
          type: string
          description: 'Max. length: 255 characters (< 12 recommended)


            Custom description to appear on the user''s bank statement along with the platform name. The recommended length is 12 characters – strings longer than this may be truncated depending on the bank. For the full structure of the string, see the <a href="/bank-statements">Customizing bank statement references</a> article.'
        PaymentRef:
          oneOf:
          - $ref: '#/components/schemas/PayoutWithoutModeAppliedResponsePaymentRef'
          - type: 'null'
          description: 'Information about the payment reference provided for the payout. This object is returned `null` if not provided.


            This object must be used to provide the reference of a [bank wire pay-in](/api-reference/bank-wire-payins/bank-wire-payin-object) or a [pay-in to virtual IBAN](/api-reference/virtual-accounts/external-instruction-bank-wire-payin-object), if the payout is being used to refund it.'
        RecipientId:
          type: string
          description: The unique identifier of the [Recipient](/api-reference/recipients/recipient-object) object to which the payout is being requested. This property should be used by platforms integrating for the first time (and not the `BankAccountId`).
      title: PayoutWithoutModeAppliedResponse
    CreateAPayoutRequestFees:
      type: object
      properties:
        Currency:
          $ref: '#/components/schemas/Currency'
        Amount:
          $ref: '#/components/schemas/Amount'
      required:
      - Currency
      - Amount
      description: Information about the fees.
      title: CreateAPayoutRequestFees
    TransactionStatus:
      type: string
      description: '**Returned values:** `CREATED`, `SUCCEEDED`, `FAILED`


        The status of the transaction.'
      title: TransactionStatus
    CreatePayoutResponseFallbackReason:
      type: object
      properties:
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
      description: Information regarding the reason for the refusal of the instant payout request.
      title: CreatePayoutResponseFallbackReason
    RecipientVerificationId:
      type:
      - string
      - 'null'
      description: The unique identifier of the VOP check. This value may be `null` if the check could not be performed.
      title: RecipientVerificationId
    CreatePayoutResponse:
      type: object
      properties:
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        AuthorId:
          type: string
          description: "The unique identifier of the user at the source of the transaction. \n\nBest practice: When the payout author is different from the bank account owner, the Payout `AuthorId` value must be different from the Bank Account `UserId` value as well. Otherwise, Mangopay's Compliance team will reject the payout."
        CreditedUserId:
          description: For a payout, the `CreditedUserId` is always `null` as the funds are being paid out of the Mangoapy environment.
        DebitedFunds:
          $ref: '#/components/schemas/CreatePayoutResponseDebitedFunds'
          description: Information about the debited funds.
        CreditedFunds:
          $ref: '#/components/schemas/CreatePayoutResponseCreditedFunds'
          description: Information about the credited funds (`CreditedFunds` = `DebitedFunds` - `Fees`).
        Fees:
          $ref: '#/components/schemas/CreatePayoutResponseFees'
          description: Information about the fees.
        Status:
          $ref: '#/components/schemas/TransactionStatus'
        ResultCode:
          $ref: '#/components/schemas/ResultCode'
        ResultMessage:
          $ref: '#/components/schemas/ResultMessage'
        ExecutionDate:
          $ref: '#/components/schemas/TransactionExecutionDate'
        Type:
          $ref: '#/components/schemas/TransactionType'
        Nature:
          $ref: '#/components/schemas/TransactionNature'
        CreditedWalletId:
          type: string
          description: The unique identifier of the credited wallet. In the specific case of the Payout object, this value is always `null` since there is no credited wallet.
        DebitedWalletId:
          type: string
          description: The unique identifier of the debited wallet.
        PaymentType:
          type: string
          description: '**Returned values:** `BANK_WIRE`


            The payment type of the payout.'
        BankAccountId:
          type: string
          description: The unique identifier of the bank account.
        BankWireRef:
          type: string
          description: 'Max. length: 255 characters (< 12 recommended)


            Custom description to appear on the user''s bank statement along with the platform name. The recommended length is 12 characters – strings longer than this may be truncated depending on the bank. For the full structure of the string, see the <a href="/bank-statements">Customizing bank statement references</a> article.'
        ModeRequested:
          type: string
          description: '**Returned values:** `STANDARD`, `INSTANT_PAYMENT`, `INSTANT_PAYMENT_ONLY`, `RTGS_PAYMENT`


            The value set for the `PayoutModeRequested` parameter when making the request.'
        ModeApplied:
          type: string
          description: '**Returned values:** `STANDARD`, `INSTANT_PAYMENT`, `RTGS_PAYMENT`, `PENDING_RESPONSE`


            The mode defining how the payout request is sent:

            - `STANDARD` – **Non-EUR:** Sent via the relevant local rail if the Recipient''s destination country corresponds, or otherwise sent via SWIFT. Mangopay automatically routes funds via the [available rails](/guides/payouts#all-rails-by-currency), which also determines [delivery times](/guides/payouts#delivery-times). Requests received after the applicable cutoff are processed the next working day. **EUR:** Sent via the SEPA Credit Transfer scheme or SWIFT (if non-domestic).

            - `INSTANT_PAYMENT` – **EUR only:** Sent via the SEPA Instant Credit Transfer scheme (funds processed within 10 seconds).

            - `RTGS_PAYMENT` – **EUR only:** Sent via the Eurozone''s [real-time gross settlement (RGTS)](/guides/payouts#real-time-gross-settlement-rtgs) scheme T2 (funds processed same working day) without a fallback. If the request is received after the applicable cutoff (16:15 CET), it is processed the next working day (from 07:00 CET).

            - `PENDING_RESPONSE` – Temporary state to accommodate the possible latency between the creation of the request and the mode being applied in the case of instant payment and RGTS modes.'
        FallbackReason:
          oneOf:
          - $ref: '#/components/schemas/CreatePayoutResponseFallbackReason'
          - type: 'null'
          description: Information regarding the reason for the refusal of the instant payout request.
        EndToEndId:
          type: string
