    CancelAnIntentResponse:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier of the intent.
        Amount:
          type: integer
          description: The full amount authorized in the Intent, which must equal the sum of the total amounts of all `LineItems`.
        AvailableAmountToSplit:
          type: integer
          description: The remaining amount of the Intent that can be split and transferred to the sellers' wallets.
        UnfundedAmount:
          type: integer
          description: The amount needing to be settled to the Platform's technical wallet before the Intent Splits can be executed.
        Currency:
          type: string
          description: The currency of the intent.
        PlatformFeesAmount:
          type: integer
          description: 'The amount of fees to be diverted to the platform''s Fees Wallet when the Intent is split. This value can be overridden when the Split is created.


            The `PlatformFeesAmount` value must the sum of all line item `Seller.FeesAmount` values.'
        Status:
          type: string
          description: 'The status of the Intent, as declared by the platform through Intent Captures, Refunds (and reversals), or Disputes (and decisions). Where partial actions occur, the top-level Intent `Status` may differ from the `Status` of Intent `LineItems`.


            Intent `Status` values:

            - `AUTHORIZED` – The Intent `Amount` was authorized for acquisition by the PSP and can be captured or canceled.

            - `PARTIALLY_CAPTURED` – Part of the Intent `Amount` from one or more `LineItems` was captured. The other parts are either still available for capture or cancel.

            - `CAPTURED` – All of the Intent `Amount` was captured. Part of it may have been subsequently refunded or disputed.

            - `CANCELLED` – All of the Intent `Amount` was canceled.

            - `REFUNDED` – All of the `CapturedAmount` of all `LineItems` was refunded.

            - `REFUND_REVERSED` – The refund could not be completed and the funds were returned to the platform.

            - `DISPUTED` – All of the `CapturedAmount` of all `LineItems` was disputed.

            - `DEFENDED` – The dispute is being defended by the platform.

            - `DISPUTED_WON` – The dispute was resolved in favor of the platform.

            - `DISPUTED_LOST` – The dispute was resolved against the platform.'
        ExternalData:
          $ref: '#/components/schemas/ExternalProcessingDateExternalProviderReferenceExternalMerchantReference'
        Buyer:
          $ref: '#/components/schemas/BuyerId'
        LineItems:
          type: array
          items:
            $ref: '#/components/schemas/LineItems_Intent'
          description: "Information about the items purchased in the transaction. A maximum of 100 line items can be created per Intent.\n\nThe sum of all line item amounts must equal the Intent `Amount` value. The total for each line items is calculated as ((`UnitAmount` x `Quantity`) - `DiscountAmount`), which is shown in the `TotalLineItemAmount` returned. The `TaxAmount` is indicative and included in the `UnitAmount`. \n\nThe sum of all line item `Seller.FeesAmount` values must equal the Intent `PlatformFeesAmount` value."
