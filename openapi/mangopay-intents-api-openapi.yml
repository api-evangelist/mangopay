openapi: 3.2.0
info:
  title: Reference Intents API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Intents
paths:
  /v3.0/{ClientId}/payins/intents/external-providers:
    get:
      operationId: intents_list_intent_external_providers
      summary: List Intent external providers
      description: 'Retrieve the list of third-party PSP names supported by Echo for:

        - The `ExternalData.ExternalProviderName` property of the Intent object

        - The `ExternalProviderName` property of Mangopay''s settlement file format


        **Note – Check values to use for your integration**


        This endpoint returns the descriptive name for each provider. The rendering of the value you need to use as the `ExternalProviderName` in your integration is listed in the supported providers page.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListIntentExternalProvidersResponse'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents:
    post:
      operationId: intents_create_intent
      summary: Create an Intent
      description: 'Declare a transaction authorization processed by a third-party PSP


        This endpoint allows you to declare a payment authorized by a third-party PSP. Once `AUTHORIZED` (as shown by the `Status` in the response), the Intent''s `LineItems` can be:

        - Captured using POST Create an Intent Capture

        - Canceled using POST Cancel an Intent


        In a mixed-basket flow, you can also use this endpoint to add `LineItems` to an existing Intent by sending the same `ExternalData.ExternalProviderReference` as the existing Intent.


        In a hybrid flow, where the `ExternalProviderName` is `Mangopay`, you can define the `LineItems.SplitOriginWalletId` in the Intent, otherwise it must be defined on POST Create an Intent Split.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentRequest'
      security:
      - oauth2: []
    get:
      operationId: intents_list_intents
      summary: List all Intents
      description: Retrieve a paginated list of Intents, with optional filters for provider, currency, date range, and status.
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the object was created (based on the object's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the object was created (based on the object's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: Status
        in: query
        description: '**Allowed values:** `AUTHORIZED`, `CAPTURED`, `PARTIALLY_CAPTURED`, `REFUNDED`, `REFUND_REVERSED`, `DISPUTED`, `DISPUTED_WON`, `DISPUTED_LOST`, `DEFENDED`, `CANCELLED`


          The status of the Intent. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: ExternalProviderName
        in: query
        description: The third-party PSP name to filter by.
        required: false
        schema:
          type: string
      - name: Currency
        in: query
        description: The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> of the currency to filter by.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 'Start value: `1`


          **Default value:** `1`


          Indicates the index of the page for the pagination.'
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Min. value: `1`; max. value: `100`


          **Default value:** `10`


          Indicates the number of items returned for each page of the pagination.'
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllIntentsResponse'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/cancel:
    post:
      operationId: intents_cancel_intent
      summary: Cancel an Intent
      description: 'Cancel all or part of an authorized Intent


        You can use this endpoint to cancel all or part of an Intent **before** it has been captured. You can only call this endpoint if the Intent has the `Status` of `AUTHORIZED`. You cannot cancel an Intent if it has been captured in part (`PARTIALLY_CAPTURED`) or full (`CAPTURED`).'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelAnIntentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAnIntentRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/captures:
    post:
      operationId: intents_create_intent_capture
      summary: Create an Intent Capture
      description: 'Declare the full or partial capture of an authorization processed by a third-party PSP


        You can use this endpoint in three capture scenarios requiring three difference request bodies.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentCaptureResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentCaptureRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/refunds:
    post:
      operationId: intents_create_intent_refund
      summary: Create an Intent Refund
      description: Declare the full or partial refund of a payment processed by a third-party PSP, represented by an Intent Refund.
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRefundResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentRefundRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/refunds/{RefundId}/reverse:
    post:
      operationId: intents_reverse_intent_refund
      summary: Reverse an Intent Refund
      description: 'Declare the reversal of a refund processed by a third-party PSP


        This endpoint allows you to reverse an Intent Refund in full or in part if the refund processed by the third-party PSP was not successful and the funds were returned to the platform.


        This endpoint effectively changes the Intent Refund `Status` to `REFUND_REVERSED` and re-calculates the `RefundedAmount` of the `LineItem`.


        You can only reverse the same amount that was refunded.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      - name: RefundId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentRefundResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentRefundRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/capture/{CaptureId}/disputes:
    post:
      operationId: intents_create_intent_dispute
      summary: Create an Intent Dispute
      description: Declare the full or partial dispute of a payment processed by a third-party PSP, represented by an Intent Dispute.
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      - name: CaptureId
        in: path
        description: The unique identifier of the Capture being disputed.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentDisputeResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentDisputeRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/capture/{CaptureId}/disputes/{DisputeId}/decision:
    put:
      operationId: intents_update_intent_dispute
      summary: Update an Intent Dispute
      description: 'Track the outcome of a dispute processed by a third-party PSP.


        This endpoint allows you to track the outcome of an Intent Dispute by sending the `Decision` value. In the Intent object, the decision is reflected in the `Disputes.Status` value'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      - name: CaptureId
        in: path
        description: The unique identifier of the Capture being disputed.
        required: true
        schema:
          type: string
      - name: DisputeId
        in: path
        description: The unique identifier of the Intent Dispute.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateAnIntentDisputeResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAnIntentDisputeRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}:
    get:
      operationId: intents_view_intent
      summary: View an Intent
      description: Retrieve the declaration of a transaction processed by a third-party PSP
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewAnIntentResponse'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/splits:
    post:
      operationId: intents_create_intent_split
      summary: Create an Intent Split
      description: 'Create a transfer to the wallet of the seller of an Intent line item.


        Once the Intent is `PARTIALLY_CAPTURED` or `CAPTURED`, you can create Splits to set up the transfers to the seller wallet(s).'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentSplitsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentSplitRequest'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/splits/{SplitId}:
    put:
      operationId: intents_update_intent_split
      summary: Update an Intent Split
      description: '**Note – Split Status values that allow modification**


        To modify a split, its `Status` must be:

        - `CREATED`

        - `PENDING_FUNDS_RECEPTION`

        - `AVAILABLE`

        - `FAILED `


        Modify a Split before execution.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      - name: SplitId
        in: path
        description: The unique identifier of the Split.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentSplitsResponse'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAnIntentSplitRequest'
      security:
      - oauth2: []
    get:
      operationId: intents_view_intent_split
      summary: View an Intent Split
      description: Retrieve details of a Split of an Intent.
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        required: true
        schema:
          type: string
      - name: SplitId
        in: path
        description: The unique identifier of the Split.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentSplitResponse'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/splits/{SplitId}/execute:
    post:
      operationId: intents_execute_intent_split
      summary: Execute an Intent Split
      description: 'Release the funds of a Split to the wallet of the seller of the Intent line item.


        Once the Intent funds have been settled (in a Settlement) and the funds have been received on the platform''s technical wallet, the Split status becomes `AVAILABLE`, meaning you can use this endpoint to execute the transfer of funds to the Seller''s wallet.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      - name: SplitId
        in: path
        description: The unique identifier of the Split.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentSplitResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/{IntentId}/splits/{SplitId}/reverse:
    post:
      operationId: intents_reverse_intent_split
      summary: Reverse an Intent Split
      description: 'Cancel an unexecuted Split


        Reversing a Split effectively cancels it, and can only be done when it has the `Status` of `AVAILABLE` or `REJECTED`.'
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: IntentId
        in: path
        description: The unique identifier of the Intent.
        required: true
        schema:
          type: string
      - name: SplitId
        in: path
        description: The unique identifier of the Split.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntentSplitResponse'
      security:
      - oauth2: []
  /v3.0/{ClientId}/payins/intents/splits:
    get:
      operationId: intents_list_intent_splits
      summary: List all Intent Splits
      description: Retrieve a paginated list of splits across all intents, with optional filters for provider, currency, date range, and status.
      tags:
      - Intents
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the object was created (based on the object's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the object was created (based on the object's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: Status
        in: query
        description: '**Allowed values:** `CREATED`, `PENDING_FUNDS_RECEPTION`, `AVAILABLE`, `PENDING`, `COMPLETED`, `REJECTED`, `FAILED`, `REVERSED`, `REFUND_SPLIT_PENDING`, `REFUND_SPLIT_REJECTED`, `REFUND_SPLIT_COMPLETED`


          The status of the Split. You can filter on multiple values by separating them with a comma.'
        required: false
        schema:
          type: string
      - name: ExternalProviderName
        in: query
        description: The third-party PSP name of the parent intent to filter by.
        required: false
        schema:
          type: string
      - name: Currency
        in: query
        description: The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> of the currency to filter by.
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: 'Start value: `1`


          **Default value:** `1`


          Indicates the index of the page for the pagination.'
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Min. value: `1`; max. value: `100`


          **Default value:** `10`


          Indicates the number of items returned for each page of the pagination.'
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllSplitsResponse'
      security:
      - oauth2: []
components:
  schemas:
    ListAllIntentsResponseItemsExternalData:
      type: object
      properties:
        ExternalProcessingDate:
          type: integer
          description: The date the PSP processed the transaction.
        ExternalProviderReference:
          type: string
          description: The unique reference of the transaction from the PSP.
        ExternalProviderName:
          type: string
          description: The supported third-party PSP processing the transaction.
        ExternalProviderPaymentMethod:
          type: string
          description: The payment method used for the transaction.
      title: ListAllIntentsResponseItemsExternalData
    CreateAnIntentSplitRequestSplitsItems:
      type: object
      properties:
        LineItemId:
          type: string
          description: The unique identifier of the line item.
        SplitAmount:
          type: integer
          description: 'The amount to transfer to the seller''s `WalledId`.


            The sum of the `SplitAmount` values of all `Splits` must be lower than or equal to the `AvailableAmountToSplit` of the Intent.'
        FeesAmount:
          type: integer
          description: 'The amount of fees.


            The sum of the `FeesAmount` values of all `Splits` must be lower than or equal to the `PlatformFeesAmount` of the Intent.'
        TransferDate:
          type: integer
          description: The future date when the funds are to be automatically transferred to the seller's wallet.
        Description:
          type: string
          description: The description of the Split.
        SplitOriginWalletId:
          type: string
          description: 'The unique identifier of the wallet from which the split will be debited.


            This parameter is required for Intents where `ExternalProviderName` is `Mangopay`. If it is not defined in the Intent it must be defined at Split creation.'
        Tag:
          $ref: '#/components/schemas/Tag'
      required:
      - LineItemId
      - SplitAmount
      title: CreateAnIntentSplitRequestSplitsItems
    ViewAnIntentResponseDisputesItems:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier of the Dispute.
        Amount:
          type: integer
          description: The amount of the Dispute.
        Status:
          type: string
          description: 'The status of the Intent Dispute:

            - `NEEDS_RESPONSE` – The outcome of the dispute has not been declared by the platform.

            - `DEFENDED` – The dispute is being defended and the funds may have been returned to the platform temporarily, but they are not expected on the technical wallet.

            - `DISPUTED_WON` – The dispute was resolved in favor of the platform and the funds are expected on the technical wallet.

            - `DISPUTED_LOST` – The dispute was ruled against the platform and the funds were returned to the user.'
        LineItems:
          type: array
          items:
            $ref: '#/components/schemas/ViewAnIntentResponseDisputesItemsLineItemsItems'
          description: Information about the line items in the Dispute.
        CreationDate:
          type: integer
          description: Unix timestamp (UTC) of the date and time the Dispute was created.
        ExecutionDate:
          type: integer
          description: The date at which the object was successfully moved to `DISPUTED`.
        Tag:
          $ref: '#/components/schemas/Tag'
      title: ViewAnIntentResponseDisputesItems
    ViewAnIntentResponseCapturesItemsLineItemsItems:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier of the line item.
        Amount:
          type: integer
          description: The amount of the line item.
      title: ViewAnIntentResponseCapturesItemsLineItemsItems
    ListAllSplitsResponseItems:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier of the Split.
        IntentId:
          type: string
          description: The unique identifier of the parent Intent.
        LineItemId:
          type: string
          description: The unique identifier of the line item.
        SellerId:
          type: string
          description: The unique identifier of the seller of the line item.
        WalletId:
          type: string
          description: The unique identifier of the wallet to credit the seller's funds.
        SplitAmount:
          type: integer
          description: The amount to transfer to the seller's wallet.
        FeesAmount:
          type: integer
          description: The amount of fees.
        TransferDate:
          type: integer
          description: The future date when the funds are to be automatically transferred to the seller's wallet.
        Description:
          type: string
          description: The description of the Split.
        Status:
          type: string
          description: 'The status of the Split:

            - `CREATED` – The Split was successfully declared via the API but it is not yet confirmed whether the funds for the parent Intent are available.

            - `PENDING_FUNDS_RECEPTION` – The Split is linked to an Intent that has been reconciled with a settlement file. The system is waiting for the funds to be confirmed in the technical wallet.

            - `AVAILABLE` – The funds for the parent Intent have been received and confirmed. The Split is ready to be executed.

            - `PENDING` – The Split execution has been initiated and is being processed.

            - `COMPLETED` – The transfer was successful and the funds have been moved to the seller''s wallet.

            - `REJECTED` – The Split execution failed immediately due to a synchronous error (e.g. invalid wallet ID). The platform can retry execution or reverse the Split.

            - `FAILED` – The Split execution was initiated but the transfer failed due to an asynchronous error (e.g. insufficient funds in the source wallet). A new Split must be created to retry.

            - `REVERSED` – The Split was canceled by the platform while in `AVAILABLE` or `REJECTED` status.

            - `REFUND_SPLIT_PENDING` – A refund has been declared on the parent Intent and the refund of this Split is pending.

            - `REFUND_SPLIT_REJECTED` – The refund of this Split was rejected.

            - `REFUND_SPLIT_COMPLETED` – The refund of this Split was completed successfully.'
      title: ListAllSplitsResponseItems
    IntentRefundResponse:
      type: object
      properties:
        Id:
          type: string
          description: The unique identifier of the intent.
        Amount:
          type: integer
          description: The full amount authorized in the Intent, which must equal the sum of the total amounts of all `LineItems`.
        AvailableAmountToSplit:
          type: integer
          description: The remaining amount of the Intent that can be split and transferred to the sellers' wallets.
        UnfundedAmount:
          type: integer
          description: The amount needing to be settled to the Platform's technical wallet before the Intent Splits can be executed.
        Currency:
          type: string
          description: The currency of the intent.
        PlatformFeesAmount:
          type: integer
          description: 'The amount of fees to be diverted to the platform''s Fees Wallet when the Intent is split. This value can be overridden when the Split is created.


            The `PlatformFeesAmount` value must the sum of all line item `Seller.FeesAmount` values.'
        Status:
          type: string
          description: 'The status of the Intent, as declared by the platform through Intent Captures, Refunds (and reversals), or Disputes (and decisions). Where partial actions occur, the top-level Intent `Status` may differ from the `Status` of Intent `LineItems`.


            Intent `Status` values:

            - `AUTHORIZED` – The Intent `Amount` was authorized for acquisition by the PSP and can be captured or canceled.

            - `PARTIALLY_CAPTURED` – Part of the Intent `Amount` from one or more `LineItems` was captured. The other parts are either still available for capture or cancel.

            - `CAPTURED` – All of the Intent `Amount` was captured. Part of it may have been subsequently refunded or disputed.

            - `CANCELLED` – All of the Intent `Amount` was canceled.

            - `REFUNDED` – All of the `CapturedAmount` of all `LineItems` was refunded.

            - `REFUND_REVERSED` – The refund could not be completed and the funds were returned to the platform.

            - `DISPUTED` – All of the `CapturedAmount` of all `LineItems` was disputed.

            - `DEFENDED` – The dispute is being defended by the platform.

            - `DISPUTED_WON` – The dispute was resolved in favor of the platform.

            - `DISPUTED_LOST` – The dispute was resolved against the platform.'
