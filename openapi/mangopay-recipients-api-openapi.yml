openapi: 3.2.0
info:
  title: Reference Recipients API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Recipients
paths:
  /v2.01/{ClientId}/recipients/schema:
    get:
      operationId: recipients_view_recipient_schema
      summary: View the schema for a Recipient
      description: Fetch the data requirements for a given currency, payout method type, and recipient type
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: PayoutMethodType
        in: query
        description: '**Allowed values:** `LocalBankTransfer`, `InternationalBankTransfer`


          The payout method.'
        required: true
        schema:
          type: string
      - name: Currency
        in: query
        description: '**Allowed values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> of a <a href="/guides/currencies" target="_blank">supported currency</a>: `AED`, `AUD`, `CAD`, `CHF`, `CNH`, `CZK`, `DKK`, `EUR`, `GBP`, `HKD`, `HUF`, `ILS`, `JPY`, `MXN`, `NOK`, `NZD`, `PLN`, `RON`, `SAR`, `SEK`, `SGD`, `TRY`, `USD`, `ZAR`


          The currency of the recipient.'
        required: true
        schema:
          type: string
      - name: Country
        in: query
        description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


          The destination country of the payout method.'
        required: true
        schema:
          type: string
      - name: RecipientType
        in: query
        description: '**Allowed values:** `Individual`, `Business`


          The recipient type:

          - `Individual` – An account held by a natural person

          - `Business` – An account held by a legal entity'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewTheSchemaForARecipientResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
  /v2.01/{ClientId}/users/{UserId}/recipients/validate:
    post:
      operationId: recipients_validate_recipient_data
      summary: Validate data for a Recipient
      description: 'Check that the user''s Recipient data is valid before creation


        A 200 HTTP response code indicates the request is valid against the schema. No response body is returned.'
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/recipients_validate_recipient_data_Response_200'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateDataForARecipientRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/users/{UserId}/recipients:
    post:
      operationId: recipients_create_recipient
      summary: Create a Recipient
      description: 'Register a bank account for local or international payouts.


        **Caution – Fetch schema and validate data before creation**


        Before using this endpoint to register a Recipient for a user, for the given currency, payout method, and recipient type combination, always:

        - Fetch the schema dynamically using GET View the schema for a Recipient

        - Check that the user''s data is valid using POST Validate data for a Recipient


        **Note – SCA triggered by this endpoint**


        Registering a bank account as a Recipient always requires the user to authenticate using SCA on a Mangopay-hosted webpage, unless your platform is using a proxy and user consent.


        To let the user complete the SCA session, your platform needs to retrieve the returned `PendingUserAction.RedirectUrl`, add an encoded `returnUrl` query parameter, and redirect the user. Read more about how to redirect them in the SCA session guide.


        If SCA is not successfully completed, the Recipient `Status` becomes `CANCELED` and you need to create a new Recipient to try again.


        In Sandbox, you can bypass SCA by including the word `accept` in the `Email` value of the Natural User or the `LegalRepresentative.Email` value of the Legal User – for example `accept@example.com` or `john.doe+accept@example.com`.


        Recipient creation is asynchronous, meaning that this endpoint returns the `Status` as `PENDING` regardless of whether SCA is required (when `RecipientScope` is `PAYOUT`) or not. In all cases, your integration should rely on the `RECIPIENT_ACTIVE` webhook to know when the recipient is `ACTIVE`.


        Verification of Payee (VOP) impacts SEPA local schemes, which means Recipients with `Currency` value `EUR` and `PayoutMethodType` value `LocalBankTransfer`. Read more **→**'
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateARecipientRequest'
      security:
      - oauth2: []
    get:
      operationId: recipients_list_recipients_user
      summary: List Recipients for a User
      description: '**Note – Endpoint returns filtered list by default**


        By default, this endpoint returns only recipients with the `RecipientScope` value of `PAYOUT`. Specify `ALL` to retrieve both `PAYIN` and `PAYOUT` recipients, or `PAYIN` to retrieve only pay-in recipients.


        By default, results are sorted by `CreationDate` in descending order.


        List recipients created for a UserId'
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 'Start value: `1`


          **Default value:** `1`


          Indicates the index of the page for the pagination.'
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Min. value: `1`; max. value: `100`


          **Default value:** `10`


          Indicates the number of items returned for each page of the pagination.'
        required: false
        schema:
          type: integer
      - name: Sort
        in: query
        description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


          **Default value:** `CreationDate:DESC`


          Indicates the direction in which to sort the list.'
        required: false
        schema:
          type: string
      - name: RecipientScope
        in: query
        description: '**Possible values:** `ALL`, `PAYOUT`, `PAYIN`


          **Default value:** `PAYOUT`


          By default, this endpoint returns only recipients with the `RecipientScope` value of `PAYOUT`.


          Specify `ALL` to retrieve both `PAYIN` and `PAYOUT` recipients, or `PAYIN` to retrieve only pay-in recipients.


          Read more about [recipient scopes in the guide](/guides/sca/recipients#recipient-scopes).'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRecipientsForAUserResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/recipients/{RecipientId}:
    put:
      operationId: recipients_deactivate_recipient
      summary: Deactivate a Recipient
      description: Permanently disable a Recipient
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: RecipientId
        in: path
        description: The unique identifier of the Recipient or legacy Bank Account (the legacy `BankAccountId` value can be used on this endpoint).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeactivateARecipientResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeactivateARecipientRequest'
      security:
      - oauth2: []
    get:
      operationId: recipients_view_recipient
      summary: View a Recipient
      description: 'Fetch a Recipient or legacy Bank Account based on its ID


        Verification of Payee (VOP) impacts SEPA local schemes, which means Recipients with `Currency` value `EUR` and `PayoutMethodType` value `LocalBankTransfer`. Read more **→**'
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: RecipientId
        in: path
        description: The unique identifier of the Recipient or legacy Bank Account (the legacy `BankAccountId` value can be used on this endpoint).
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipientResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/recipients/payout-methods:
    get:
      operationId: recipients_view_payout_methods
      summary: View payout methods
      description: See payout methods available to your platform by currency and country
      tags:
      - Recipients
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: Currency
        in: query
        description: '**Possible values:** `AED`, `AUD`, `CAD`, `CHF`, `CNH`, `CZK`, `DKK`, `EUR`, `GBP`, `HKD`, `HUF`, `ILS`, `JPY`, `MXN`, `NOK`, `NZD`, `PLN`, `RON`, `SAR`, `SEK`, `SGD`, `TRY`, `USD`, `ZAR`


          The currency of the payout method.'
        required: true
        schema:
          type: string
      - name: Country
        in: query
        description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


          The destination country of the payout method.'
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewPayoutMethodsResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
components:
  schemas:
    ViewTheSchemaForARecipientResponseLocalBankTransferOneOf12Ron:
      type: object
      properties:
        IBAN:
          $ref: '#/components/schemas/FieldMetadata'
      description: The schema of the `RON` property.
      title: ViewTheSchemaForARecipientResponseLocalBankTransferOneOf12Ron
    Tag_Recipient:
      type:
      - string
      - 'null'
      description: 'Max. length: 255 (pattern: `^.{0,255}$`)


        Custom data that you can add to this object, such as unique identifiers in your system. To store multiple values, you can serialize them into a single string, for example a JSON object: `"{\"id_1\":AB123,\"id_2\":DE456}"`.


        This value cannot be edited once created.'
      title: Tag_Recipient
    LocalBankTransfer_USD:
      type: object
      properties:
        AccountNumber:
          type: string
          description: 'Format: 8–12 alphanumeric characters (pattern: `^[0-9a-zA-Z]{8,12}$`).


            The account number of the US account.'
        ABA:
          type: string
          description: 'Format: 9 digits (pattern: `^\d{9}$`).


            The ABA routing number of the US account.'
        FFC:
          type: string
          description: 'Format: 8-12 digits then `FFC` then a space then a string of characters up to 140 total length (pattern: `^(?=.{0,140}$)[0-9]{8,12}/FFC [0-9a-zA-Z/\-?:().,''+ ]+$`).


            FFC transfer information for the US account.'
      description: Local bank transfer details for `Currency` value `USD`.
      title: LocalBankTransfer_USD
    RecipientVerificationPayeeSuggestedName:
      type:
      - string
      - 'null'
      description: The name returned by the check in case of a `CLOSE_MATCH` result, which can be used to re-register the Recipient. This property is not returned on the check performed on a Payout request, even if the result is `CLOSE_MATCH`.
      title: RecipientVerificationPayeeSuggestedName
    ViewTheSchemaForARecipientResponseLocalBankTransferOneOf2Chf:
      type: object
      properties:
        IBAN:
          $ref: '#/components/schemas/FieldMetadata'
      description: The schema of the `CHF` property.
      title: ViewTheSchemaForARecipientResponseLocalBankTransferOneOf2Chf
    ViewTheSchemaForARecipientResponseLocalBankTransfer15:
      type: object
      properties:
        TRY:
          $ref: '#/components/schemas/ViewTheSchemaForARecipientResponseLocalBankTransferOneOf15Try'
          description: The schema of the `TRY` property.
      required:
      - TRY
      title: ViewTheSchemaForARecipientResponseLocalBankTransfer15
    ViewTheSchemaForARecipientResponseLocalBankTransferOneOf5Eur:
      type: object
      properties:
        IBAN:
          $ref: '#/components/schemas/FieldMetadata'
      description: The schema of the `EUR` property.
      title: ViewTheSchemaForARecipientResponseLocalBankTransferOneOf5Eur
    LocalBankTransfer_SGD:
      type: object
      properties:
        BankCode:
          type: string
          description: 'Format: 3–4 numeric digits (pattern: `^\d{3,4}$`).


            The bank code of the Singaporean account.'
        AccountNumber:
          type: string
          description: 'Format: 6–34 alphanumeric characters (pattern: `^[0-9a-zA-Z]{6,34}$`).


            The account number of the Singaporean account.'
        BIC:
          type: string
          description: 'Format: 8 or 11 alphanumeric characters.


            The BIC of the Singaporean account.'
      description: Local bank transfer details for `Currency` value `SGD`.
      title: LocalBankTransfer_SGD
    CreateARecipientRequest:
      oneOf:
      - $ref: '#/components/schemas/CreateInternationalIndividualRecipientRequest'
      - $ref: '#/components/schemas/CreateInternationalBusinessRecipientRequest'
      - $ref: '#/components/schemas/CreateLocalIndividualRecipientRequest'
      - $ref: '#/components/schemas/CreateLocalBusinessRecipientRequest'
      title: CreateARecipientRequest
    DataFormatField:
      type: object
      properties:
        Required:
          type: boolean
          description: Whether the field is required or not.
        MaxLength:
          type: integer
          description: The maximum length of the string.
        Pattern:
          type: string
          description: The regex describing the accepted value of the string.
        Label:
          type: string
          description: A label that platforms can use when displaying or requesting the field to the end user.
        EndUserDisplay:
          type: string
          description: '**Possible values:** `Show`, `Hide`


            Recommendation on whether to show or hide the field (and `Label`) to the end user.'
      description: Field metadata returned by [GET View the schema for a Recipient](/api-reference/recipients/view-recipient-schema).
      title: DataFormatField
    ViewTheSchemaForARecipientResponseIndividualRecipient:
      type: object
      properties:
        FirstName:
          $ref: '#/components/schemas/DataFormatField'
        LastName:
          $ref: '#/components/schemas/DataFormatField'
        Address:
          $ref: '#/components/schemas/Address_Recipient_Schema'
      description: The schema of the `IndividualRecipient` property.
      title: ViewTheSchemaForARecipientResponseIndividualRecipient
    recipients_validate_recipient_data_Response_200:
      type: object
      properties: {}
      description: Empty response body
      title: recipients_validate_recipient_data_Response_200
    RecipientVerificationCheck:
      type:
      - string
      - 'null'
      description: '**Possible values:** `MATCH`, `CLOSE_MATCH`, `NO_MATCH`, `MATCH_NOT_POSSIBLE`


        The result of the VOP check:

        - `MATCH` – The account is valid and the account name matches the IBAN.

        - `CLOSE_MATCH` – The account is valid but the name doesn''t match exactly.

        - `NO_MATCH` – This account likely belongs to a different owner.

        - `MATCH_NOT_POSSIBLE` – The check could not be completed.'
      title: RecipientVerificationCheck
    CreateInternationalIndividualRecipientRequest:
      type: object
      properties:
        DisplayName:
          $ref: '#/components/schemas/DisplayName_Recipient_Request'
        Currency:
          $ref: '#/components/schemas/Currency_Recipient'
        Country:
          $ref: '#/components/schemas/Country_Recipient'
        RecipientScope:
          $ref: '#/components/schemas/RecipientScope_Recipient_Request'
        Tag:
          $ref: '#/components/schemas/Tag_Recipient'
        ScaContext:
          $ref: '#/components/schemas/ScaContext_Recipient_Request'
        PayoutMethodType:
          type: string
          description: '**Allowed values:** `InternationalBankTransfer`


            The payout method of the recipient:

            - `InternationalBankTransfer` – The account can receive non-local currencies via SWIFT or else uses local rails for local currencies by default.

            - `LocalBankTransfer` – The account can **only** receive the corresponding local `Currency` for the `Country` (e.g. `EUR` to a SEPA country, `GBP` to a UK account, `PLN` to a Polish IBAN, etc.)'
        RecipientType:
          type: string
          description: '**Allowed values:** `Individual`


            The recipient type:

            - `Individual` – An account held by a natural person, requiring the `IndividualRecipient` property.

            - `Business` – An account held by a legal entity, requiring the `BusinessRecipient` property.'
        IndividualRecipient:
          $ref: '#/components/schemas/IndividualRecipient_Request'
        InternationalBankTransfer:
          $ref: '#/components/schemas/InternationalBankTransfer_Request'
      required:
      - DisplayName
      - Currency
      - Country
      - PayoutMethodType
      - RecipientType
      - IndividualRecipient
      - InternationalBankTransfer
      description: Request body for creating a Recipient where `PayoutMethodType` is `InternationalBankTransfer` and `RecipientType` is `Individual`.
      title: CreateInternationalIndividualRecipientRequest
    ViewTheSchemaForARecipientResponseLocalBankTransfer14:
      type: object
      properties:
        SGD:
          $ref: '#/components/schemas/ViewTheSchemaForARecipientResponseLocalBankTransferOneOf14Sgd'
          description: The schema of the `SGD` property.
      required:
      - SGD
      title: ViewTheSchemaForARecipientResponseLocalBankTransfer14
    RecipientVerificationOfPayee:
      type: object
      properties:
        RecipientVerificationId:
          $ref: '#/components/schemas/RecipientVerificationId'
        RecipientVerificationCheck:
          $ref: '#/components/schemas/RecipientVerificationCheck'
        RecipientVerificationMessage:
          $ref: '#/components/schemas/RecipientVerificationMessage'
        RecipientVerificationPayeeSuggestedName:
          $ref: '#/components/schemas/RecipientVerificationPayeeSuggestedName'
      description: 'Information about the [Verification of Payee (VOP)](/guides/vop) check

        performed on the Recipient. Because VOP only applies to SEPA local

        schemes, this object is returned `null` if the Recipient''s `Currency`

        is not `EUR` or its `PayoutMethodType` is not `LocalBankTransfer`.'
      title: RecipientVerificationOfPayee
    Id:
      type: string
      description: 'Max length: 128 characters (see [data formats](/api-reference/overview/data-formats) for details)


        The unique identifier of the object.'
      title: Id
    ViewTheSchemaForARecipientResponseLocalBankTransferOneOf15Try:
      type: object
      properties:
        IBAN:
          $ref: '#/components/schemas/FieldMetadata'
        BeneficiaryIdentificationValue:
          $ref: '#/components/schemas/FieldMetadata'
      description: The schema of the `TRY` property.
      title: ViewTheSchemaForARecipientResponseLocalBankTransferOneOf15Try
    InternationalBankTransfer_Request:
      type: object
      properties:
        AccountNumber:
          type: string
          description: 'Format: The format returned by the [schema](/api-reference/recipients/view-recipient-schema) endpoint depending on the `Currency` and `Country`.


            The account number of the account. For IBAN countries, the `AccountNumber` format is the local IBAN one. For other countries, the format depends on the `Country` and should be retrieved from the [GET View the schema for a Recipient](/api-reference/recipients/view-recipient-schema) endpoint.'
        BIC:
          type: string
          description: 'Format: The format returned by the [schema](/api-reference/recipients/view-recipient-schema) endpoint depending on the `Currency` and `Country`.


            The BIC of the account. For countries that don''t use IBAN, the `BIC` is required. For countries that use IBAN, this field is ignored because the BIC is generated automatically from the IBAN and returned in the response.'
      required:
      - AccountNumber
      description: 'The account details if `PayoutMethodType` is `InternationalBankTransfer`.


        Only one of `InternationalBankTransfer` or `LocalBankTransfer` is required.


        The `InternationalBankTransfer` depends on the `Currency` and `Country`.'
      title: InternationalBankTransfer_Request
    ViewTheSchemaForARecipientResponseLocalBankTransfer10:
      type: object
      properties:
        NOK:
          $ref: '#/components/schemas/ViewTheSchemaForARecipientResponseLocalBankTransferOneOf10Nok'
          description: The schema of the `NOK` property.
      required:
      - NOK
      title: ViewTheSchemaForARecipientResponseLocalBankTransfer10
    LocalBankTransfer_CAD:
      type: object
      properties:
        AccountNumber:
          type: string
          description: 'Format: 7–35 digits (pattern: `^\d{7,35}$`).


            The account number of the Canadian account.'
        InstitutionNumber:
          type: string
          description: 'Format: 3 digits (pattern: `^\d{3}$`).


            The institution number of the Canadian account.'
        BranchCode:
          type: string
          description: 'Format: 5 digits (pattern: `^\d{5}$`).


            The branch code of the Canadian account.'
        BankName:
          type: string
          description: 'Length: 1–50.


            The bank name of the Canadian account.'
      description: Local bank transfer details for `Currency` value `CAD`.
      title: LocalBankTransfer_CAD
    ViewTheSchemaForARecipientResponse:
      type: object
      properties:
        DisplayName:
          $ref: '#/components/schemas/DataFormatField'
        Currency:
          $ref: '#/components/schemas/DataFormatField_AllowedValues'
        Country:
          $ref: '#/components/schemas/DataFormatField_AllowedValues'
        RecipientType:
          $ref: '#/components/schemas/DataFormatField_AllowedValues'
        PayoutMethodType:
          $ref: '#/components/schemas/DataFormatField_AllowedValues'
        Tag:
          $ref: '#/components/schemas/DataFormatField'
        RecipientScope:
          $ref: '#/components/schemas/DataFormatField_AllowedValues'
        IndividualRecipient:
          $ref: '#/components/schemas/ViewTheSchemaForARecipientResponseIndividualRecipient'
          description: The schema of the `IndividualRecipient` property.
        BusinessRecipient:
          $ref: '#/components/schemas/ViewTheSchemaForARecipientResponseBusinessRecipient'
          description: The schema of the `BusinessRecipient` property.
        InternationalBankTransfer:
          $ref: '#/components/schemas/InternationalBankTransfer_RecipientSchema'
        LocalBankTransfer:
          $ref: '#/components/schemas/ViewTheSchemaForARecipientResponseLocalBankTransfer'
          description: The schema of the `LocalBankTransfer` property.
      title: ViewTheSchemaForARecipientResponse
    LocalBankTransfer_MXN_Request:
      type: object
      properties:
        Clabe:
          type: string
          description: 'Format: exactly 18 numeric digits (pattern: `^\d{18}$`).


            The CLABE (Clave Bancaria Estandarizada) of the Mexican account.'
        BIC:
          type: string
          description: 'Format: 8 or 11 alphanumeric characters.


            The BIC of the Mexican account.'
      required:
      - Clabe
      - BIC
      description: Local bank transfer details for `Currency` value `MXN`.
      title: LocalBankTransfer_MXN_Request
    LocalBankTransfer_GBP:
      type: object
      properties:
        AccountNumber:
          type: string
          description: 'Format: 8 digits (pattern: `^\d{8}$`).


            The account number of the UK account.'
        SortCode:
          type: string
          description: 'Format: 6 digits (pattern: `^\d{6}$`).


            The sort code of the UK account.'
      description: Local bank transfer details for `Currency` value `GBP`.
      title: LocalBankTransfer_GBP
    ListRecipientsForAUserResponse:
      type: array
      items:
        $ref: '#/components/schemas/RecipientListItem'
