          $ref: '#/components/schemas/CreationDate'
        DisplayName:
          $ref: '#/components/schemas/DisplayName_Recipient_Response'
        Currency:
          $ref: '#/components/schemas/Currency_Recipient'
        Country:
          $ref: '#/components/schemas/Country_Recipient'
        UserId:
          type: string
          description: The unique identifier of the user.
        RecipientScope:
          $ref: '#/components/schemas/RecipientScope_Recipient_Response'
        Tag:
          $ref: '#/components/schemas/Tag_Recipient'
        ScaContext:
          $ref: '#/components/schemas/ScaContext_Recipient_Response'
        RecipientVerificationOfPayee:
          oneOf:
          - $ref: '#/components/schemas/RecipientVerificationOfPayee'
          - type: 'null'
          description: Information about the [Verification of Payee (VOP)](/guides/vop) check performed on the Recipient. Because VOP only applies to SEPA local schemes, this object is returned `null` if the Recipient's `Currency` is not `EUR` or its `PayoutMethodType` is not `LocalBankTransfer`.
        PayoutMethodType:
          type: string
          description: '**Returned values:** `LocalBankTransfer`


            The payout method of the recipient:

            - `LocalBankTransfer` – The account can **only** receive the corresponding local `Currency` for the `Country` via the [domestic payment rail](/guides/payouts#payout-rails) (e.g. `EUR` via a SEPA local scheme to a SEPA country, `GBP` via FPS to a `GB` account, `USD` via ACH to a `US` account, etc). Payouts in non-local currencies return an error.

            - `InternationalBankTransfer` – The account can receive both non-local currencies via SWIFT and also local currency via domestic rails.'
        RecipientType:
          type: string
          description: '**Returned values:** `Business`


            The recipient type:

            - `Individual` – An account held by a natural person, requiring the `IndividualRecipient` property.

            - `Business` – An account held by a legal entity, requiring the `BusinessRecipient` property.'
        BusinessRecipient:
          $ref: '#/components/schemas/BusinessRecipient_Response'
        LocalBankTransfer:
          $ref: '#/components/schemas/LocalBankTransferDetails'
        PendingUserAction:
          oneOf:
          - $ref: '#/components/schemas/PendingUserAction'
          - type: 'null'
          description: SCA redirect information returned when registering an `OWNER` Recipient on creation. Returned `null` for `PAYIN`-scope recipients that don't trigger SCA. Omitted when viewing a recipient.
      description: Response body for a Recipient where `PayoutMethodType` is `LocalBankTransfer` and `RecipientType` is `Business`.
      title: CreateLocalBusinessRecipientResponse
    LocalBankTransfer_AUD:
      type: object
      properties:
        BSB:
          type: string
          description: 'Format: 6 digits, optionally with a hyphen after the first 3 (pattern: `^\d{3}-?\d{3}$`).


            The BSB (Bank State Branch) number of the Australian account.'
        AccountNumber:
          type: string
          description: 'Format: 5–10 numeric digits (pattern: `^\d{5,10}$`).


            The account number of the Australian account.'
