        ReportDate:
          type:
          - integer
          - 'null'
          description: Unix timestamp (UTC) of the date and time the report was generated.
        Status:
          type: string
          description: '**Returned values:** `PENDING`, `READY_FOR_DOWNLOAD`, `FAILED`, `EXPIRED`


            The status of the report:

            - `PENDING` – The report is being generated.

            - `READY_FOR_DOWNLOAD` – The report has been created, and can be downloaded.

            - `FAILED` – The report cannot be generated.

            - `EXPIRED` – The report was created, but is no longer available for download (it can be re-run to be downloaded again with fresh data).'
        DownloadFormat:
          type: string
          description: '**Returned values:** `CSV`


            The format in which the report is going to be downloaded.'
        DownloadURL:
          type:
          - string
          - 'null'
          description: The URL at which the report file can be downloaded when the `Status` is `GENERATED`.
        CallbackURL:
          type: string
          description: 'Max. length: 255 characters


