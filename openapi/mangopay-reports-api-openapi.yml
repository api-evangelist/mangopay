        ReportType:
          $ref: '#/components/schemas/ReportType_Legacy_Response'
        Sort:
          type: string
          description: The sorting direction of the CreationDate column. By default, the generated report is sorted by ascending creation date.
        Preview:
          type: boolean
          description: Whether the report is limited to the first 10 lines (and therefore quicker to generate).
        Filters:
          $ref: '#/components/schemas/BeforeDateAfterDateType'
        Columns:
          type: array
          items:
            type: string
          description: '**Returned values:** The `Columns` listed in the <a href="/reports">Reports</a> article, which differ according to the report type.


            The information to be included in the report.'
        ResultCode:
