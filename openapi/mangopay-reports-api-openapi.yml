openapi: 3.2.0
info:
  title: Reference Reports API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Reports
paths:
  /v2.01/{ClientId}/reports/transactions:
    post:
      operationId: reports_create_transactions_report
      summary: Create a Transactions Report
      description: '**Note – Report expiration date**


        A report expires after 24 hours (i.e., you can no longer download it after this period). You can still generate a new report with the same filters and information easily.


        **Note – `BeforeDate` value restriction**


        To ensure that data provided on each report are up-to-date, the `BeforeDate` parameter cannot be greater than the report creation date minus 5 minutes.

        If it is, `BeforeDate` will be automatically set according to this constraint.


        Generate a legacy Transactions Report'
      tags:
      - Reports
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateATransactionsReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateATransactionsReportRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/reports/wallets:
    post:
      operationId: reports_create_wallets_report
      summary: Create a Wallets Report
      description: '**Note – Report expiration date**


        A report expires after 24 hours (i.e., you can no longer download it after this delay). You can still generate a new report with the same filters and information easily.


        Generate a legacy Wallets Report'
      tags:
      - Reports
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAWalletsReportResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAWalletsReportRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/reports/{ReportId}:
    get:
      operationId: reports_view_report_legacy
      summary: View a Report
      description: Retrieve a legacy report
      tags:
      - Reports
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: ReportId
        in: path
        description: The unique identifier of the legacy report.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResponseLegacy'
      security:
      - oauth2: []
  /v2.01/{ClientId}/reports:
    get:
      operationId: reports_list_reports_legacy
      summary: List all Reports
      description: List all legacy reports
      tags:
      - Reports
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: BeforeDate
        in: query
        description: The date before which the report was created (based on the report's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      - name: AfterDate
        in: query
        description: The date after which the report was created (based on the report's `CreationDate` parameter). You can filter on a specific time range by using both the `AfterDate` and `BeforeDate` query parameters.
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllReportsResponseLegacy'
      security:
      - oauth2: []
components:
  schemas:
    CreateAWalletsReportRequestFilters:
      type: object
      properties:
        BeforeDate:
          type: integer
          description: 'The date before which the wallet was created (based on the wallet''s `CreationDate` parameter).


            **Caution:** The time range between the `BeforeDate` and the `AfterDate` cannot exceed 24 months.'
        AfterDate:
          type: integer
          description: 'The date after which the wallet was created (based on the wallet''s `CreationDate` parameter).


            **Caution:** The time range between the `BeforeDate` and the `AfterDate` cannot exceed 24 months.'
        OwnerId:
          type: string
          description: The unique identifier of the user owning the wallet.
        Currency:
          $ref: '#/components/schemas/Currency'
        MinBalanceAmount:
          type: integer
          description: The balance amount above which the wallets are taken into account.
        MinBalanceCurrency:
          type: string
          description: '**Allowed values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the `MinBalanceAmount` value.'
        MaxBalanceAmount:
          type: integer
          description: The balance amount below which the wallets are taken into account.
        MaxBalanceCurrency:
          type: string
          description: '**Allowed values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the `MaxBalanceAmount` value.'
      description: The filtering parameters to optimize the report.
      title: CreateAWalletsReportRequestFilters
    CreateAWalletsReportRequest:
      type: object
      properties:
        Tag:
          $ref: '#/components/schemas/Tag'
        DownloadFormat:
          type: string
          description: '**Possible values:** `CSV`


            The format of the report file.'
        CallbackURL:
          type: string
          description: 'Max. length: 255 characters


            The URL to which the notification indicating that the report is ready to be downloaded will be sent.'
        Sort:
          type: string
          description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


            **Default value**: `CreationDate:ASC`


            The sort direction based on transaction creation date.'
        Preview:
          type: boolean
          description: Whether the report is limited to the first 10 lines (and therefore quicker to generate).
        Filters:
          $ref: '#/components/schemas/CreateAWalletsReportRequestFilters'
          description: The filtering parameters to optimize the report.
        Columns:
          type: array
          items:
            type: string
          description: '**Allowed values:** The `Columns` listed in the <a href="/reports">Reports</a> article, which differ according to the report type.


            The information to be included in the report.'
      title: CreateAWalletsReportRequest
    AuthorId:
      type: string
      description: The unique identifier of the user at the source of the transaction.
      title: AuthorId
    ListAllReportsResponseLegacyArrayReportsItems:
      type: object
      properties:
        Object (Reports):
          $ref: '#/components/schemas/ListAllReportsResponseLegacyArrayReportsItemsObjectReports'
          description: The Report object created by the platform.
      title: ListAllReportsResponseLegacyArrayReportsItems
    CreateATransactionsReportRequest:
      type: object
      properties:
        Tag:
          $ref: '#/components/schemas/Tag'
        DownloadFormat:
          type: string
          description: '**Possible values:** `CSV`


            The format of the report file.'
        CallbackURL:
          type: string
          description: 'Max. length: 255 characters


            The URL to which the notification indicating that the report is ready to be downloaded will be sent.'
        Sort:
          type: string
          description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


            **Default value**: `CreationDate:ASC`


            The sort direction based on transaction creation date.'
        Preview:
          type: boolean
          description: Whether the report is limited to the first 10 lines (and therefore quicker to generate).
        Filters:
          $ref: '#/components/schemas/BeforeDateAfterDateType'
        Columns:
          type: array
          items:
            type: string
          description: '**Allowed values:** The `Columns` listed in the <a href="/reports">Reports</a> article, which differ according to the report type.


            The information to be included in the report.'
      title: CreateATransactionsReportRequest
    BeforeDateAfterDateType:
      type: object
      properties:
        BeforeDate:
          type: integer
          description: '**Returned values:** Any date between today''s date and 36 months in the past.


            The date before which the transaction was created (based on the transaction''s `CreationDate` parameter).


            **Caution:** The time range between the `BeforeDate` and the `AfterDate` cannot exceed 6 months.'
        AfterDate:
          type: integer
          description: 'The date after which the transaction was created (based on the transaction''s `CreationDate` parameter).


            **Caution:** The time range between the `BeforeDate` and the `AfterDate` cannot exceed 6 months.'
        Type:
          type: array
          items:
            type: string
          description: The transaction types to be taken into account.
        ResultCode:
          type: array
          items:
            type: string
          description: The transaction result codes to be taken into account.
        Status:
          type: array
          items:
            type: string
          description: The transaction statuses to be taken into account.
        Nature:
          type: array
          items:
            type: string
          description: '**Returned values:** `REGULAR`, `REPUDIATION`, `REFUND`, `SETTLEMENT`


            The transaction natures to be taken into account.

            - `REGULAR` – Relative to most of the transactions (pay-ins, payouts, and transfers) in a usual workflow.

            - `REPUDIATION` – Automatic withdrawal of funds from the platform''s repudiation wallet as part of the dispute process (when the user has requested a chargeback).

            - `REFUND` – Reimbursement of a transaction to the user (pay-in refund), to a wallet (transfer refund), or of a payout (payout refund, only initiated by Mangopay).

            - `SETTLEMENT` – Transfer made to the repudiation wallet by the platform to settle a lost dispute.'
        WalletId:
          type: string
          description: The unique identifier of the wallet that is to be taken into account.
        AuthorId:
          $ref: '#/components/schemas/AuthorId'
        MinDebitedFundsAmount:
          type: integer
          description: The debited funds amount above which the transactions are taken into account.
        MinDebitedFundsCurrency:
          type: string
          description: '**Returned values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the `MinDebitedFundsAmount` value.'
        MaxDebitedFundsAmount:
          type: integer
          description: The debited funds amount below which the transactions are taken into account.
        MaxDebitedFundsCurrency:
          type: string
          description: '**Returned values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the `MaxDebitedFundsAmount` value.'
        MinFeesAmount:
          type: integer
          description: The fees amount below which the transactions are taken into account.
        MinFeesCurrency:
          type: string
          description: '**Returned values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the `MinFeesAmount` value.'
        MaxFeesAmount:
          type: integer
          description: The fees amount above which the transactions are taken into account.
        MaxFeesCurrency:
          type: string
          description: '**Returned values:** The three-letter <a href="/api-reference/overview/data-formats" target="_blank">ISO 4217 code</a> (EUR, GBP, etc.) of a <a href="/guides/currencies" target="_blank">supported currency</a> (depends on feature, contract, and activation settings).


            The currency of the `MaxFeesAmount` value.'
      description: The filtering parameters to optimize the report.
      title: BeforeDateAfterDateType
    ListAllReportsResponseLegacy:
