openapi: 3.2.0
info:
  title: Reference Users API
  version: 1.0.0
servers:
- url: https://api.sandbox.mangopay.com
  description: Sandbox
- url: https://api.mangopay.com
  description: Production
- url: https://api-mtls.sandbox.mangopay.com
  description: mTLS Sandbox
- url: https://api-mtls.mangopay.com
  description: mTLS Production
- url: '%7BCardRegistrationUrl%7D'
  description: "The full dynamic URL returned by the Create a Card Registration call, including host, path, and query parameters. \n"
- url: '%7BSettlementFileUploadUrl%7D'
  description: 'The unique URL returned by the [POST Create a Settlement and secure URL](/api-reference/settlements/create-settlement) endpoint.


    **Note:** Use the full dynamic URL including the host, path, and all query parameters. The URL is already authenticated, so this call does not require an Authorization header.

    '
tags:
- name: Users
paths:
  /v2.01/{ClientId}/sca/users/natural:
    post:
      operationId: users_create_natural_user_sca
      summary: Create a Natural User (SCA)
      description: 'Register a Natural Payer or Owner (with SCA enrollment)


        **Note – SCA triggered for Owners**


        If `UserCategory` is `OWNER`, this endpoint triggers SCA enrollment.


        Your platform needs to use the returned `PendingUserAction.RedirectUrl` (and add an encoded `returnUrl` query parameter) to redirect the user so they can enroll. Read more about how to redirect them in the SCA session guide.


        In Sandbox, you can bypass SCA by including the word `accept` in the Natural User''s `Email` – for example `accept@example.com` or `john.doe+accept@example.com`.


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `Nationality`

        - `CountryOfResidence`

        - `Address.Country`'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalUserSCAResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateANaturalUserSCARequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/natural/{UserId}:
    put:
      operationId: users_update_natural_user_sca
      summary: Update a Natural User (SCA)
      description: 'Modify details for a Natural Payer or Owner without changing category.


        **Caution – Modification may trigger SCA re-enrollment**


        If `UserCategory` is `OWNER`, modifying the following values changes `UserStatus` to `PENDING_USER_ACTION` and requires re-enrollment in SCA using the returned `PendingUserAction.RedirectUrl`:


        - `Email`

        - `PhoneNumber`

        - `PhoneNumberCountry`


        In Sandbox, you can bypass SCA by including the word `accept` in the Natural User''s `Email` – for example `accept@example.com` or `john.doe+accept@example.com`.


        **Caution – Modification may cause KYC/B verification downgrade**


        If `KYCLevel` is `REGULAR`, modifying the following values triggers a verification downgrade to `LIGHT`:

        - `FirstName`

        - `LastName`

        - `Birthday`

        - `Nationality`


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `Nationality`

        - `CountryOfResidence`

        - `Address.Country`'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalUserSCAResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateANaturalUserSCARequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/natural/{UserId}/category:
    put:
      operationId: users_categorize_natural_user
      summary: Categorize a Natural User
      description: 'Transition a Natural Payer to Owner and enroll them in SCA.


        This endpoint allows you to transition a user whose `UserCategory` is `PAYER` into an `OWNER` by providing the required information and redirecting them on the `PendingUserAction.RedirectUrl` response value to complete SCA enrollment.


        Optionally, you can update the `Email` and provide or update the `PhoneNumber` and `PhoneNumberCountry` before SCA redirection.


        If the user''s `UserCategory` is already `OWNER`, use the POST Enroll a User in SCA endpoint to obtain an SCA session link.


        Read more about SCA redirection **→**


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `Nationality`

        - `CountryOfResidence`'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalUserSCAResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizeANaturalUserRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/legal:
    post:
      operationId: users_create_legal_user_sca
      summary: Create a Legal User (SCA)
      description: 'Register a Legal Payer or Owner (with SCA enrollment).


        **Note – SCA triggered for Owners**


        If `UserCategory` is `OWNER`, this endpoint triggers SCA enrollment. SCA applies to all `LegalPersonType`.


        Your platform needs to use the returned `PendingUserAction.RedirectUrl` (and add an encoded `returnUrl` query parameter) to redirect the user so they can enroll. Read more about how to redirect them in the SCA session guide.


        In Sandbox, you can bypass SCA by including the word `accept` in the Legal User''s `LegalRepresentative.Email` – for example `accept@example.com` or `john.doe+accept@example.com`.


        **Note – Legal representative''s email required for Owners**


        If `UserCategory` is `OWNER`, the `LegalRepresentative.Email` address is required.


        SCA uses this email address for the individual who will complete SCA to build a behavioral biometrics profile and as a backup communication channel. Prior to SCA, it was possible to create a Legal `OWNER` without the `LegalRepresentativeEmail`.


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `HeadquartersAddress.Country`

        - `LegalRepresentative.Nationality`

        - `LegalRepresentative.CountryOfResidence`

        - `LegalRepresentativeAddress.Country`'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalUserSCAResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateALegalUserSCARequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/legal/{UserId}:
    put:
      operationId: users_update_legal_user_sca
      summary: Update a Legal User (SCA)
      description: 'Modify details for a Legal Payer or Owner without changing category.


        **Caution – Modification may trigger SCA re-enrollment**


        If `UserCategory` is `OWNER`, modifying the following values changes `UserStatus` to `PENDING_USER_ACTION` and requires re-enrollment in SCA using the returned `PendingUserAction.RedirectUrl`:


        - `LegalRepresentative.Email`

        - `LegalRepresentative.PhoneNumber`

        - `LegalRepresentative.PhoneNumberCountry`


        In Sandbox, you can bypass SCA by including the word `accept` in the Legal User''s `LegalRepresentative.Email` – for example `accept@example.com` or `john.doe+accept@example.com`.


        **Caution – Modification may cause KYC/B verification downgrade**


        If `KYCLevel` is `REGULAR`, modifying the following values triggers a verification downgrade to `LIGHT`:

        - `LegalRepresentative.FirstName`

        - `LegalRepresentative.LastName`

        - `LegalRepresentative.Birthday`

        - `LegalRepresentative.Nationality`

        - `LegalPersonType`


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `HeadquartersAddress.Country`

        - `LegalRepresentative.Nationality`

        - `LegalRepresentative.CountryOfResidence`

        - `LegalRepresentativeAddress.Country`'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalUserSCAResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateALegalUserSCARequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/legal/{UserId}/category:
    put:
      operationId: users_categorize_legal_user
      summary: Categorize a Legal User
      description: 'Transition a Legal Payer to Owner and enroll them in SCA


        This endpoint allows you to transition a user whose `UserCategory` is `PAYER` into an `OWNER` by providing the required information and redirecting them on the `PendingUserAction.RedirectUrl` response value to complete SCA enrollment.


        SCA applies to all `LegalPersonType`: `BUSINESS`, `ORGANIZATION`, `PARTNERSHIP`, and `SOLETRADER`. In Sandbox the `RedirectUrl` is returned for all legal user types (see legal user integration and SCA triggers in Sandbox).


        Optionally, you can update the `LegalRepresentative.Email` (in not already present) and provide or update the `LegalRepresentative.PhoneNumber` and `LegalRepresentative.PhoneNumberCountry` before SCA redirection.


        If the user''s `UserCategory` is already `OWNER`, use the POST Enroll a User in SCA endpoint to obtain an SCA session link.


        Read more about SCA redirection **→**


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `LegalRepresentative.Nationality`

        - `LegalRepresentative.CountryOfResidence`'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalUserSCAResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategorizeALegalUserRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/{UserId}/enrollment:
    post:
      operationId: users_enroll_user
      summary: Enroll a User in SCA
      description: 'Obtain an SCA redirection link to enroll an Owner user.


        If `UserCategory` is `OWNER`, this endpoint allows you to enroll a user in SCA. To enroll `PAYER` users for the first time, use the PUT Categorize a Natural User or PUT Categorize a Legal User endpoints.


        Your platform needs to retrieve the returned `PendingUserAction.RedirectUrl`, add an encoded `returnUrl` query parameter for them to be returned to after the SCA session, and redirect the user.


        Read more about SCA redirection **→**


        You can use this endpoint to obtain a new session `RedirectUrl`. This is useful to:

        - Enroll Owners created without SCA enrollment

        - Retry enrollment if a previous session was unsuccessful or expired (after 10 minutes)


        Calling this endpoint creates a new valid session that can be used, even if there is one already in progress for the user. Calling this endpoint also doesn''t change the user''s `UserStatus`, even if the session expires or is unsuccessful.


        **Note – This endpoint doesn''t change UserStatus**


        Calling this endpoint does **not** change the user''s status to `PENDING_USER_ACTION` (it stays as `ACTIVE`) and no `USER_ACCOUNT_VALIDATION_ASKED` webhook notification is sent.


        This ensures that legacy users do not become blocked if they are unable to complete SCA successfully.


        **Caution – Legal representative''s email required**


        For `OWNER` users, the `LegalRepresentative.Email` address is required.


        SCA uses this email address to build a behavioral biometrics profile and as a backup communication channel.


        Prior to SCA, it was possible to create a Legal `OWNER` without the `LegalRepresentativeEmail`, so this data may be missing. Calling this endpoint without this data will return an error.'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollUserManageProxyConsentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/{UserId}/consent:
    post:
      operationId: users_manage_proxy_consent
      summary: Manage proxy consent for a User
      description: 'Allows a user to give or revoke consent for SCA-triggering actions taken under proxy.


        Before redirecting the user on the `PendingUserAction.RedirectUrl` returned, ensure you add an encoded `returnUrl` query parameter – read more about SCA redirection.


        On the SCA session, the user can:

        - Give consent for the first time

        - Give consent to additional actions included by your platform

        - Revoke consent (which your platform must allow at any time)


        This endpoint also allows a user to enroll if they aren''t already.


        Read more about proxy consent for SCA-triggering actions **→**"'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollUserManageProxyConsentResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/{UserId}/sca-status:
    get:
      operationId: users_view_user_sca_status
      summary: View the SCA status of a User
      description: 'Retrieve SCA and consent information for a Natural or Legal User.


        This endpoint returns information for an `OWNER` user relating to:

        - Whether or not they are enrolled in SCA – but if they never triggered an SCA enrollment, the endpoint returns a 404

        - Their consent for your platform to take SCA-triggering actions by proxy, if activated for your platform'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewTheSCAStatusOfAUserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
  /v2.01/{ClientId}/sca/users/{UserId}:
    get:
      operationId: users_view_user_sca
      summary: View a User (SCA)
      description: 'Retrieve a Natural or Legal User.


        This endpoint returns the same data as the legacy GET View a User, including the new `PENDING_USER_ACTION` value for `UserStatus`, with two minor changes:

        - The `PendingUserAction` field, which is always `null` on this endpoint

        - For Legal users, the `LegalRepresentative` object, which contains the data for the legal representative


        **Note – `RedirectUrl` not available on this endpoint**


        The `RedirectUrl` is only returned on API calls that trigger SCA.


        To obtain a new session link for an Owner, call the POST Enroll a User in SCA endpoint.


        Read more **→**'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ViewAUserSCAResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/users:
    get:
      operationId: users_list_users
      summary: List all Users
      description: 'List User objects and key details.


        This endpoint returns key information for each user created by the platform.'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 'Start value: `1`


          **Default value:** `1`


          Indicates the index of the page for the pagination.'
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        description: 'Min. value: `1`; max. value: `100`


          **Default value:** `10`


          Indicates the number of items returned for each page of the pagination.'
        required: false
        schema:
          type: integer
      - name: Sort
        in: query
        description: '**Possible values:** `CreationDate:ASC`, `CreationDate:DESC`


          **Default value:** `CreationDate:ASC`


          Indicates the direction in which to sort the list.'
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListAllUsersResponse'
      security:
      - oauth2: []
  /v2.01/{ClientId}/users/natural/{UserId}:
    delete:
      operationId: users_close_natural_user
      summary: Close a Natural User
      description: 'Permanently close a user account so it can no longer be used.


        This endpoint allows your platform to close a Mangopay Account, as per Mangopay''s terms and conditions, in the event that the agreement between the user and the platform comes to an end.


        **Caution – Closure is irreversible**


        Calling this endpoint immediately and permanently changes the `UserStatus` to `CLOSED` if the API call is successful. This cannot be undone, even by Mangopay.


        Your platform can re-register the user using POST Create a Natural User (SCA).


        Closure is only possible if all wallets held by the user are empty. Closure is allowed for both `UserCategory` `OWNER` and `PAYER`.


        When a User is closed (whether via this endpoint or by Mangopay):

        - The `UserStatus` changes to `CLOSED` (and the `USER_ACCOUNT_CLOSED` webhook is sent)

        - The user has inflows and outflows blocked (and the relevant webhooks are sent)

        - The user object remains available via the API and Dashboard for historical purposes


        Closing a user account does not affect Mangopay''s data retention obligations or processes. Personal data associated with the closed account will be retained in accordance with Mangopay''s data retention policies.


        **Note – Do not overuse OAuth token endpoint if automating calls**


        If you are writing a script to close a set of users, ensure you do not call the OAuth token endpoint before each DELETE call. You must use your authentication for the full duration of its lifetime, as described in the authentication guide.


        Overuse of the OAuth token endpoint is a security and performance risk and may result in preventative action from Mangopay.'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '204':
          description: No Content – Closure was successful
          content:
            application/json:
              schema:
                type: object
                properties: {}
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - oauth2: []
    put:
      operationId: users_update_natural_user
      summary: Update a Natural User
      description: '**Caution - Deprecated endpoint**


        The legacy User endpoints are deprecated. This endpoint will stop working and return an error after **Dec 15, 2025**.


        These endpoints were made redundant by the equivalent SCA-enabled endpoints during the introduction of SCA.


        Instead of calling this endpoint to change the `UserCategory` from `PAYER` to `OWNER`, your platform must call PUT Categorize a Natural User. You must also redirect the user on the `PendingUserAction.RedirectUrl` returned so they can enroll in SCA.


        If you are not changing the `UserCategory`, then call the PUT Update a Natural User (SCA) endpoint instead of this deprecated endpoint. SCA re-enrollment is required if your platform changes the `Email`, `PhoneNumber`, or `PhoneNumberCountry`.


        **Caution – Modification may cause KYC/B verification downgrade**


        If `KYCLevel` is `REGULAR`, modifying the following values triggers a verification downgrade to `LIGHT`:

        - `FirstName`

        - `LastName`

        - `Birthday`

        - `Nationality`


        **Note – Country-based restrictions apply to users**


        Due to Mangopay''s country restrictions, it is not possible to use blocked countries as the following:

        - `Nationality`

        - `CountryOfResidence`

        - `Address.Country`


        Update a Natural User'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
        required: true
        schema:
          type: string
      - name: UserId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NaturalUserResponse'
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      deprecated: true
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateANaturalUserRequest'
      security:
      - oauth2: []
  /v2.01/{ClientId}/users/legal/{UserId}:
    delete:
      operationId: users_close_legal_user
      summary: Close a Legal User
      description: 'Permanently close a user account so it can no longer be used.


        This endpoint allows your platform to close a Mangopay Account, as per Mangopay''s terms and conditions, in the event that the agreement between the user and the platform comes to an end.


        **Caution – Closure is irreversible**


        Calling this endpoint immediately and permanently changes the `UserStatus` to `CLOSED` if the API call is successful. This cannot be undone, even by Mangopay.


        Your platform can re-register the user using POST Create a Legal User (SCA).


        Closure is only possible if all wallets held by the user are empty. Closure is allowed for both `UserCategory` `OWNER` and `PAYER` and for all types of Legal user (Business, Partnership, Organization, Soletrader).


        When a User is closed (whether via this endpoint or by Mangopay):

        - The `UserStatus` changes to `CLOSED` (and the `USER_ACCOUNT_CLOSED` webhook is sent)

        - The user has inflows and outflows blocked (and the relevant webhooks are sent)

        - The user object remains available via the API and Dashboard for historical purposes


        Closing a user account does not affect Mangopay''s data retention obligations or processes. Personal data associated with the closed account will be retained in accordance with Mangopay''s data retention policies.


        **Note – Do not overuse OAuth token endpoint if automating calls**


        If you are writing a script to close a set of users, ensure you do not call the OAuth token endpoint before each DELETE call. You must use your authentication for the full duration of its lifetime, as described in the authentication guide.


        Overuse of the OAuth token endpoint is a security and performance risk and may result in preventative action from Mangopay.'
      tags:
      - Users
      parameters:
      - name: ClientId
        in: path
        description: Platform's API account identifier, associated with the API key.
