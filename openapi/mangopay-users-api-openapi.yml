components:
  schemas:
    NaturalUserScaResponsePendingUserAction:
      type: object
      properties:
        RedirectUrl:
          type: string
          description: 'The URL to which to redirect the user to perform strong customer authentication (SCA) via a Mangopay-hosted webpage. This value is a variable and should not be hardcoded.


            The SCA session link expires 10 minutes after it''s generated.


            **Caution:** Before redirecting the user on this URL, you must add the query parameter `ReturnUrl`  with the percent-encoded URL to which you want the SCA session to return the user after authentication (whether successful or not).


            For more details, see [How to redirect a user for an SCA session](/guides/sca/session#how-to-redirect-a-user-for-sca).'
      description: Object containing the `RedirectUrl` needed for SCA redirection if triggered by the API call (otherwise returned `null`).
      title: NaturalUserScaResponsePendingUserAction
    LegalUserSCAResponse:
      type: object
      properties:
        Name:
          type: string
          description: 'Max. length: 255 characters


            The registered legal name of the entity. The `Name` value should be the one registered with the relevant national authority.'
        LegalPersonType:
          type: string
          description: '**Returned values:** BUSINESS, PARTNERSHIP, ORGANIZATION, SOLETRADER


            The type of legal user. For information on which `LegalPersonType` to use for a particular local legal structure, see the <a href="/guides/users/verification/requirements" target="_blank">verification requirements</a>.


            **Caution:** Modification of the `LegalPersonType` may result in a <a href="/guides/users/verification/downgrade" target="_blank">verification downgrade</a>.'
        LegalRepresentative:
          $ref: '#/components/schemas/LegalRepresentative_Response'
        ProofOfRegistration:
          type:
          - string
          - 'null'
          description: The `Id` of the KYC Document whose `Type` is `REGISTRATION_PROOF` if validated for the user. If no registration proof is validated, then this value is `null`.
        ShareholderDeclaration:
          type:
          - string
          - 'null'
          description: The `Id` of the KYC Document whose `Type` is `SHAREHOLDERS_DECLARATION` if validated for the user. If no Shareholder Declaration is validated, then this value is `null`.
        Statute:
          type:
          - string
          - 'null'
          description: The `Id` of the KYC Document whose `Type` is `ARTICLES_OF_ASSOCIATION` if validated for the user. If no articles of association document is validated, then this value is `null`.
        CompanyNumber:
          type:
          - string
          - 'null'
          description: 'Required if `UserCategory` is `OWNER` and `LegalPersonType` is `BUSINESS`. Returned `null` if `UserCategory` is `PAYER`.


            The registration number of the entity, assigned by the relevant national authority. For information on the expected format for a specific country, see the [Company number](/guides/users/verification/company-number) guide. To validate the format of a number before submitting documents for verification, use [POST Validate the format of User data](/api-reference/user-data-format/validate-user-data-format).'
        PendingUserAction:
          oneOf:
          - $ref: '#/components/schemas/LegalUserScaResponsePendingUserAction'
          - type: 'null'
          description: Object containing the `RedirectUrl` needed for SCA redirection if triggered by the API call (otherwise returned `null`).
        HeadquartersAddress:
          $ref: '#/components/schemas/LegalUserScaResponseHeadquartersAddress'
          description: 'The legally registered address of the entity''s administrative center.

            This object''s sub-parameters are `null` if the `UserCategory` is `PAYER`.'
        LegalRepresentativeAddress:
          $ref: '#/components/schemas/LegalUserScaResponseLegalRepresentativeAddress'
          description: The address of the entity's legal representative.
        Id:
          $ref: '#/components/schemas/Id'
        Tag:
          $ref: '#/components/schemas/Tag'
        CreationDate:
          $ref: '#/components/schemas/CreationDate'
        PersonType:
          type: string
          description: '**Returned values:** NATURAL, LEGAL


            The type of the user:

            - `NATURAL` – Natural users are individuals (natural persons).

            - `LEGAL` – Legal users are legal entities (legal persons) like companies, non-profits, and sole proprietors.


            The `PersonType` is defined by the endpoint used to create the user and can''t be modified.'
        Email:
          type: string
          description: 'Format: A valid email address


            The email address for the entity.'
        KYCLevel:
          type: string
          description: '**Default value:** `LIGHT`


            **Returned values:** `LIGHT`, `REGULAR`


            The verification status of the user set by Mangopay:

            - `LIGHT` – Unverified, assigned by default to all users.

            - `REGULAR` – Verified, meaning the user has successfully completed the verification process and had the necessary documents validated by Mangopay. Only users whose `UserCategory` is `OWNER` can submit verification documents for validation. Only users whose `KYCLevel` is `REGULAR` can request payouts.'
        TermsAndConditionsAccepted:
          type: boolean
          description: 'Whether the user has accepted Mangopay''s terms and conditions (as defined by your contract, see the [T&Cs guide](/guides/users/terms) for details).


            Must be `true` if `UserCategory` is `OWNER`.'
        TermsAndConditionsAcceptedDate:
          type:
          - integer
          - 'null'
          description: 'The date and time at which the `TermsAndConditionsAccepted` value was set to `true`.


            Returned `null` if `UserCategory` is `PAYER`.'
        UserCategory:
          type: string
          description: '**Possible values:** `PAYER`, `OWNER`, `PLATFORM`


            The [category](/guides/users/categories) of the user:

            - `PAYER` – User who can only make pay-ins to their wallets and transfers to other wallets (as well as refunds for pay-ins and transfers).

            - `OWNER` – User who can also receive transfers to their wallets. Owners are able to request [KYC verification](/guides/users/verification), which if successful gives them the `KYCLevel` of `REGULAR` and the ability to request payouts.

            - `PLATFORM` – Single specific user that represents the platform. The `PLATFORM` value is only assigned by Mangopay and may be used as part of the validated workflow implemented by the platform.'
        UserStatus:
          type: string
          description: '**Returned values:** `PENDING_USER_ACTION`, `ACTIVE`, `CLOSED`


            The status of the user:


            - `PENDING_USER_ACTION` – The user must enroll in SCA before they can become `ACTIVE`.

            - `ACTIVE` – The user account is active and the user can access Mangopay features.

            - `CLOSED` – The user account is permanently closed. This value is used by Mangopay to close an account following the procedure outlined in the terms and conditions.'
      description: 'Response body for a Legal User. The same schema is returned for `PAYER` and `OWNER` users.


        If `UserCategory` is `PAYER`, the following are returned `null`:

        - `LegalRepresentative.Birthday`

        - `LegalRepresentative.Nationality`

        - `LegalRepresentative.CountryOfResidence`

        - `LegalRepresentative.Email`

        - All `HeadquartersAddress` sub-properties

        - `CompanyNumber`

        - `TermsAndConditionsAcceptedDate`'
      title: LegalUserSCAResponse
    LegalRepresentative_CreatePayer_Request:
      type: object
      properties:
        FirstName:
          type: string
          description: "Min. length: 1; max. length: 100 \n\nThe first name of the legal representative."
        LastName:
          type: string
          description: "Min. length: 1; max. length: 100 \n\nThe last name of the legal representative."
        PhoneNumber:
          type: string
          description: "Format: International E.164 standard (preceded by plus sign and country code) or local format. \n\nThe legal representative's phone number. The local format (recommended) requires `PhoneNumberCountry` to ensure correct formatting.\n\nIf present, the phone number forms part of card transaction data that is passed to issuers to improve authentication rates."
        PhoneNumberCountry:
          type: string
          description: "Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats)). \n\nRequired if the `PhoneNumber` is provided in local format (recommended), to render the value in the E.164 standard."
      required:
      - FirstName
      - LastName
      description: Information about the legal representative declared for a `PAYER` Legal User.
      title: LegalRepresentative_CreatePayer_Request
    CreateNaturalOwnerSCARequest:
      type: object
      properties:
        FirstName:
          type: string
          description: 'Min. length: 1; max. length: 100


            The first name of the individual.'
        LastName:
          type: string
          description: 'Min. length: 1; max. length: 100


            The last name of the individual.'
        Tag:
          $ref: '#/components/schemas/Tag'
        Email:
          type: string
          description: 'Format: A valid email address


            The individual''s email address.'
        PhoneNumber:
          type: string
          description: 'Format: International E.164 standard (preceded by plus sign and country code) or local format


            The individual''s phone number. The local format (recommended) requires `PhoneNumberCountry` to ensure correct formatting.


            If present, the phone number forms part of card transaction data that is passed to issuers to improve authentication rates.


            For users with `UserCategory` `OWNER` , the phone number is used to pre-populate the SCA session for them to confirm and receive an SMS OTP. If the individual modifies the phone number during the session, this data is not updated in the API.'
        PhoneNumberCountry:
          type: string
          description: 'Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats))


            Required if the `PhoneNumber` is provided in local format (recommended), to render the value in the E.164 standard.'
        Address:
          $ref: '#/components/schemas/Address_SubPropsRequired'
        TermsAndConditionsAccepted:
          type: boolean
          description: 'Whether the user has accepted Mangopay''s terms and conditions (as defined by your contract, see the [T&Cs guide](/guides/users/terms) for details).


            Must be `true` if `UserCategory` is `OWNER`.'
        UserCategory:
          type: string
          description: '**Allowed values:** `OWNER`


            The [category](/guides/users/categories) of the user:

            - `PAYER` – User who can only make pay-ins to their wallets and transfers to other wallets (as well as refunds for pay-ins and transfers).

            - `OWNER` – User who can also receive transfers to their wallets. Owners are able to request [KYC verification](/guides/users/verification), which if successful gives them the `KYCLevel` of `REGULAR` and the ability to request payouts.'
        Birthday:
          type: integer
          description: "Required if `UserCategory` is `OWNER`. \n\nThe date of birth of the individual. \n\n**Note:** This is a Unix timestamp in UTC. Ensure you convert your timezone to UTC to avoid midnight being interpreted as the day before."
        Nationality:
          type: string
          description: "Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats)) \n\nRequired if `UserCategory` is `OWNER`. The nationality of the individual."
        CountryOfResidence:
          type: string
          description: "Format: Two-letter country code ([ISO 3166-1 alpha-2 format](/api-reference/overview/data-formats)) \n\nRequired if `UserCategory` is `OWNER`. The country of residence of the individual."
        Occupation:
          type: string
          description: The occupation of the individual.
        IncomeRange:
          type: integer
          description: '**Allowed values:** `1`, `2`, `3`, `4`, `5`, `6`, `null`.


            The bracket indicating the income of the individual. The brackets are:

            - 1: < 18K

            - 2: 18K - 30K

            - 3: 30K - 50K

            - 4: 50K - 80K

            - 5: 80K - 120K

            - 6: > 120K'
        ScaContext:
          type: string
          description: '**Possible values:** `USER_PRESENT`, `USER_NOT_PRESENT`


            **Default value:** `USER_PRESENT`


            The SCA context of the request, which is **required** if the `OWNER` value is being assigned for `UserCategory`:

            - `USER_PRESENT` – The user is on session during `OWNER` account creation and can enroll in SCA at the same time. The platform must [redirect the user](/guides/sca/session) using the `PendingUserAction.RedirectUrl` returned so that the user can complete the SCA session.

            - `USER_NOT_PRESENT` – The platform has explicit permission from Mangopay to create the `OWNER` user account without simultaneous SCA enrollment (see [asynchronous SCA enrollment](/guides/sca/proxy-management#user-account-creation)).


            **Note:** On User endpoints, `ScaContext` is not returned in the API response as it does not form part of the User data – it''s only related to the action being performed on the user.'
      required:
      - FirstName
      - LastName
      - Email
      - TermsAndConditionsAccepted
      - UserCategory
      - Birthday
      - Nationality
      - CountryOfResidence
      - ScaContext
      description: 'Request body for creating a Natural User with `UserCategory` `OWNER`.


        Owners must provide additional data, accept Mangopay''s T&Cs, and enroll in SCA via the `PendingUserAction.RedirectUrl` returned.'
      title: CreateNaturalOwnerSCARequest
